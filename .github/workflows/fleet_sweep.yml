name: fleet sweep

# What the console asked for, started.
#
# One Supabase project per client, one subdomain each (the owner's decision
# of 7 October). The owner asks for a client's build, or for a release train,
# from the platform console's Fleet view. The console holds no token for
# GitHub and never will: a token in the application's secrets is a token in
# every host the application serves. So the console writes a row —
# erp_meta.fleet_request (20261011020000) — and this sweep, with the
# repository's own token, claims the oldest open rows and starts the runs
# they ask for:
#
#   build    deployment_from_empty.yml, with the client's code, carrying on
#            where a build stopped when the request says so;
#   release  deploy.yml, with the targets the owner named (all, control,
#            demonstration, or clients by code);
#   rename   fleet_rename.yml, with the client's code, the address it is at,
#            the one it moves to and the request's id: that run settles the
#            request itself, once it knows how the rename went;
#   export   fleet_export.yml, with the client's code and the request's id:
#            that run settles the request too, made or failed, so a retire
#            that waits for an export never waits on one that failed unseen;
#   sync     fleet_sync.yml, with the client's code: its staff, and whether
#            its own organisation is suspended, made to follow the register
#            at once (a suspension, a reinstatement or an offboarding asks
#            for it), rather than at the next hourly sync. Settled once the
#            run is started: the run writes on the client's row what it
#            changed, and the hourly sync follows the register all the same.
#
# Renames, exports and syncs are claimed only from a control plane that knows
# them (20261012030000, which holds the addresses a client was moved from in
# erp_meta.deployment_previous_address): before it, the claim refuses a kind
# it does not know, and asking for one would stop every tick.
#
# A workflow_dispatch created with GITHUB_TOKEN does start a run (it is one of
# the two event kinds that do), which is the whole trick. Each claimed row is
# settled with whether the dispatch was accepted, or left claimed for the run
# that settles it; what the run then did is recorded on the deployment's own
# row by the run itself.
#
# When it runs. The control plane wakes it the moment a request is written
# (20261012010000: a trigger on erp_meta.fleet_request posts this workflow's
# workflow_dispatch through pg_net, with the token release.yml keeps in its
# vault from CLOVEERP_SWEEP_TOKEN), so a press of the button starts a run
# within a minute. The ten-minute schedule stays as the fallback: without the
# token, with GitHub refusing it, or with the wake lost, the request waits at
# most one tick.
#
# One build at a time, across the whole fleet. A build from empty replays
# every migration into a Micro project for hours, and two of them at once
# share one Management API allowance and one owner's attention; and on 8
# October nothing stopped five builds starting in one tick. So before
# claiming, the sweep asks GitHub whether a deployment_from_empty.yml run
# still has its build job to finish (the question app.yml asks), and asks the
# register whether a build was started in the last few minutes (GitHub can
# take a moment to list a run it has just accepted). While either says so,
# only releases, renames, exports and syncs are claimed, and the waiting build
# requests are told why on their deployment's row; otherwise at most one
# build is started in a tick.
#
# Nothing here touches a client's database: it reads and writes the control
# plane's register over CLOVEERP_LIVE_DATABASE_URL, and asks GitHub.

on:
  schedule:
    - cron: '*/10 * * * *'
  # The control plane's wake (20261012010000), the schedule's fallback, and
  # anybody who wants a tick now.
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# One sweep at a time: two sweeps could not claim the same row (the claim is
# a single UPDATE with SKIP LOCKED), but two would race GitHub's rate limit,
# and both could start a build. A wake that arrives while a sweep runs waits
# behind it; GitHub keeps one waiting run per group and cancels an older
# waiting one, which is harmless here, because the one that runs claims
# everything that is open.
concurrency:
  group: fleet-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: start what the console asked for
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CP_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      # gh reads the repository from here, which is what the first request
      # from the console needed when the job had no checkout ("not a git
      # repository", 8 October); named still, so nothing depends on the
      # checkout for it.
      GH_REPO: ${{ github.repository }}
    steps:
      # For supabase/ci/fleet_register.sh: a waiting build is told why on
      # its deployment's row.
      - uses: actions/checkout@v4

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Claim and start
        run: |
          set -euo pipefail
          if [[ -z "${CP_URL}" ]]; then
            echo "::error::CLOVEERP_LIVE_DATABASE_URL is not set, so the console's requests cannot be read. Nothing was started."
            exit 1
          fi
          echo "::add-mask::${CP_URL}"
          if [[ "$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tAc "select to_regprocedure('erp_meta.claim_fleet_request(text)') is not null")" != "t" ]]; then
            echo "the control plane has no register of deployments yet (20261011020000 not released); nothing to sweep"
            exit 0
          fi
          # The claim that takes only the kinds it is given (20261012010000).
          # A control plane released before it has only the claim that takes
          # the oldest request of any kind.
          kinded=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tAc "select to_regprocedure('erp_meta.claim_fleet_request(text,text[])') is not null")
          # Renames, exports and syncs (20261012030000), which never wait for
          # a build. Its own table, not only the rename's routine: a claim
          # from before it would refuse a sync.
          lifecycle=f
          if [[ "$kinded" == t ]]; then
            lifecycle=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tAc "select to_regprocedure('erp_meta.finish_deployment_rename(text,text)') is not null and to_regclass('erp_meta.deployment_previous_address') is not null")
          fi

          # Is a deployment being built? hold says why not to start another
          # build this tick, in words; running names the run when GitHub
          # says one is running.
          hold=""
          running=""
          R="repos/${GH_REPO}"
          if ! unfinished=$(gh api "${R}/actions/workflows/deployment_from_empty.yml/runs?per_page=30" \
                              --jq '.workflow_runs[] | select(.status != "completed") | .id'); then
            hold="GitHub could not be asked whether a build is running"
          else
            for id in $unfinished; do
              # A run whose build job is not listed yet is counted as building,
              # as app.yml counts it.
              if ! open=$(gh api "${R}/actions/runs/${id}/jobs" --jq '[.jobs[] | select(.name | test("^build .* from empty$"))]
                             | if length == 0 then "its build job not started yet"
                               else (map(select(.status != "completed")) | if length == 0 then "" else .[0].name end) end'); then
                hold="GitHub could not be asked about run ${id}"
                break
              fi
              if [[ -n "$open" ]]; then
                running="run ${id}, ${open}"
                hold="another deployment is being built (${running})"
                break
              fi
            done
          fi
          if [[ -z "$hold" ]]; then
            recent=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA <<'SQL'
          select count(*) from erp_meta.fleet_request r
           where r.kind = 'build' and r.status = 'done' and r.settled_at > now() - interval '5 minutes';
          SQL
            )
            if [[ "$recent" != 0 ]]; then
              hold="a build was started in the last five minutes, and GitHub may not list its run yet"
            fi
          fi
          if [[ -n "$hold" ]]; then
            echo "no build is started this tick: ${hold}; releases are"
          fi

          started=0
          # At most five in one sweep: a sweep is a tick, not a drain, and
          # each dispatch is a run of its own that the next tick can follow.
          for _ in 1 2 3 4 5; do
            if [[ -z "$hold" ]]; then kinds='{build,release}'; else kinds='{release}'; fi
            if [[ "$lifecycle" == t ]]; then kinds="${kinds%\}},rename,export,sync}"; fi
            if [[ "$kinded" == t ]]; then
              # On standard input, not -c: psql substitutes :'run' only there.
              claim=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA -v run="${GITHUB_RUN_ID}" -v kinds="${kinds}" <<'SQL'
          select coalesce(erp_meta.claim_fleet_request(:'run', :'kinds'::text[])::text, '');
          SQL
              )
            else
              if [[ -n "$hold" ]]; then
                # This control plane can only claim the oldest request. If that
                # is a build, it waits, and whatever is behind it waits with it
                # until 20261012010000 is released.
                next=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA <<'SQL'
          select r.kind from erp_meta.fleet_request r where r.status = 'requested' order by r.created_at limit 1;
          SQL
                )
                if [[ "$next" == build ]]; then
                  echo "the oldest request is a build, which waits; this control plane cannot claim past it (20261012010000 not released), so nothing more is claimed this tick"
                  break
                fi
              fi
              claim=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA -v run="${GITHUB_RUN_ID}" <<'SQL'
          select coalesce(erp_meta.claim_fleet_request(:'run')::text, '');
          SQL
              )
            fi
            [[ -n "$claim" ]] || break
            id=$(jq -r '.id' <<< "$claim")
            kind=$(jq -r '.kind' <<< "$claim")
            outcome=""
            # A run that settles the request itself, when it was started.
            settled_by=""
            case "$kind" in
              build)
                code=$(jq -r '.payload.code // empty' <<< "$claim")
                resume=$(jq -r 'if .payload.resume == true then "true" else "false" end' <<< "$claim")
                if [[ -n "$hold" ]]; then
                  # Only the claim of any kind gets here, when a build arrived
                  # between the look and the claim. Claimed, it cannot be put
                  # back, so it is started, as every build was before.
                  echo "::warning::a build for ${code} was claimed while ${hold}; it is started anyway, because this control plane cannot hand a claim back (20261012010000 not released)."
                fi
                # The code reaches a workflow input, so its shape is checked
                # here as the register checks it.
                if ! [[ "$code" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
                  outcome="failure: '${code}' is not a code"
                elif gh workflow run deployment_from_empty.yml --ref main -f "code=${code}" -f "resume=${resume}" 2>&1; then
                  outcome="success: deployment_from_empty.yml started for ${code}${resume:+ (resume ${resume})}"
                else
                  outcome="failure: GitHub refused to start deployment_from_empty.yml for ${code}"
                fi
                # One build a tick, started or refused: the next waits for the
                # next tick, which asks GitHub again.
                hold="${hold:-this sweep has had its one build (${code})}"
                ;;
              release)
                targets=$(jq -r '(.payload.targets // []) | map(select(test("^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"))) | join(",")' <<< "$claim")
                if [[ -z "$targets" ]]; then
                  outcome="failure: no target named"
                elif gh workflow run deploy.yml --ref main -f "targets=${targets}" 2>&1; then
                  outcome="success: deploy.yml started for ${targets}"
                else
                  outcome="failure: GitHub refused to start deploy.yml for ${targets}"
                fi
                ;;
              rename)
                code=$(jq -r '.payload.code // empty' <<< "$claim")
                from=$(jq -r '.payload.from // empty' <<< "$claim")
                to=$(jq -r '.payload.to // empty' <<< "$claim")
                # Each reaches a workflow input, so each is checked here as the
                # register checks it.
                if ! [[ "$code" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ && "$from" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ \
                        && "$to" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
                  outcome="failure: the request does not name a code, the address it is at and one to move to"
                elif ! [[ "$id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
                  outcome="failure: '${id}' is not a request's id"
                elif gh workflow run fleet_rename.yml --ref main -f "code=${code}" -f "from=${from}" -f "to=${to}" -f "request=${id}" 2>&1; then
                  settled_by="fleet_rename.yml started for ${code} (${from} to ${to}); that run settles this request"
                else
                  outcome="failure: GitHub refused to start fleet_rename.yml for ${code}"
                fi
                ;;
              export)
                code=$(jq -r '.payload.code // empty' <<< "$claim")
                # Left claimed when started: fleet_export.yml settles it,
                # with whether the export was made (its last step runs
                # whatever happened before it).
                if ! [[ "$code" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
                  outcome="failure: '${code}' is not a code"
                elif ! [[ "$id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
                  outcome="failure: '${id}' is not a request's id"
                elif gh workflow run fleet_export.yml --ref main -f "code=${code}" -f "request=${id}" 2>&1; then
                  settled_by="fleet_export.yml started for ${code}; that run settles this request"
                else
                  outcome="failure: GitHub refused to start fleet_export.yml for ${code}"
                fi
                ;;
              sync)
                code=$(jq -r '.payload.code // empty' <<< "$claim")
                if ! [[ "$code" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
                  outcome="failure: '${code}' is not a code"
                elif gh workflow run fleet_sync.yml --ref main -f "code=${code}" 2>&1; then
                  outcome="success: fleet_sync.yml started for ${code}"
                else
                  outcome="failure: GitHub refused to start fleet_sync.yml for ${code}; the hourly sync follows the register all the same"
                fi
                ;;
              *)
                outcome="failure: unknown request kind ${kind}"
                ;;
            esac
            if [[ -n "$settled_by" ]]; then
              # Left claimed: the run settles it (fleet_rename.yml and
              # fleet_export.yml settle a run that stopped too).
              echo "request ${id} (${kind}): ${settled_by}"
              echo "- request ${id} (${kind}): ${settled_by}" >> "$GITHUB_STEP_SUMMARY"
              started=$((started + 1))
              continue
            fi
            psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA -v id="${id}" -v outcome="${outcome}" > /dev/null <<'SQL'
          select erp_meta.settle_fleet_request(:'id'::uuid, :'outcome');
          SQL
            echo "request ${id} (${kind}): ${outcome}"
            echo "- request ${id} (${kind}): ${outcome}" >> "$GITHUB_STEP_SUMMARY"
            started=$((started + 1))
          done

          # The builds that wait, told why on their deployment's row, once
          # each: the Fleet view shows the request as queued for as long as
          # another build runs, which is hours, and says nothing else.
          if [[ -n "$running" ]]; then
            waiting=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA <<'SQL'
          select r.payload ->> 'code'
            from erp_meta.fleet_request r
           where r.kind = 'build' and r.status = 'requested'
             and not exists (select 1 from erp_meta.deployment_event e
                              where e.code = r.payload ->> 'code' and e.phase = 'dispatch' and e.status = 'note'
                                and e.at >= r.created_at and e.detail like 'waiting:%')
           order by r.created_at;
          SQL
            ) || { echo "::warning::the register could not say which builds wait; they are started when the build that runs has ended, as before."; waiting=""; }
            for code in $waiting; do
              [[ "$code" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || continue
              CLOVEERP_LIVE_DATABASE_URL="$CP_URL" supabase/ci/fleet_register.sh event "$code" dispatch note \
                "waiting: another deployment is being built (${running}); this build starts at the first sweep after that one ends" \
                || echo "::warning::${code}'s row could not be told that its build waits; it is started when the build that runs has ended, as before."
              echo "- ${code}: build waits, ${hold}" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          if [[ "$started" -eq 0 ]]; then
            echo "nothing claimed${hold:+ (no build could be: ${hold})}"
          else
            echo "- ${started} request(s) claimed and settled" >> "$GITHUB_STEP_SUMMARY"
          fi

name: release

# One release of main to one deployment: the body of what deploy.yml used to
# do to the live database, now done twice.
#
# On 6 October the owner moved the demonstration out of production into a
# Supabase project of its own, Clove ERP Demo, served at demo.cloveerp.com by
# the same application. deploy.yml calls this once for the demonstration and,
# only when that succeeded, once for production, so every release is
# rehearsed on a real deployment before it reaches the one customers use, and
# a failure anywhere on the demonstration leaves production exactly as it was.
#
# The steps are the ones deploy.yml has always run, with the comments that
# record why each is the way it is, and they run the same on both: the
# exposed-schema check, the replay with --include-all and its deadlock
# retry, the release record, the functions and the dispatch schedule, the
# demonstration catch-up, and the proof (erp.platform_assurance() and the
# whole-database reconciliation). What differs is the connection, the project
# and the kind the database is told it is (erp_meta.mark_deployment(),
# 20261010060000) — and the one-off repairs for live's history, which only
# ever ran against production and still do.
#
# Since 7 October a target may also be a client: one Supabase project per
# client, served at <code>.cloveerp.com (the owner's decision; the plan is in
# the pull request that made it). A client's connection string is not a
# repository secret: the control plane's vault holds it, under a name the
# register gives (erp_meta.deployment, named by the project's ref), and this
# reads it over CLOVEERP_LIVE_DATABASE_URL when vault_secret_name is given.
# What the kind changes is said at each step; the body is the same for all
# three, which is the point.
#
# Called, never run on its own: it has no trigger but workflow_call.

on:
  workflow_call:
    inputs:
      target:
        description: "demonstration, production, or a client's code (its address, <code>.cloveerp.com)."
        type: string
        required: true
      kind:
        description: "demonstration, production or client. Empty: demonstration and production are themselves, anything else is a client."
        type: string
        default: ''
      project_ref:
        description: "The target project's ref."
        type: string
        required: true
      other_project_ref:
        description: "The other deployment's ref, which the target's connection string must not name."
        type: string
        required: true
      other_project_refs:
        description: "Every other deployment's ref, comma-separated, none of which the target's connection string may name. In addition to other_project_ref."
        type: string
        default: ''
      secret_name:
        description: 'The repository secret the connection string comes from, named in what this says; or, for a client, the name of its vault entry.'
        type: string
        required: true
      vault_secret_name:
        description: "A client: the control plane's vault entry holding the connection string (cloveerp:deployment:<ref>:db_url), read over control_plane_database_url. Empty: the database_url secret is the connection."
        type: string
        default: ''
      app_origin:
        description: "Where this deployment is served from (https://cloveerp.com, https://demo.cloveerp.com, https://<code>.cloveerp.com), recorded in the database once it can hold it."
        type: string
        default: ''
      dispatch_url:
        description: "The target project's dispatch function."
        type: string
        required: true
      mark_applied:
        type: boolean
        default: false
      mark_applied_through:
        type: string
        default: ''
      repair_gateway_bodies:
        type: boolean
        default: false
      owner_email:
        description: "The platform owner the demonstration's staff list must be, and only be."
        type: string
        default: ''
      demonstration_skipped:
        description: 'Production released without the demonstration, by the break-glass input of deploy.yml.'
        type: boolean
        default: false
    secrets:
      database_url:
        required: false
      supabase_access_token:
        required: false
      control_plane_database_url:
        description: "CLOVEERP_LIVE_DATABASE_URL: where a client's connection string is read from (vault_secret_name), and where its release is recorded."
        required: false
      sweep_token:
        description: "CLOVEERP_SWEEP_TOKEN, production only and optional: a fine-grained GitHub token with Actions read and write on this repository, kept in the control plane's vault so that the control plane can wake fleet_sweep.yml the moment the console asks for something."
        required: false

jobs:
  gate:
    # A client's release asks the register first (20261011050000).
    #
    # A train reads its targets once, at its start, and releases to each
    # client much later, after the demonstration; a client retired in
    # between was still released to, and with its project deleted that
    # release failed and held the control plane back. So, under the row's
    # lock, erp_meta.begin_deployment_release() says whether the client is
    # still a release target and, if it is, records that a release has
    # started, which the retire door then refuses to overtake. A client that
    # is no longer a target is released nothing, and this ends green, so the
    # train carries on to the control plane.
    #
    # A target is a client whose database is up: built, live, suspended (its
    # address is not served, its project runs on and keeps up with every
    # release) or retiring (offboarding, up until it is purged), since
    # 20261012030000. A control plane before that never answers suspended or
    # retiring, because nothing there could make a client either.
    #
    # Production and the demonstration are not in the register and always
    # go on.
    name: may the ${{ inputs.target }} be released
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.ask.outputs.go }}
    env:
      TARGET: ${{ inputs.target }}
      KIND: ${{ inputs.kind || (inputs.target == 'demonstration' && 'demonstration') || (inputs.target == 'production' && 'production') || 'client' }}
      CP_URL: ${{ secrets.control_plane_database_url }}
    steps:
      - name: Install the psql client
        if: env.KIND == 'client'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Ask the register
        id: ask
        run: |
          set -euo pipefail
          if [[ "${KIND}" != client ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "${TARGET} is not a client: released as always"
            exit 0
          fi
          if [[ -z "${CP_URL}" ]]; then
            echo "::error::${TARGET} is a client, and no control plane connection was given to ask the register whether it may be released. Nothing was released."
            exit 1
          fi
          # A control plane released before 20261011050000 cannot be asked:
          # it has no retire door either (the two arrive together), so
          # nothing can be retired yet and the client is released as before.
          # This train's control plane step then brings it the routine.
          has=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tAc "select to_regprocedure('erp_meta.begin_deployment_release(text,text)') is not null")
          if [[ "$has" != t ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "::notice::the control plane predates 20261011050000, so the register cannot be asked yet; ${TARGET} is released as before."
            exit 0
          fi
          # On standard input, not -c: psql substitutes :'code' only there.
          status=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA -v code="${TARGET}" -v run="${GITHUB_RUN_ID}" <<'SQL'
          select erp_meta.begin_deployment_release(:'code', :'run');
          SQL
          )
          case "$status" in
            built|live|suspended|retiring)
              echo "go=true" >> "$GITHUB_OUTPUT"
              echo "${TARGET} is ${status}: released, and the register says a release has started" ;;
            *)
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${TARGET} is ${status:-not in the register}, so it is no release target. Nothing was released, and the train carries on."
              echo "- ${TARGET}: ${status:-not in the register}; nothing released" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  release:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    name: release to the ${{ inputs.target }}
    runs-on: ubuntu-latest
    # A replay that blocks on a lock rather than deadlocking gets no 40P01 and
    # no retry — it just waits. On the default six-hour job timeout it would
    # wait holding the deploy-live concurrency group and, worse, holding the
    # scheduler paused: every deploy behind it queued and the platform's clock
    # stopped, for six hours, with nothing red to say so. An hour is longer
    # than any replay this repository has run and short enough to notice.
    # The wait for a copy off the platform ("No copy of this database is
    # being made") comes before the replay and inside the same limit: thirty
    # questions a minute apart, and GitHub's answers, up to about thirty-five
    # minutes, which given up on still leaves the release to carry on. So the
    # job has the hour for the replay and what follows it, plus that wait:
    # ninety-five minutes. Cancelling still runs the resume step, which is
    # always().
    timeout-minutes: 95
    env:
      # DB_URL is not here: "Resolve the connection" below writes it to the
      # job's environment, from the database_url secret or from the control
      # plane's vault, so that every step after it reads one variable
      # whichever way the connection came.
      TARGET: ${{ inputs.target }}
      # demonstration and production are the kinds they always were; any
      # other target is a client, unless the caller says otherwise.
      KIND: ${{ inputs.kind || (inputs.target == 'demonstration' && 'demonstration') || (inputs.target == 'production' && 'production') || 'client' }}
      PROJECT_REF: ${{ inputs.project_ref }}
      OTHER_REF: ${{ inputs.other_project_ref }}
      OTHER_REFS: ${{ inputs.other_project_refs }}
      SECRET_NAME: ${{ inputs.secret_name }}
      VAULT_SECRET_NAME: ${{ inputs.vault_secret_name }}
      APP_ORIGIN: ${{ inputs.app_origin }}
      CP_URL: ${{ secrets.control_plane_database_url }}
      # Where pg_cron posts to drain the queues: the project's own dispatch
      # function unless a repository variable says otherwise (deploy.yml). A
      # URL, not a secret — the secret the post carries never leaves the
      # database.
      DISPATCH_URL: ${{ inputs.dispatch_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: "Deploy the Edge Functions" compares this
          # commit with the one this target last released, which a depth-1
          # checkout does not have.
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Released without the demonstration
        # The break-glass in deploy.yml: production released with the
        # demonstration skipped, which somebody asked for by typing
        # production's ref. Said where nobody can miss it, on every release
        # that does it.
        if: inputs.demonstration_skipped
        run: |
          echo "::warning::this release to ${TARGET} SKIPPED THE DEMONSTRATION (deploy.yml, skip_demonstration, confirmed by typing ${PROJECT_REF}). Nothing in it was rehearsed first."
          {
            echo "## Released without the demonstration"
            echo "**skip_demonstration** was set and production's ref typed to confirm it, so this release"
            echo "reached production without being released to the demonstration first."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: The register still holds the client
        # Asked again, inside the job that touches the client. "Re-run failed
        # jobs" re-runs this job and reuses the gate's go without asking the
        # register again, so a client retired since would be released to;
        # this asks under the row's lock for this attempt, and records a
        # fresh start the retire door will not overtake (20261011050000).
        # A retired client stops here: re-run ALL jobs, or dispatch
        # targets=control, so the train reads the register afresh.
        if: env.KIND == 'client' && env.CP_URL != ''
        run: |
          set -euo pipefail
          has=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tAc "select to_regprocedure('erp_meta.begin_deployment_release(text,text)') is not null")
          if [[ "$has" != t ]]; then
            echo "the control plane predates 20261011050000; nothing to ask"
            exit 0
          fi
          status=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA -v code="${TARGET}" -v run="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" <<'SQL'
          select erp_meta.begin_deployment_release(:'code', :'run');
          SQL
          )
          case "$status" in
            built|live|suspended|retiring) echo "${TARGET} is ${status}" ;;
            *)
              echo "::error::${TARGET} is ${status:-not in the register} since this run read its targets, so nothing was released to it. Re-run ALL jobs, or dispatch the deploy workflow with targets=control, so the train reads the register afresh."
              exit 1 ;;
          esac

      - name: Resolve the connection
        # A deploy that deployed nothing must not be green.
        #
        # And for the demonstration, the first thing a release does, so that a
        # missing CLOVEERP_DEMO_DATABASE_URL stops it here: production is
        # released only after the demonstration has been (deploy.yml), so this
        # failing is production left exactly as it was.
        #
        # A client's connection string is no repository secret at all. The
        # build that made its project generated the password and put the
        # session-pooler URL in the control plane's vault, under the project's
        # ref (deployment_from_empty.yml), the way cloveerp_dispatch_secret is
        # made inside the database and never printed. This reads it from
        # there, over the control plane's own connection, masks it, and hands
        # it to every step after as DB_URL. One route for every client, and
        # a new client adds no secret anywhere.
        env:
          GIVEN_URL: ${{ secrets.database_url }}
        run: |
          set -euo pipefail
          url="${GIVEN_URL}"
          if [[ -z "$url" && -n "${VAULT_SECRET_NAME}" ]]; then
            if [[ -z "${CP_URL}" ]]; then
              echo "::error::${TARGET}'s connection string is read from the control plane's vault (${VAULT_SECRET_NAME}), and no control plane connection was given (CLOVEERP_LIVE_DATABASE_URL). Nothing was applied."
              exit 1
            fi
            if ! [[ "${VAULT_SECRET_NAME}" =~ ^cloveerp:deployment:${PROJECT_REF}:db_url$ ]]; then
              echo "::error::the vault entry named for ${TARGET} (${VAULT_SECRET_NAME}) is not the one for its project (${PROJECT_REF}): entries are named cloveerp:deployment:<ref>:db_url. Nothing was applied."
              exit 1
            fi
            # On standard input, not -c: psql substitutes :'n' only there.
            url=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA -v n="${VAULT_SECRET_NAME}" <<'SQL'
          select decrypted_secret from vault.decrypted_secrets where name = :'n' order by created_at limit 1;
          SQL
            )
            if [[ -z "$url" ]]; then
              echo "::error::the control plane's vault has no entry named ${VAULT_SECRET_NAME}, so ${TARGET} cannot be reached. Its build from empty writes that entry; if the build finished, run the password rotation for it. Nothing was applied."
              exit 1
            fi
            echo "::add-mask::$url"
            echo "connection for ${TARGET}: read from the control plane's vault (${VAULT_SECRET_NAME})"
          fi
          if [[ -z "$url" ]]; then
            if [[ "${KIND}" == demonstration ]]; then
              echo "::error::${SECRET_NAME} is not set, so nothing was released to the demonstration, and production is not released until the demonstration has been. Add the demonstration project's session-pooler connection string as a repository secret, in the same form as CLOVEERP_LIVE_DATABASE_URL, then run this workflow again."
            else
              echo "::error::${SECRET_NAME} is not set. Add the session-pooler connection string as a repository secret; nothing was applied."
            fi
            exit 1
          fi
          echo "DB_URL=$url" >> "$GITHUB_ENV"

      - name: The connection is the ${{ inputs.target }}'s
        # Two secrets, two projects, and nothing but the secret's name between
        # them. A connection string pasted into the wrong one would release the
        # demonstration's way into production: its catch-up, its marker. Every
        # Supabase connection string names its project — the pooler's user is
        # postgres.<ref>, the direct host db.<ref>.supabase.co — so this reads
        # the ref out of it before anything connects.
        #
        # With clients there are more than two: the connection must name the
        # target and none of the others, every other deployment the caller
        # knows (other_project_refs), so that a vault entry filed under the
        # wrong ref is refused here, before anything connects.
        run: |
          set -euo pipefail
          others=("${OTHER_REF}")
          IFS=',' read -r -a more <<< "${OTHER_REFS}"
          for r in ${more[@]+"${more[@]}"}; do
            r="${r// /}"
            [[ -n "$r" ]] && others+=("$r")
          done
          for ref in "${PROJECT_REF}" "${others[@]}"; do
            if ! [[ "$ref" =~ ^[a-z0-9]{20}$ ]]; then
              echo "::error::a project ref must be 20 lower-case letters and digits; got '${ref}'. Check CLOVEERP_DEMO_PROJECT_REF, CLOVEERP_PROJECT_REF and the register. Nothing was applied."
              exit 1
            fi
          done
          for other in "${others[@]}"; do
            if [[ "${PROJECT_REF}" == "${other}" ]]; then
              echo "::error::the ${TARGET} and another deployment are the same project (${PROJECT_REF}). Nothing was applied."
              exit 1
            fi
          done
          if [[ "${DB_URL}" != *"${PROJECT_REF}"* ]]; then
            echo "::error::${SECRET_NAME} does not name the ${TARGET} project (${PROJECT_REF}). Nothing was applied."
            exit 1
          fi
          for other in "${others[@]}"; do
            if [[ "${DB_URL}" == *"${other}"* ]]; then
              echo "::error::${SECRET_NAME} names another project (${other}), not the ${TARGET} (${PROJECT_REF}). Nothing was applied."
              exit 1
            fi
          done
          echo "${SECRET_NAME} names ${PROJECT_REF}, the ${TARGET} project, and none of ${#others[@]} other(s)"

      - name: The demonstration has been built
        # The demonstration project starts empty, and an empty project is not
        # released into: `supabase db push` would replay six hundred migrations
        # under the pooler's two-minute statement limit, with the suite calls
        # later migrations corrected still in them. It is built once, from
        # empty, by deployment_from_empty.yml, which does neither.
        #
        # Built means the database says it is the demonstration
        # (erp.deployment_kind(), 20261010060000), which only the last step of
        # deployment_from_empty.yml writes, after every migration has applied and
        # the owner is bound. An erp schema is not enough: a build that
        # stopped half-way has one. A release never writes the first marker on
        # the demonstration, it only confirms it. Until then this stops here,
        # and production waits for it.
        #
        # A client's project is built the same way (deployment_from_empty.yml)
        # and says it is a client only at the end of that build.
        if: env.KIND != 'production'
        run: |
          set -euo pipefail
          has=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select to_regprocedure('erp.deployment_kind()') is not null")
          said=""
          if [[ "$has" == "t" ]]; then
            said=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.deployment_kind()")
          fi
          if [[ "$said" != "${KIND}" ]]; then
            echo "::error::the ${TARGET} project (${PROJECT_REF}) does not say it is a ${KIND} deployment (${said:-no marker}): it has not been built, or its build did not finish. Run the deployment-from-empty workflow for it (Actions, deployment from empty, Run workflow; with resume if it stopped part-way), then run this workflow again. The control plane is not released until every deployment before it has been."
            exit 1
          fi
          echo "the ${TARGET} has been built: it says it is a ${KIND} deployment"

      - name: The demonstration's staff list is its owner, and only its owner
        # The demonstration is public: anybody with its address can try to
        # sign in, and its build named the owner (CLOVEERP_PLATFORM_OWNER_EMAIL)
        # bound to their own confirmed sign-in (build_from_empty.sh). A release
        # into it proves that is still so before it applies anything: exactly
        # one ACTIVE row on the platform staff list, the owner, bound to a
        # confirmed sign-in with that address. Revoked rows do not count:
        # revocation is soft (erp_platform_revoke_staff sets revoked_at), a
        # revoked row is never matched by erp_meta.platform_actor(), and
        # counting one here would have refused every release — and so every
        # production release, which waits on this one — for good once anybody
        # had been added and removed (review of #448, COV-3). Any second
        # ACTIVE row is refused by design: staff reach the demonstration only
        # by changing what CLOVEERP_PLATFORM_OWNER_EMAIL means, never from its
        # console.
        #
        # A client's console is the owner's too, from its build, and the owner
        # may add staff there (people who support that client), each bound to
        # a confirmed sign-in of their own. What a client's release proves is
        # narrower: the owner's row is there, bound and confirmed, and no
        # active row is unbound — an unbound row is one anybody who confirms
        # that address would be matched to (20261010063000).
        if: env.KIND != 'production'
        env:
          OWNER_EMAIL: ${{ inputs.owner_email }}
        run: |
          set -euo pipefail
          # The owner as this public log may show them: o…@domain.
          OWNER_SHOWN="${OWNER_EMAIL:0:1}…@${OWNER_EMAIL#*@}"
          if ! [[ "${OWNER_EMAIL}" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]]; then
            echo "::error::CLOVEERP_PLATFORM_OWNER_EMAIL is not set to an email address, so nothing says who may run the ${TARGET}'s console. Nothing was applied."
            exit 1
          fi
          if [[ "${KIND}" == demonstration ]]; then
            staff=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -tA -v owner="${OWNER_EMAIL}" <<'SQL'
          select count(*) || ' ' || count(*) filter (
                   where lower(s.email) = lower(:'owner')
                     and s.staff_role = 'owner'
                     and s.auth_user_id in (select u.id from auth.users u
                                             where lower(u.email) = lower(:'owner')
                                               and u.email_confirmed_at is not null))
            from erp_meta.platform_staff s
           where s.revoked_at is null;
          SQL
            )
            if [[ "$staff" != "1 1" ]]; then
              echo "::error::the demonstration's platform staff list is not exactly ${OWNER_SHOWN}, bound to their confirmed sign-in (active rows: ${staff%% *}; the owner's, bound and confirmed: ${staff##* }). Somebody else may reach its console. Nothing was applied, and production is not released."
              exit 1
            fi
            echo "staff: ${OWNER_SHOWN}, bound to a confirmed sign-in, and nobody else"
          else
            staff=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -tA -v owner="${OWNER_EMAIL}" <<'SQL'
          select count(*) filter (
                   where s.auth_user_id is null
                      or not exists (select 1 from auth.users u
                                      where u.id = s.auth_user_id and u.email_confirmed_at is not null))
                 || ' ' || count(*) filter (
                   where lower(s.email) = lower(:'owner')
                     and s.staff_role = 'owner'
                     and s.auth_user_id in (select u.id from auth.users u
                                             where lower(u.email) = lower(:'owner')
                                               and u.email_confirmed_at is not null))
            from erp_meta.platform_staff s
           where s.revoked_at is null;
          SQL
            )
            if [[ "$staff" != "0 1" ]]; then
              echo "::error::the ${TARGET}'s platform staff list is not safe to release into: active rows not bound to a confirmed sign-in: ${staff%% *}; the owner's row (${OWNER_SHOWN}), bound and confirmed: ${staff##* }. An unbound row is one anybody who confirms that address would be matched to. Nothing was applied, and the control plane is not released."
              exit 1
            fi
            echo "staff: ${OWNER_SHOWN} bound to a confirmed sign-in, and every active row bound"
          fi

      - name: This database is the ${{ inputs.target }}
        # The second check that this is the right database, and the one the
        # database answers itself: a deployment says once which it is
        # (erp_meta.mark_deployment(), 20261010060000), and a release to the
        # other kind stops here, before anything is applied. Absent says
        # nothing either way — the first release after the marker arrived —
        # and the step after the replay writes it.
        #
        # Two calls, as "The demonstration has been built" makes them: a
        # scalar subquery that names erp_meta.platform_setting fails at parse
        # time on a database without the table, before any WHERE could
        # short-circuit, so a to_regclass() guard in the same statement guards
        # nothing (review of #448, REL-3). The table is asked for first, and
        # read only when it is there.
        #
        # And since 20261011010000 a database also holds its own project's
        # ref (deployment.ref), written by the step after the replay the first
        # time and only confirmed after: a connection string filed under the
        # wrong name in the vault is refused by the database it reaches, not
        # only by the name on the string.
        run: |
          set -euo pipefail
          has=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select to_regclass('erp_meta.platform_setting') is not null")
          said=""
          ref_said=""
          if [[ "$has" == "t" ]]; then
            said=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select coalesce((select s.value #>> '{}' from erp_meta.platform_setting s where s.key = 'deployment.kind'), '')")
            ref_said=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select coalesce((select s.value #>> '{}' from erp_meta.platform_setting s where s.key = 'deployment.ref'), '')")
          fi
          if [[ -n "$said" && "$said" != "${KIND}" ]]; then
            echo "::error::this database says it is the ${said} deployment, and this is a release to the ${TARGET}, a ${KIND} deployment. ${SECRET_NAME} names the wrong database. Nothing was applied."
            exit 1
          fi
          if [[ -n "$ref_said" && "$ref_said" != "${PROJECT_REF}" ]]; then
            echo "::error::this database says its project is ${ref_said}, and this is a release to ${PROJECT_REF} (the ${TARGET}). ${SECRET_NAME} names the wrong database. Nothing was applied."
            exit 1
          fi
          echo "deployment: ${said:-not yet said}, project ${ref_said:-not yet said}; releasing to the ${TARGET} (${KIND})"

      - name: The erp schema is not exposed
        # Before anything is applied. Every table the doors read holds INSERT,
        # UPDATE and DELETE for `authenticated`, because the doors run as the
        # caller and need them (erp.apply_row_security() grants them at the
        # end of every migration). What keeps a signed-in person from writing
        # an approved state straight into erp.object_state, or a relation into
        # erp.document_relation, is that PostgREST does not serve the erp
        # schema at all (docs/ARCHITECTURE.md). The born-approved order
        # (20260922380000) rests on that as much as every door does, and until
        # now nothing checked it: supabase/config.toml has no [api] block, and
        # the setting lives in the project, not in this repository.
        #
        # So the project's own PostgREST settings are read through the
        # Management API and the deploy stops if erp, erp_ref, erp_meta or
        # erp_test is listed. Only when SUPABASE_ACCESS_TOKEN is set, like the
        # Edge Functions step; without it, a notice says nothing was checked.
        #
        # Through mapi (supabase/ci/management_api.sh): a train of four
        # clients shares one token's sixty calls a minute, and a 429 taken
        # as a verdict would stop a release that would pass a minute later.
        # A 429 or a 5xx is asked again with backoff; any other answer of
        # 400 or more still stops the release.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.supabase_access_token }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set, so this deploy did not check which schemas PostgREST exposes. Confirm in the dashboard (API settings, Exposed schemas) that only public and graphql_public are listed."
            echo "- Exposed schemas: not checked (no SUPABASE_ACCESS_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "${PROJECT_REF}" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::CLOVEERP_PROJECT_REF must be a 20-character project ref; got '${PROJECT_REF}'."
            exit 1
          fi
          . supabase/ci/management_api.sh
          body=$(mapi GET "/v1/projects/${PROJECT_REF}/postgrest") || {
            echo "::error::could not read the project's PostgREST settings from the Management API (the line above says what it answered), so nothing says the erp schema is private. Nothing was applied."
            exit 1
          }
          schemas=$(printf '%s' "$body" | jq -r '.db_schema // empty')
          if [[ -z "$schemas" ]]; then
            echo "::error::the Management API returned no db_schema for ${PROJECT_REF}: ${body}"
            exit 1
          fi
          exposed=$(printf '%s' "$schemas" | tr ',' '\n' | tr -d ' ' | grep -Ex 'erp|erp_ref|erp_meta|erp_test' || true)
          if [[ -n "$exposed" ]]; then
            echo "::error::PostgREST exposes $(echo $exposed | tr '\n' ' ')on ${PROJECT_REF} (db_schema: ${schemas}). Every table there is writable by any signed-in person, past every door. Remove it under API settings, Exposed schemas, then re-run. Nothing was applied."
            exit 1
          fi
          echo "Exposed schemas: ${schemas}"
          echo "- Exposed schemas: ${schemas}" >> "$GITHUB_STEP_SUMMARY"

      - name: Re-emit the twelve gateway function bodies (one-off)
        if: inputs.target == 'production' && inputs.repair_gateway_bodies
        # Seventeen of the migrations still to apply rewrite an existing
        # function by text, and refuse when the body is not the one they were
        # written against. Live's is not, because everything up to
        # 20260905040000 arrived through the connector rather than by replaying
        # the files: functionally equivalent, textually different.
        #
        # supabase/ops/20260908_gateway_function_bodies.sh does the work. It
        # runs here rather than on somebody's laptop because it needs a
        # PostgreSQL to build the reference in, and that has to be the image
        # the product is verified against — pg_jsonschema is a Rust extension
        # apt does not carry, and a reference built on a different host is not
        # the reference.
        #
        # Pinned to the same image and major version as schema.yml, for the
        # same reason: what live is compared against must be what CI builds.
        run: |
          set -euo pipefail
          image=$(supabase/ci/postgres_image.sh)
          docker run -d --name clove-erp-reference \
            -e POSTGRES_PASSWORD=postgres -p 5432:5432 \
            "$image"
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then break; fi
            if [[ "$i" -eq 60 ]]; then
              echo "::error::the reference PostgreSQL did not become ready within 60s"
              docker logs clove-erp-reference 2>&1 | tail -40 >&2
              exit 1
            fi
            sleep 1
          done

          log="$RUNNER_TEMP/gateway.log"
          set +e
          CLOVEERP_LIVE_DATABASE_URL="$DB_URL" \
            ./supabase/ops/20260908_gateway_function_bodies.sh --apply 2>&1 \
            | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          .github/summarise.sh "$log" "## Gateway function bodies"
          exit "$status"

      - name: Record every repository migration as applied (one-off)
        if: inputs.target == 'production' && inputs.mark_applied
        # Both directions, because the history table and the repository
        # disagree in both and `supabase db push` refuses on either half.
        #
        # The first version of this step marked the repository's versions
        # applied and stopped, which was half the job. The first dry run that
        # ever reached live proved it: the history table held 160 stamps the
        # connector recorded, the repository holds 278 files, and the two sets
        # do not intersect at all — not one stamp names a file, not one file is
        # recorded. Marking the 278 applied would have left the push refusing
        # on the 160, with the error the CLI actually returns:
        # "Remote migration versions not found in local migrations directory".
        #
        # Reverting a stamp deletes its row. It undoes nothing the connector
        # did — the schema those statements built is still there — it declares
        # the repository the record from here on, which is the whole point.
        env:
          THROUGH: ${{ inputs.mark_applied_through }}
        run: |
          set -euo pipefail

          # No boundary, no repair. Recording a migration as applied without
          # applying it is not recoverable by a later deploy: replay skips what
          # the history table already claims, so the change is stranded and
          # live diverges from the repository for good. A refusal here costs a
          # re-dispatch; the default it replaces costs the schema.
          if [[ -z "${THROUGH// /}" ]]; then
            echo "::error::mark_applied needs mark_applied_through: the highest migration version already on live (supabase/ops/README.md records 20260905040000 as the last the connector applied). Without it this would record every later migration as applied without applying it."
            exit 1
          fi
          if ! [[ "$THROUGH" =~ ^[0-9]+$ ]]; then
            echo "::error::mark_applied_through must be a bare version, e.g. 20260905040000; got '$THROUGH'."
            exit 1
          fi

          # Numerically, not as strings: the repository carries both 0001 and
          # 20260905040000 and a lexicographic compare across those lengths is
          # only accidentally right. Every version is well inside a double.
          all=$(ls supabase/migrations/*.sql | xargs -n1 basename | sed -E 's/^([0-9]+)_.*$/\1/' | sort -u)
          versions=$(printf '%s\n' "$all" | awk -v t="$THROUGH" '$1 + 0 <= t + 0')
          pending=$(printf '%s\n' "$all" | awk -v t="$THROUGH" '$1 + 0 > t + 0')

          n_at=$(printf '%s' "$versions" | grep -c . || true)
          n_after=$(printf '%s' "$pending" | grep -c . || true)
          if [[ "$n_at" -eq 0 ]]; then
            echo "::error::no migration in this repository is at or below $THROUGH; the boundary is wrong."
            exit 1
          fi
          echo "boundary $THROUGH: $n_at at or below it, $n_after after it left for replay to apply"

          # An absent history table is a project nothing has pushed to, which
          # is not an error: there is simply nothing stale to clear.
          if [[ "$(psql "$DB_URL" -tAc "select to_regclass('supabase_migrations.schema_migrations') is not null")" == "t" ]]; then
            remote=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc \
              "select version from supabase_migrations.schema_migrations order by version")
          else
            remote=""
          fi

          # Against the whole repository, not the bounded set: a stamp naming a
          # migration above the boundary is recorded and real, not stale.
          stale=$(comm -23 <(printf '%s\n' "$remote" | grep -v '^$' | sort -u) <(printf '%s\n' "$all") | tr '\n' ' ')
          if [[ -n "${stale// /}" ]]; then
            echo "reverting $(echo $stale | wc -w) stamp(s) naming no migration in this repository"
            # shellcheck disable=SC2086
            supabase migration repair --status reverted $stale --db-url "$DB_URL"
          else
            echo "no stale stamps: every recorded version names a migration in this repository"
          fi

          versions=$(printf '%s\n' "$versions" | tr '\n' ' ')
          echo "marking $(echo $versions | wc -w) versions applied"
          # shellcheck disable=SC2086
          supabase migration repair --status applied $versions --db-url "$DB_URL"
          supabase migration list --db-url "$DB_URL" | tail -20
          echo "Recorded. Re-run this workflow without mark_applied to deploy." >> "$GITHUB_STEP_SUMMARY"

      - name: No copy of this database is being made
        # Before the first migration. A copy off the platform (fleet_backup.yml,
        # fleet_export.yml) holds a share lock on every table it dumps, and
        # the replay below meets it and fails on its own thirty-second lock
        # limit, halfway. So a copy being made now is waited for, up to half
        # an hour, asked every minute (supabase/ci/fleet_busy.sh copy: a
        # backup copying any database, since GitHub cannot say which, or an
        # export of this client). After that the release carries on, and says
        # so: a train is not held for longer by a copy, and a copy that is
        # still going when the replay reaches its tables is what the
        # deadlock-and-lock retry below is for. The copies, for their part,
        # ask before each database whether a release is past this step and
        # replaying into it, and wait for that; a release still at this step
        # is not waited for, so the two never wait for each other. The
        # repository is public, so the workflow's own token reads the runs.
        if: ${{ !(inputs.mark_applied || inputs.repair_gateway_bodies) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if supabase/ci/fleet_busy.sh wait 30 copy "${TARGET}"; then
            echo "no copy of the ${TARGET} is being made"
          else
            echo "::warning::a copy of the ${TARGET} off the platform was still being made after half an hour (above); the release carries on, and its replay may meet the copy's locks."
            echo "- a copy off the platform was still being made after half an hour; released all the same" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pause the scheduler for the length of the replay
        if: ${{ !(inputs.mark_applied || inputs.repair_gateway_bodies) }}
        # The retry below survives a deadlock; not having one is better.
        #
        # cron.job fires erp.run_due_jobs_all_tenants() every minute, and a
        # replay runs for tens of minutes doing DDL that takes locks across
        # hundreds of objects. On the first real deploy the two crossed and cost
        # twelve migrations of progress. A queue that waits half an hour is a
        # queue that waits; the worker picks up where it left off, and the
        # ordering gate is what keeps that safe.
        #
        # Best effort, deliberately. If the deploy's role may not write
        # cron.job, that is a warning and not a reason to refuse to deploy —
        # the retry is the guarantee, this is the optimisation.
        run: |
          set -euo pipefail
          if [[ "$(psql "$DB_URL" -tAc "select to_regclass('cron.job') is not null")" != "t" ]]; then
            echo "no cron.job on this host; nothing to pause"
            exit 0
          fi
          paused=$(psql "$DB_URL" -tAc \
            "select coalesce(string_agg(jobid::text, ','), '') from cron.job where active" || true)
          if [[ -z "$paused" ]]; then
            echo "no active scheduled job; nothing to pause"
            exit 0
          fi
          # pg_cron's own API first. On 8 September the direct UPDATE came back
          # "permission denied for table job": the deploy's role can read
          # cron.job but does not own it. cron.alter_job() checks that the role
          # owns the job rather than the catalogue, which is the grant a
          # deploying role is actually likely to have.
          if psql "$DB_URL" -v ON_ERROR_STOP=1 -qtc \
               "select cron.alter_job(jobid, active := false) from cron.job where jobid in ($paused)"; then
            echo "PAUSED_JOBS=$paused" >> "$GITHUB_ENV"
            echo "paused scheduled job(s) via cron.alter_job: $paused"
          elif psql "$DB_URL" -v ON_ERROR_STOP=1 -qc \
               "update cron.job set active = false where jobid in ($paused)"; then
            echo "PAUSED_JOBS=$paused" >> "$GITHUB_ENV"
            echo "paused scheduled job(s) by update: $paused"
          else
            echo "::warning::could not pause cron.job by either route; THE SCHEDULER IS STILL RUNNING and the replay relies on the deadlock retry. Nothing needs undoing afterwards."
          fi

      - name: Apply pending migrations by replay
        if: ${{ !(inputs.mark_applied || inputs.repair_gateway_bodies) }}
        # (The copies off the platform wait while a release is between "No
        # copy of this database is being made" and the end of this step, by
        # these names: supabase/ci/fleet_busy.sh. Renamed, rename them there.)
        #
        # A deadlock is a coincidence, not a verdict on the deploy.
        #
        # Every migration ends by re-running the generators, and
        # erp.apply_row_security() and erp.apply_execute_grants() take heavy
        # locks across hundreds of objects. Anything else touching the database
        # at that moment can cross with them — on the first real deploy it was a
        # session running erp.apply_execute_grants() itself, twenty-eight
        # minutes and twelve migrations in:
        #
        #   ERROR: deadlock detected (SQLSTATE 40P01)
        #   Process 1095739 waits for AccessShareLock on relation 38200;
        #     blocked by process 1098150.
        #
        # PostgreSQL picks a victim and aborts it. The right answer is to go
        # again: the migrations that already applied are recorded, so a re-run
        # resumes at the one that lost rather than starting over, and the one
        # that lost rolled back whole. Twelve migrations of progress should not
        # be thrown away because a minutely job wanted the same table.
        #
        # Only on 40P01. Every other failure is this deploy's to answer for,
        # and retrying it would turn one honest error into three.
        run: |
          set -euo pipefail
          # The moment before anything changed: the point-in-time-recovery
          # target a rollback of this deploy would restore to. Recorded on the
          # release row below, and taken once rather than per attempt — a
          # retry is the same deploy, so it is the same target.
          echo "DEPLOY_STARTED_AT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc 'select now()')" >> "$GITHUB_ENV"

          attempts=3
          log="$RUNNER_TEMP/push.log"
          all="$RUNNER_TEMP/push-all.log"
          : > "$all"
          applied=false
          for attempt in $(seq 1 "$attempts"); do
            if supabase db push --include-all --db-url "$DB_URL" 2>&1 \
                 | tee "$log"; then
              cat "$log" >> "$all"
              applied=true
              break
            fi
            cat "$log" >> "$all"

            if ! grep -q '40P01' "$log"; then
              .github/summarise.sh "$all" "## Applied"
              echo "::error::the replay failed for a reason that is not a deadlock; not retrying. The migrations applied before it are recorded, so a later run resumes from there."
              exit 1
            fi

            if [[ "$attempt" -lt "$attempts" ]]; then
              # Back off enough to clear a minutely job's window.
              wait=$((attempt * 30))
              echo "::warning::deadlock (40P01) on attempt ${attempt} of ${attempts}; retrying in ${wait}s from the migration that lost."
              printf '\n-- deadlock on attempt %s; resuming --\n' "$attempt" >> "$all"
              sleep "$wait"
            fi
          done

          .github/summarise.sh "$all" "## Applied"
          if [[ "$applied" != true ]]; then
            echo "::error::deadlocked on all ${attempts} attempts. Something is contending for the same objects throughout — check cron.job and pg_stat_activity before running again."
            exit 1
          fi

      - name: Say which deployment this is
        # Before anything reads it: the catch-up below trades demonstrations
        # forward only on the demonstration, and production's doors refuse to
        # make one (20261010061000). Once said, a deployment's kind is not
        # changed by a deploy, so on every release after the first this only
        # confirms it — and refuses, failing the release, if the database is
        # the other kind.
        #
        # On the demonstration and on a client it is never written here: only
        # the end of a build from empty says what a database is, so a release
        # can only confirm what that build said.
        #
        # Then the database's own ref and address (20261011010000): written
        # the first time, confirmed after, and refused if they differ — the
        # database's half of "the connection is the target's". Only once the
        # routine exists; the first release after that migration writes it.
        #
        # A client's address is read from the register again here, not taken
        # from when the train began: a client renamed in between
        # (fleet_rename.yml, which waits for a running train but not for one
        # that starts after it) is served at its new address, and a release
        # that said the old one would undo the rename in its own database.
        if: ${{ !(inputs.mark_applied || inputs.repair_gateway_bodies) }}
        run: |
          set -euo pipefail
          if [[ "${KIND}" == production ]]; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp_meta.mark_deployment('production');"
          else
            said=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.deployment_kind()")
            if [[ "$said" != "${KIND}" ]]; then
              echo "::error::after the replay the ${TARGET}'s database says it is the ${said}, not a ${KIND} deployment. The control plane is not released."
              exit 1
            fi
            echo "deployment: ${KIND}, as its build said"
          fi
          origin="${APP_ORIGIN}"
          if [[ "${KIND}" == client && -n "${CP_URL}" && "$origin" =~ ^https://[a-z0-9-]+\.([a-z0-9.-]+(:[0-9]{1,5})?)$ ]]; then
            apex="${BASH_REMATCH[1]}"
            # Through to_jsonb: a control plane without the column (before
            # 20261012030000) gives the code, which was the address.
            address=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA -v code="${TARGET}" <<'SQL'
          select coalesce(to_jsonb(d) ->> 'address', d.code) from erp_meta.deployment d where d.code = :'code';
          SQL
            )
            if [[ "$address" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ && "https://${address}.${apex}" != "$origin" ]]; then
              echo "::notice::${TARGET} has been moved to ${address} since this train began; it is told it is served at https://${address}.${apex}, not ${origin}."
              origin="https://${address}.${apex}"
            fi
          fi
          if [[ "$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select to_regprocedure('erp_meta.set_deployment_identity(text,text)') is not null")" == "t" ]]; then
            # On standard input, not -c: psql substitutes :'ref' only there
            # (the first release after 20261011010000 failed here with
            # "syntax error at or near :").
            psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -tA -v ref="${PROJECT_REF}" -v origin="${origin}" <<'SQL'
          select erp_meta.set_deployment_identity(:'ref', nullif(:'origin', ''));
          SQL
            echo "identity: project ${PROJECT_REF}${origin:+, served at ${origin}}"
          fi

      - name: Record the release
        # One row per deploy, written before the database is proved so that
        # the proof's own release clause — the ledger has moved past the last
        # recorded release — reads this deploy, not the one before it.
        if: ${{ !(inputs.mark_applied || inputs.repair_gateway_bodies) }}
        run: |
          set -euo pipefail
          release=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select erp.record_release('${GITHUB_SHA}', '${DEPLOY_STARTED_AT}'::timestamptz, 'lovable', 'run ${GITHUB_RUN_ID}');")
          echo "RELEASE_ID=$release" >> "$GITHUB_ENV"
          echo "release $release recorded for ${GITHUB_SHA}"

      - name: Start the scheduler again
        # Before the proof, not after it.
        #
        # The first deploy whose pause actually worked failed its own proof
        # for that reason: erp.platform_assurance() raises
        # CLOVEERP_PLATFORM_NOT_SCHEDULED when the register says a job is
        # scheduled and the host's cron does not agree, and a paused scheduler
        # is exactly that disagreement. The deploy was asserting a world it
        # had itself taken apart. So the world goes back together first and
        # the proof reads the database an operator would find.
        #
        # always(), and unconditional: whatever happened above — a failed
        # replay, a cancelled run — the scheduler goes back on. A deploy that
        # leaves the platform's own clock stopped has done more damage than
        # the one it was avoiding.
        #
        # No-op when nothing was paused, so this is safe on every path that
        # never reached the pause: PAUSED_JOBS is simply unset.
        #
        # A failure here fails the job even when the deploy itself succeeded.
        # The scheduler being off is not a footnote to a green deploy.
        if: always()
        run: |
          set -uo pipefail
          if [[ -z "${PAUSED_JOBS:-}" ]]; then
            echo "nothing was paused"
            exit 0
          fi
          # Both routes, whichever paused it: a resume that fails because it
          # picked the wrong one is the failure this step exists to prevent.
          if psql "$DB_URL" -v ON_ERROR_STOP=1 -qtc \
               "select cron.alter_job(jobid, active := true) from cron.job where jobid in (${PAUSED_JOBS})" \
             || psql "$DB_URL" -v ON_ERROR_STOP=1 -qc \
               "update cron.job set active = true where jobid in (${PAUSED_JOBS})"; then
            echo "scheduled job(s) running again: ${PAUSED_JOBS}"
          else
            echo "::error::could not re-enable cron.job (${PAUSED_JOBS}). The platform scheduler is STOPPED on the ${TARGET}: run 'update cron.job set active = true where jobid in (${PAUSED_JOBS});' by hand now."
            exit 1
          fi

      - name: Deploy the Edge Functions
        # Only when SUPABASE_ACCESS_TOKEN is set; otherwise a notice and nothing.
        #
        # On 13 September the deploy of 2b181c8 failed at its replay with
        # "duplicate key value violates unique constraint
        # pg_proc_proname_args_nsp_index": live's log shows a second client
        # applying the same migration two seconds apart. That is Supabase's
        # GitHub integration with "Deploy to production" on, which applies
        # migrations from main as well as deploying the functions declared in
        # supabase/config.toml, and it is the second route into production the
        # 8 September deploy lost to. Turning it off would also stop the
        # functions reaching live, because nothing else deployed them.
        #
        # So this deploys them from the same commit, after the database they
        # read has been replayed and before the dispatch schedule starts
        # calling them. With the token set, the integration's production
        # deploy can be switched off and this workflow is the one route again.
        # The CLI reads [functions.*] (verify_jwt, import_map) from config.toml.
        #
        # Only what changed, since 8 October: every function was deployed on
        # every release, each at least one Management API call, and one
        # token's sixty calls a minute serve the whole fleet. Which functions
        # go, and why, is decided by supabase/ci/functions_to_deploy.sh
        # (rehearsed by functions_to_deploy_rehearsal.sh on every build): a
        # function is deployed when it is not on the project yet, when
        # anything it is built from changed since the commit this target last
        # released (its own directory and what it imports, followed through
        # worker/src/core and src/lib), or when anything every function shares
        # changed; and every function is deployed whenever that comparison
        # cannot be trusted. The commit last released is the target's own
        # record: for a client, the control plane's register
        # (last_release_sha, only when that release succeeded); for the
        # demonstration and production, the release just before this one in
        # their own database (erp_meta.release), and only when it was proved:
        # one that deployed functions and then failed was not, so every
        # function is deployed after it, and a revert cannot leave its
        # functions running. If the script itself cannot decide, every
        # function is deployed.
        #
        # Each deploy is tried three times, twenty and then forty seconds
        # apart: a busy minute at the Management API is not a broken function.
        if: ${{ !(inputs.mark_applied || inputs.repair_gateway_bodies) }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.supabase_access_token }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set, so this workflow deployed no Edge Functions; Supabase's GitHub integration still deploys them, and applies migrations beside this workflow while it does."
            echo "- Edge Functions: not deployed here (no SUPABASE_ACCESS_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "${PROJECT_REF}" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::CLOVEERP_PROJECT_REF must be a 20-character project ref; got '${PROJECT_REF}'."
            exit 1
          fi
          . supabase/ci/management_api.sh

          # The commit this target last released, from its own record.
          last=""
          if [[ "${KIND}" == client ]]; then
            if [[ -n "${CP_URL}" ]]; then
              last=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA -v code="${TARGET}" <<'SQL'
          select coalesce((select d.last_release_sha from erp_meta.deployment d
                            where d.code = :'code' and d.last_release_outcome = 'success'), '');
          SQL
              ) || { echo "::warning::the control plane's register could not be read for ${TARGET}'s last release, so every function is deployed."; last=""; }
            fi
          else
            # The release just before this one, and only if it was proved: a
            # release that deployed functions and then failed is not proved,
            # and a revert after it must not be compared with the one before.
            last=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -tA -v this="${RELEASE_ID:-}" <<'SQL'
          select coalesce((select case when r.proved_at is not null then r.git_sha else '' end
                             from erp_meta.release r
                            where r.id::text <> :'this'
                            order by r.recorded_at desc limit 1), '');
          SQL
            ) || { echo "::warning::the ${TARGET}'s releases could not be read, so every function is deployed."; last=""; }
          fi

          # What the project has already: its functions' slugs, one a line.
          # Not listed, the script deploys every function.
          on_project=(--not-listed)
          if answer=$(mapi GET "/v1/projects/${PROJECT_REF}/functions"); then
            if jq -r 'if type == "array" then .[].slug else error("not a list") end' <<< "$answer" > "$RUNNER_TEMP/functions_on_project.txt"; then
              on_project=(--on-project "$RUNNER_TEMP/functions_on_project.txt")
            fi
          fi

          deploy_function() {
            local attempt
            for attempt in 1 2 3; do
              # --use-api bundles on Supabase's side, as the integration did: it follows
              # the relative imports into worker/src/core and src/lib, and needs no Docker.
              if supabase functions deploy "$1" --project-ref "$PROJECT_REF" --use-api; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "::warning::deploying $1 to ${PROJECT_REF} failed on attempt ${attempt} of 3; trying again in $((attempt * 20)) s"
                sleep $((attempt * 20))
              fi
            done
            return 1
          }

          # One line a decision, tab-separated: the basis, then deploy or skip
          # for each function, with why.
          if ! plan=$(supabase/ci/functions_to_deploy.sh --last "$last" "${on_project[@]}" --head "${GITHUB_SHA}" --target "the ${TARGET}"); then
            echo "::warning::which Edge Functions changed could not be worked out (supabase/ci/functions_to_deploy.sh said why, above), so every function is deployed."
            why="which functions changed could not be worked out"
            plan="basis"$'\t'"every"$'\t'"${why}"
            for dir in supabase/functions/*/; do
              if [[ -f "${dir}index.ts" ]]; then
                plan+=$'\n'"deploy"$'\t'"$(basename "$dir")"$'\t'"${why}"
              fi
            done
          fi

          echo "## Edge Functions" >> "$GITHUB_STEP_SUMMARY"
          deployed=""; skipped=""; failed=""
          # The plan on a descriptor of its own, so that nothing a deploy
          # reads from standard input can take the rest of it.
          while IFS=$'\t' read -r verdict name why <&3; do
            case "$verdict" in
              basis)
                if [[ "$name" == every ]]; then
                  echo "Every function is deployed: ${why}." >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "Compared with ${why:0:12}, the ${TARGET}'s last release:" >> "$GITHUB_STEP_SUMMARY"
                fi ;;
              skip)
                skipped="${skipped} ${name}"
                echo "- ${name}: skipped, ${why}" >> "$GITHUB_STEP_SUMMARY" ;;
              deploy)
                echo "${name}: deploying, because ${why}"
                if deploy_function "$name"; then
                  deployed="${deployed} ${name}"
                  echo "- ${name}: deployed, because ${why}" >> "$GITHUB_STEP_SUMMARY"
                else
                  failed="${failed} ${name}"
                  echo "- ${name}: NOT deployed in 3 attempts (${why})" >> "$GITHUB_STEP_SUMMARY"
                fi ;;
            esac
          done 3<<< "$plan"
          echo "Edge Functions deployed:${deployed:- none}; skipped:${skipped:- none}"
          if [[ -n "$failed" ]]; then
            echo "::error::these Edge Functions could not be deployed to ${PROJECT_REF} in three attempts each:${failed}. The ones listed as deployed are; the release stops here, before the dispatch schedule calls a function that may be stale, and the next release deploys every function again."
            exit 1
          fi

      - name: Schedule the dispatch function
        id: schedule_dispatch
        # Email leaves only when something posts to the dispatch function, and
        # nothing did. erp.ensure_platform_schedule() makes that post a pg_cron
        # job, clove-dispatch, but only when it is given the function's URL, and
        # the migration that defines it gives none: live's register has said
        # "no dispatch URL has been given" since the day it was written, and
        # every email queued since was queued for nobody.
        #
        # Three things, all inside the database, none printed:
        #
        #   the secret  the job signs its request with, created in the vault
        #               when absent, from random bytes the database generates
        #               itself. It never exists outside the database: not in the
        #               repository, not in a GitHub secret, not in this log. The
        #               function reads the same vault entry over its own
        #               connection, so there is nothing to copy between them.
        #   the backlog email and webhooks the minute pass queued while nothing
        #               drained, retired right before the job can first send
        #               them: erp.retire_undrained_notifications_everywhere()
        #               turns what is over an hour old into in-app notices, and
        #               does nothing once any drain pass has been recorded. The
        #               migration that retired them ran when it was applied, and
        #               a run that stopped before this step (a failed replay, a
        #               function that would not deploy) leaves days of mail for
        #               the first pass to send. A failure here stops the step
        #               before anything is scheduled. The summary gets each
        #               organisation that had any.
        #   the job     rescheduled only when the register, cron.job and this
        #               URL disagree, or the stored command predates the request
        #               timeout 20260913120000 gives it. Rescheduling renumbers
        #               both jobs, which on every deploy would be churn.
        #
        # After the scheduler is started again, so the new jobs are not left
        # paused under ids the resume step never saw; before the proof, so the
        # proof reads the schedule an operator would find.
        if: ${{ !(inputs.mark_applied || inputs.repair_gateway_bodies) }}
        run: |
          set -euo pipefail
          # Interpolated into SQL below, so its shape is checked first.
          if ! [[ "$DISPATCH_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~-]+)+$ ]]; then
            echo "::error::the dispatch URL '${DISPATCH_URL}' is not a plain https URL such as https://<ref>.supabase.co/functions/v1/dispatch; nothing was scheduled."
            exit 1
          fi

          missing=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select concat_ws(', ',
                     case when to_regclass('cron.job') is null then 'pg_cron' end,
                     case when not exists (select 1 from pg_catalog.pg_extension where extname = 'pg_net') then 'pg_net' end,
                     case when to_regclass('vault.secrets') is null then 'supabase_vault' end);")
          if [[ -n "$missing" ]]; then
            echo "::error::the ${TARGET} database has no ${missing}, so the dispatch function cannot be scheduled from inside the database and no email can leave. Enable it under Database, Extensions and run this workflow again."
            exit 1
          fi

          # What the proof below waits for a drain pass after.
          echo "DISPATCH_SCHEDULED_AT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc 'select now()')" >> "$GITHUB_ENV"

          had=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select exists (select 1 from vault.secrets where name = 'cloveerp_dispatch_secret');")
          if [[ "$had" == "t" ]]; then
            secret="already in the vault"
          else
            # create_secret answers with the entry's id, not its value, and
            # even that goes nowhere.
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
              select vault.create_secret(
                       encode(extensions.gen_random_bytes(32), 'hex'),
                       'cloveerp_dispatch_secret',
                       'x-dispatch-secret for the pg_cron job clove-dispatch and the dispatch function. Created inside the database by deploy.yml and never printed.')
               where not exists (select 1 from vault.secrets where name = 'cloveerp_dispatch_secret');" > /dev/null
            secret="created in the vault"
          fi

          # Right before the schedule, so nothing queued before this moment can
          # reach the first pass. One statement, one transaction: the function
          # sets each organisation's context for that transaction only.
          if ! retired=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -F '|' -c "
                select r.tenant_code, r.retired
                  from erp.retire_undrained_notifications_everywhere() r
                 order by r.tenant_code;"); then
            echo "::error::erp.retire_undrained_notifications_everywhere() failed, so mail queued while nothing drained could not be retired; nothing was scheduled, so none of it can be sent. The error is above."
            exit 1
          fi
          checked=0
          retired_total=0
          retired_lines=""
          while IFS='|' read -r tenant_code count; do
            [[ -n "$tenant_code" ]] || continue
            checked=$((checked + 1))
            if [[ "$count" =~ ^[0-9]+$ ]] && (( count > 0 )); then
              retired_total=$((retired_total + count))
              retired_lines+="  - ${tenant_code}: ${count}"$'\n'
            fi
          done <<< "$retired"
          if [[ "$checked" -eq 0 ]]; then
            backlog="nothing retired: a drain pass has already been recorded"
          else
            backlog="${retired_total} undrained notification(s) retired across ${checked} organisation(s)"
          fi

          agrees=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select exists (
              select 1
                from erp_meta.platform_schedule s
                join cron.job j on j.jobid = s.cron_jobid
               where s.code = 'clove-dispatch'
                 and s.is_scheduled
                 and j.jobname = 'clove-dispatch'
                 and j.active
                 and j.command = s.command
                 and position(quote_literal('${DISPATCH_URL}') in s.command) > 0
                 and position('timeout_milliseconds' in s.command) > 0);")
          if [[ "$agrees" == "t" ]]; then
            result="unchanged: clove-dispatch posts to ${DISPATCH_URL}, and the register, cron.job and the command agree"
          else
            result=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.ensure_platform_schedule('${DISPATCH_URL}')::text;")
          fi
          echo "secret: ${secret}"
          echo "backlog: ${backlog}"
          [[ -z "$retired_lines" ]] || printf '%s' "$retired_lines"
          echo "schedule: ${result}"
          {
            echo "## Dispatch"
            echo "- secret: ${secret}"
            echo "- backlog: ${backlog}"
            [[ -z "$retired_lines" ]] || printf '%s' "$retired_lines"
            echo "- schedule: ${result}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bring the demonstration up to today
        # A demonstration organisation that stopped trading in the spring reads,
        # to a prospect, as a company that went under: every penny it is owed
        # aged past ninety days, nothing in its current bucket, no month ever
        # closed. erp.catch_up_demonstrations() trades it forward to the day of
        # this deploy through erp.seed_demo_history(), bills the goods it
        # received and never billed, and closes the months whose trading is
        # finished, with nothing waived.
        #
        # It also reopens months an earlier catch-up closed before its trading
        # had ever reached them, trades them and closes them again on their own
        # figures (20260921110000). That is a real accounting act and it is
        # permitted here only because erp.demonstration_catch_up() refuses any
        # organisation whose code does not begin 'demo-' or whose environment
        # is live: what this step may reopen is invented books in a non-live
        # demonstration, and nothing else. The narrowness of that guard is the
        # reason this is allowed, so it is not a guard to relax.
        #
        # Here rather than in a migration, for two reasons. A migration is one
        # transaction, and five months of trading leaves thousands of journal
        # rows with deferred trigger events pending, which the generators at the
        # foot of every migration cannot then ALTER past — that is what took the
        # deploy down on 18 September (20260920300000 has the whole account).
        # And a migration runs once, so a demonstration it brings up to today is
        # a month stale a month later; a step runs every deploy, and after the
        # first one there are only the days since the last deploy to build.
        #
        # Before the proof below, so that what is proved is the database as this
        # deploy leaves it.
        #
        # On both deployments, and it does its work on one. Demonstrations live
        # on the demonstration deployment (20261010061000); on production
        # erp.catch_up_demonstrations() finds nothing to do and answers the
        # empty report, which the reporter reads as "no demonstration
        # organisation on this database".
        #
        # FIVE MINUTES, SET WHERE IT TAKES (20260921130000). This step used to
        # carry `PGOPTIONS: -c statement_timeout=0` and a comment saying "no
        # statement timeout". It never took: PGOPTIONS rides in libpq's startup
        # packet and this deploy connects through the session pooler, which does
        # not forward it, and a per-role setting would override it even on a
        # direct connection. On 21 September the catch-up was killed at 121.9 s
        # by the two-minute limit it believed it had removed, and everything
        # those two minutes built was rolled back with it.
        #
        # So the limit is set by an explicit SET, which no pooler drops and no
        # role setting overrides, and it is set to something rather than to
        # nothing: five minutes is a bound this deploy has chosen, where "no
        # timeout" would have been an unbounded write transaction on a database
        # with a year of trading in it. erp.demonstration_catch_up() reads the
        # session's own limit and stops at a fraction of it — trading at three
        # minutes, billing and closing at four — so it returns and COMMITS
        # instead of being cancelled, and the next deploy carries on from where
        # it stopped.
        #
        # This never fails the deploy. It is hygiene on demonstration data, not
        # an invariant of the product, and a red deploy blocks every branch
        # behind it. The routine raises nothing — an organisation that refuses is
        # reported and the next one is tried — and continue-on-error covers the
        # rest. What it will not do is go quiet: every note comes back out here.
        #
        # Not on a client: a client's database refuses demonstrations as
        # production does (erp.require_demonstration_deployment() tests for
        # the demonstration kind), and a paying client's release has no
        # hygiene to do on invented books.
        if: ${{ !(inputs.mark_applied || inputs.repair_gateway_bodies) && env.KIND != 'client' }}
        continue-on-error: true
        # A SMALLER BOUND ON THE DEMONSTRATION. Its project is a Micro instance
        # (1 GB), the owner's choice of 6 October, and production went down on
        # 5 October because a demonstration's history was built on an instance
        # too small for it in one long burst. erp.demonstration_catch_up()
        # stops at fractions of the session's own limit (catch_up_deadline:
        # trading at 60%, billing and closing at 80%), so the limit is the
        # pace: ninety seconds there, which is at most about a minute of
        # trading and a quarter-minute of closing per release, committed, and
        # the next release carries on from where it stopped. A demonstration
        # with months to build is brought up to date over several releases
        # rather than at once; the step says "more to do" until it is.
        # Production has no demonstration to build (20261010061000) and keeps
        # the five minutes it had.
        env:
          CATCH_UP_LIMIT: ${{ inputs.target == 'demonstration' && '90s' || '5min' }}
        run: |
          # GitHub runs a `run:` step as `bash -e {0}` unless the step says
          # otherwise, so -e has always been in force here whatever this script
          # set; the comment that used to say "Not -e" was wrong, and on
          # 21 September that mattered — the first jq failed on a report it
          # could not parse and the step died there having printed six words.
          # It is relied on deliberately now: the reporter below is the last
          # command, and its exit status is this step's.
          set -uo pipefail
          report="$RUNNER_TEMP/demonstrations.json"
          errors="$RUNNER_TEMP/demonstrations.err"
          started=$(date +%s%N)
          # Two -c options, one session: the SET is an ordinary statement the
          # server executes, so it cannot be dropped on the way in the way
          # PGOPTIONS was (20260921130000).
          #
          # And -q, because psql prints a command tag for every -c it runs and
          # those go to stdout with the answer. Without it the report carried
          # "SET" ahead of the JSON and every jq reading it failed. -tA does not
          # suppress that; -q does. supabase/ci/demonstration_catch_up.sh runs
          # this exact invocation against a real server on every build and
          # refuses a report that is not JSON, so this is checked rather than
          # believed.
          if psql "$DB_URL" -q -v ON_ERROR_STOP=1 -tA \
               -c "set statement_timeout = '${CATCH_UP_LIMIT}'" \
               -c "select erp.catch_up_demonstrations();" > "$report" 2> "$errors"; then
            answered=true
          else
            answered=false
          fi
          seconds=$(awk -v ms="$(( ($(date +%s%N) - started) / 1000000 ))" \
                        'BEGIN { printf "%.1f", ms / 1000 }')

          # Everything this step says about the demonstration is said there, so
          # that it can be rehearsed against captured output by the build
          # (supabase/ci/demonstration_report_rehearsal.sh). It exits non-zero
          # only when it cannot read the report at all, which fails this step
          # and not the deploy.
          supabase/ci/demonstration_report.sh "$report" "$errors" "$seconds" "$answered"

      - name: Prove the ${{ inputs.target }} database
        # The same checks the build runs, minus the suites: suites create and
        # destroy organisations and do not belong on live. erp.platform_assurance()
        # runs every registered assertion; the whole-database reconciliation
        # visits every organisation. Either failing fails the deploy, loudly.
        #
        # And how long it took, check by check. erp.platform_assurance() runs
        # under a 55-second statement_timeout and took 63.3 s here on 14
        # September; the console asks for it through the data API. It is run
        # once, kept, and read twice: for what failed, and for where the time
        # went (erp.run_diagnostic() records elapsed_ms per check since
        # 20260914090000). Over 35 s is a warning, not a failure: a slow proof
        # is still a proof, and the slowest checks it prints are where to look.
        if: ${{ !(inputs.mark_applied || inputs.repair_gateway_bodies) }}
        run: |
          set -euo pipefail
          assurance="$RUNNER_TEMP/assurance.json"
          started=$(date +%s%N)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.platform_assurance();" > "$assurance"
          wall_ms=$(( ($(date +%s%N) - started) / 1000000 ))
          seconds=$(awk -v ms="$wall_ms" 'BEGIN { printf "%.1f", ms / 1000 }')
          slowest=$(jq -r '
            map(select(.elapsed_ms != null)) | sort_by(-.elapsed_ms) | .[:10][]
            | "\(.elapsed_ms | tostring | " " * ([0, 9 - length] | max) + .) ms  \(.code)"
          ' "$assurance")
          echo "platform_assurance took ${seconds} s; the slowest checks:"
          echo "$slowest"
          {
            echo "## Assurance"
            echo "erp.platform_assurance() took ${seconds} s. The slowest checks:"
            echo '```'
            echo "$slowest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          bad=$(jq -r '.[] | select(.ok == false) | "\(.code): \((.detail // "")[0:120])"' "$assurance")
          if [[ -n "$bad" ]]; then
            echo "::error::platform_assurance() is not green on the ${TARGET}:"
            echo "$bad"
            exit 1
          fi
          if (( wall_ms > 35000 )); then
            echo "::warning::platform_assurance() took ${seconds} s on the ${TARGET}, more than the 35 s it should stay under; its statement_timeout is 55 s. The slowest checks are listed above."
          fi
          echo "platform_assurance: every registered check green in ${seconds} s"
          # When the reconciliation refuses, say what the refused documents'
          # journals did, from every organisation that is not live
          # (erp.describe_vat_disagreements(), 20261002200000). A migration's
          # warnings do not survive supabase db push; psql prints a notice.
          if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.assert_whole_database_reconciles();"; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -qc "
              do \$d\$
              declare r record; v jsonb;
              begin
                for r in select tn.id, tn.code from erp.tenant tn where tn.deleted_at is null order by tn.code loop
                  perform erp_meta.act_in_tenant(r.id);
                  continue when erp.environment_is_live();
                  v := erp.describe_vat_disagreements();
                  if jsonb_array_length(v) > 0 then
                    raise notice 'vat disagreements in %: %', r.code, jsonb_pretty(v);
                    -- Every version of the rules those documents post by, and
                    -- the organisation's module versions: which one posted it.
                    raise notice 'posting rules in %: %', r.code, (
                      select jsonb_pretty(coalesce(jsonb_agg(jsonb_build_object(
                               'code', pr.code, 'version', pr.version, 'status', pr.status,
                               'entity_specific', pr.entity_id is not null,
                               'from', pr.effective_from, 'to', pr.effective_to,
                               'lines', pr.posting_lines) order by pr.code, pr.version), '[]'::jsonb))
                        from erp.posting_rule pr
                       where pr.tenant_id = r.id
                         and pr.code in (select dt.posting_rule_code
                                           from erp.document d
                                           join erp.document_type dt on dt.tenant_id = d.tenant_id and dt.id = d.document_type_id
                                          where d.tenant_id = r.id
                                            and d.document_number in (select x ->> 'document' from jsonb_array_elements(v) x)));
                    raise notice 'modules in %: %', r.code, (
                      select string_agg(mi.install_code || ' v' || coalesce(mi.installer_version::text, '?'), ', ' order by mi.install_code)
                        from erp.module_installation mi where mi.tenant_id = r.id);
                  end if;
                end loop;
                perform erp_meta.stop_acting_in_tenant();
              end
              \$d\$;" || true
            exit 1
          fi
          # The release is proved: the database it produced passed. A release
          # row without proved_at is a deploy that applied and did not check.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.prove_release('${RELEASE_ID}');"
          {
            echo "## ${TARGET^}"
            echo '```'
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select 'organisations: ' || count(*) from erp.tenant;"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select 'migrations recorded: ' || count(*) from supabase_migrations.schema_migrations;"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.assert_whole_database_reconciles();"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select 'release ' || left(git_sha, 12) || ' recorded ' || recorded_at || ', ledger at ' || coalesce(migrations_high, '(none)') || ', proved ' || proved from erp.release_report() limit 1;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove email can leave
        # A schedule is a promise; a drain pass is the evidence.
        #
        # erp.platform_assurance() is green with dispatch unscheduled, and has
        # to be: a database the build stands up has no URL to give it. So the
        # proof that live sends email is here, where only live is touched. The
        # register, cron and the vault must agree, and then a pass must be
        # recorded in erp_meta.drain_pass after the step above began. A pass is
        # recorded only if cron fired, pg_net posted, the gateway let the
        # request through, the function accepted the secret, loaded its
        # configuration and reached the database: the whole path, in one row.
        #
        # always(), so a proof that failed above cannot hide whether email
        # leaves; and only when the schedule step succeeded, because otherwise
        # there is nothing scheduled to prove.
        if: ${{ always() && steps.schedule_dispatch.outcome == 'success' }}
        run: |
          set -euo pipefail
          state=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select coalesce((
              select case
                       when not s.is_scheduled
                         then 'the register says it is not scheduled: ' || s.reason
                       when not exists (select 1 from cron.job j where j.jobid = s.cron_jobid and j.jobname = 'clove-dispatch' and j.active)
                         then 'the register names job ' || coalesce(s.cron_jobid::text, 'none') || ' and cron.job has no active clove-dispatch under it'
                       when not exists (select 1 from vault.secrets v where v.name = 'cloveerp_dispatch_secret')
                         then 'the vault has no cloveerp_dispatch_secret for the job to sign with'
                       else 'ok'
                     end
                from erp_meta.platform_schedule s
               where s.code = 'clove-dispatch'),
              'erp_meta.platform_schedule has no clove-dispatch row');")
          if [[ "$state" != "ok" ]]; then
            echo "::error::clove-dispatch: ${state}"
            exit 1
          fi

          # A tick a minute; four minutes is three chances and a slow one.
          passes=0
          for _ in $(seq 1 24); do
            passes=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from erp_meta.drain_pass where finished_at > '${DISPATCH_SCHEDULED_AT}'::timestamptz;")
            if [[ "$passes" -gt 0 ]]; then break; fi
            sleep 10
          done

          if [[ "$passes" -eq 0 ]]; then
            # Diagnosis only from here: nothing below may hide the failure.
            set +e
            echo "What pg_net got back since ${DISPATCH_SCHEDULED_AT}, newest first:"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
              select r.created || '  status ' || coalesce(r.status_code::text, 'none')
                     || '  timed out ' || coalesce(r.timed_out::text, '-')
                     || '  ' || left(regexp_replace(coalesce(r.error_msg, r.content, ''), '\s+', ' ', 'g'), 200)
                from net._http_response r
               where r.created > '${DISPATCH_SCHEDULED_AT}'::timestamptz
               order by r.created desc
               limit 5;"
            echo "What cron recorded for clove-dispatch since then, newest first:"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
              select d.start_time || '  ' || d.status || '  ' || left(coalesce(d.return_message, ''), 200)
                from cron.job_run_details d
                join cron.job j on j.jobid = d.jobid
               where j.jobname = 'clove-dispatch'
                 and d.start_time > '${DISPATCH_SCHEDULED_AT}'::timestamptz
               order by d.start_time desc
               limit 5;"
            codes=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
              select coalesce(string_agg(distinct coalesce(r.status_code::text, case when r.timed_out then 'timeout' else 'error' end), ' '), '')
                from net._http_response r
               where r.created > '${DISPATCH_SCHEDULED_AT}'::timestamptz;")
            set -e
            diagnosis=""
            for code in $codes; do
              case "$code" in
                401) diagnosis+=" 401: the gateway refused the request before the function ran, so the deployed dispatch function still has verify_jwt = true. supabase/config.toml says false, and the Supabase GitHub integration applies it when it deploys main: check that deploy ran." ;;
                403) diagnosis+=" 403: the function refused the secret: the header matched neither the vault's cloveerp_dispatch_secret nor CLOVEERP_DISPATCH_SECRET. A warm function keeps what it read from the vault for up to five minutes, so if the entry was just created or changed, run this workflow again." ;;
                404) diagnosis+=" 404: nothing is deployed at ${DISPATCH_URL}: the function has not been deployed, or the dispatch URL deploy.yml gives this deployment (CLOVEERP_DISPATCH_URL or CLOVEERP_DEMO_DISPATCH_URL) names the wrong one." ;;
                500) diagnosis+=" 500: the function ran and could not drain. The body above names the setting (a database URL, CLOVEERP_TENANTS without CLOVEERP_PRINCIPALS) or the error; the function's log has the rest." ;;
                timeout) diagnosis+=" timed out: pg_net stopped waiting before the function answered, and no pass followed, so the function did not finish either: its log says where it stopped." ;;
                *) diagnosis+=" ${code}: see the responses above." ;;
              esac
            done
            if [[ -z "${codes// /}" ]]; then
              diagnosis=" pg_net recorded no response at all: cron has not fired clove-dispatch (the cron rows above say whether it ran and what it returned), or every request is still in flight."
            fi
            echo "::error::clove-dispatch is scheduled and no drain pass was recorded in four minutes, so no email is leaving.${diagnosis}"
            exit 1
          fi

          last=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select 'last pass ' || p.finished_at || ' by ' || p.worker
                   || ': ' || coalesce(p.report ->> 'organisations', '?') || ' organisation(s), email sent '
                   || coalesce(p.report ->> 'emailSent', '0') || ', email failed '
                   || coalesce(p.report ->> 'emailFailed', '0') || ', failed stages '
                   || coalesce(p.report ->> 'failures', '0')
              from erp_meta.drain_pass p
             order by p.finished_at desc
             limit 1;")
          echo "$last"
          echo "- ${last}" >> "$GITHUB_STEP_SUMMARY"
          # A stage that failed in one organisation does not stop the others'
          # email, so it is not this proof's failure; it is still worth a line.
          failed=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select coalesce(max((p.report ->> 'failures')::int), 0)
              from erp_meta.drain_pass p
             where p.finished_at > '${DISPATCH_SCHEDULED_AT}'::timestamptz;")
          if [[ "$failed" -gt 0 ]]; then
            echo "::warning::a drain pass since this deploy had ${failed} failed stage(s). Email is leaving; something in at least one organisation is not. The dispatch function's log names the organisation and the stage."
          fi

      - name: The sweep can be woken
        # The console's requests (a client's build, a release train) are
        # started by fleet_sweep.yml, which runs every ten minutes: up to ten
        # minutes of "Queued" after the owner pressed a button. The control
        # plane can start the sweep at once instead, the moment a request is
        # written (20261012010000: a trigger on erp_meta.fleet_request posts a
        # workflow_dispatch to GitHub through pg_net), if it holds a token
        # GitHub accepts for that. The application never holds it: a token in
        # the application's secrets is a token in every host it serves.
        #
        # The token is CLOVEERP_SWEEP_TOKEN, a fine-grained GitHub token with
        # Actions read and write on this repository only, which the owner
        # creates and sets as a repository secret. This puts it in the
        # control plane's vault as cloveerp_sweep_token, the way the dispatch
        # secret is kept: written inside the database, never printed, updated
        # when the secret changes. Then erp_meta.set_fleet_dispatch() is told
        # which repository's sweep to wake. Without the secret, nothing is
        # stored and the sweep runs on its schedule, as it always has.
        #
        # Production only, last, and only when everything before it passed:
        # the release is applied and proved by now, so this failing leaves the
        # release standing and says what was not stored.
        if: ${{ success() && env.KIND == 'production' && !(inputs.mark_applied || inputs.repair_gateway_bodies) }}
        env:
          SWEEP_TOKEN: ${{ secrets.sweep_token }}
        run: |
          set -euo pipefail
          if [[ -n "${SWEEP_TOKEN}" ]]; then
            echo "::add-mask::${SWEEP_TOKEN}"
          fi
          held=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -tAc "select exists (select 1 from vault.secrets where name = 'cloveerp_sweep_token');")
          if [[ -z "${SWEEP_TOKEN}" ]]; then
            if [[ "$held" == t ]]; then
              echo "::notice::CLOVEERP_SWEEP_TOKEN is not set, so this release stored no token. The control plane's vault still holds the one an earlier release put there (cloveerp_sweep_token), which wakes the sweep for as long as GitHub accepts it; once GitHub refuses it, the console's requests wait for the sweep's ten-minute schedule."
              echo "- The sweep: CLOVEERP_SWEEP_TOKEN not set; the vault keeps the token an earlier release stored" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::notice::CLOVEERP_SWEEP_TOKEN is not set, so the control plane cannot wake the sweep: the console's requests are started by fleet_sweep.yml's ten-minute schedule only. To start them at once, create a fine-grained GitHub token with Actions read and write on ${GITHUB_REPOSITORY} and set it as the repository secret CLOVEERP_SWEEP_TOKEN; the next release to the control plane stores it."
              echo "- The sweep: runs on its ten-minute schedule only (no CLOVEERP_SWEEP_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          # A GitHub token is letters, digits and underscores. Anything else (a
          # space or a line break pasted with it) would break the request
          # header it goes in, and every wake would fail without a word.
          if ! [[ "${SWEEP_TOKEN}" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "::error::CLOVEERP_SWEEP_TOKEN has characters a GitHub token never has (a space or a line break pasted with it?), so it was not stored and the sweep is not woken by it. Set the secret again with the token alone. The release itself is applied and proved."
            exit 1
          fi
          if ! [[ "${GITHUB_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::the repository's name (${GITHUB_REPOSITORY}) is not owner/name, so the control plane was not told which sweep to wake. The release itself is applied and proved."
            exit 1
          fi

          # What will become of the token, read first (created, updated or
          # unchanged), then the change itself in one transaction: updated
          # where it is held and differs, created where it is not. On standard
          # input, not -c: psql substitutes :'token' only there.
          if ! stored=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -tA -v token="${SWEEP_TOKEN}" <<'SQL'
          select case
                   when not exists (select 1 from vault.secrets s where s.name = 'cloveerp_sweep_token') then 'created'
                   when exists (select 1 from vault.decrypted_secrets d
                                 where d.name = 'cloveerp_sweep_token' and d.decrypted_secret is distinct from :'token') then 'updated'
                   else 'unchanged'
                 end;
          SQL
          ); then
            echo "::error::the control plane's vault could not be read (the error is above), so the sweep's token was not stored and the console's requests wait for the sweep's ten-minute schedule. The release itself is applied and proved; the next release to the control plane tries again."
            exit 1
          fi
          if [[ "$stored" != unchanged ]]; then
            if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -tA -v token="${SWEEP_TOKEN}" > /dev/null <<'SQL'
          begin;
          select vault.update_secret(d.id, :'token')
            from vault.decrypted_secrets d
           where d.name = 'cloveerp_sweep_token' and d.decrypted_secret is distinct from :'token';
          select vault.create_secret(:'token', 'cloveerp_sweep_token',
                   'A fine-grained GitHub token (Actions read and write on this repository) with which the control plane wakes fleet_sweep.yml when the console asks for something. Stored by release.yml from CLOVEERP_SWEEP_TOKEN and never printed.')
           where not exists (select 1 from vault.secrets s where s.name = 'cloveerp_sweep_token');
          commit;
          SQL
            then
              echo "::error::the sweep's token could not be stored in the control plane's vault (the error is above), so the console's requests wait for the sweep's ten-minute schedule. The release itself is applied and proved; the next release to the control plane tries again."
              exit 1
            fi
          fi

          has=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -tAc "select to_regprocedure('erp_meta.set_fleet_dispatch(text)') is not null")
          if [[ "$has" != t ]]; then
            echo "::notice::the sweep's token is in the control plane's vault (${stored}), and the control plane predates 20261012010000, which wakes the sweep with it; until a release brings that, the console's requests wait for the sweep's ten-minute schedule."
            echo "- The sweep: token ${stored}; the control plane cannot wake the sweep yet (20261012010000 not released)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -tA -v repo="${GITHUB_REPOSITORY}" > /dev/null <<'SQL'
          select erp_meta.set_fleet_dispatch(:'repo');
          SQL
          then
            echo "::error::the sweep's token is in the control plane's vault (${stored}), and erp_meta.set_fleet_dispatch() refused ${GITHUB_REPOSITORY} (the error is above), so the control plane does not know which sweep to wake. The release itself is applied and proved."
            exit 1
          fi
          echo "the sweep's token: ${stored}; the control plane wakes fleet_sweep.yml on ${GITHUB_REPOSITORY} when the console asks for something"
          echo "- The sweep: woken by the control plane on ${GITHUB_REPOSITORY} (token ${stored}); its ten-minute schedule stays as the fallback" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the outcome in the control plane's register
        # A client's release, whatever became of it, is written on its row in
        # erp_meta.deployment on the control plane (20261011020000): the sha,
        # the outcome, the run. The Fleet view reads it; "the morning with
        # twenty clients and three red" starts there, not in twenty run logs.
        # always(), so a failed or cancelled release is recorded as such.
        # Never fails the release it records: the register being unreachable
        # is a second problem, said as a warning.
        if: ${{ always() && env.KIND == 'client' }}
        env:
          OUTCOME: ${{ job.status }}
        run: |
          set -uo pipefail
          if [[ -z "${CP_URL}" ]]; then
            echo "::warning::no control plane connection, so this release of ${TARGET} (${OUTCOME}) was not recorded in the register."
            exit 0
          fi
          if psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA \
               -v code="${TARGET}" -v sha="${GITHUB_SHA}" -v outcome="${OUTCOME}" -v run="${GITHUB_RUN_ID}" > /dev/null <<'SQL'
          select erp_meta.record_deployment_release(:'code', :'sha', :'outcome', :'run', null);
          SQL
          then
            echo "register: ${TARGET} release of ${GITHUB_SHA} recorded as ${OUTCOME} (run ${GITHUB_RUN_ID})"
          else
            echo "::warning::the control plane's register did not take the record of this release of ${TARGET} (${OUTCOME}); the release itself stands."
          fi

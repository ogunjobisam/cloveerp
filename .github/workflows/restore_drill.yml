name: restore drill

# D28: a backup that has never been restored is a hope.
#
# erp_meta.continuity_commitment promises a restore drill every ninety days
# into an isolated environment, verified by running the invariant assertions
# against the restored data. Until this workflow every commitment read
# "never drilled", because nothing had ever restored anything.
#
# This drill: dump the live product schemas over the same connection the
# deploy uses, restore them into a fresh PostgreSQL of the live major version
# on the runner — an environment with no accumulated state and no route back
# to production — and run the whole console and the whole-database
# reconciliation against what came back. A restore that produces a database
# that cannot reconcile is a backup that cannot recover a business, however
# many bytes it held.
#
# The drill records itself. Once the restored copy has passed, the result —
# what was restored where, which assertions ran, how many passed — is written
# to erp_meta.restore_drill on live through erp.record_restore_drill(), over
# the same connection; erp.continuity_report() then reads `proved` for the
# restore_drill commitment instead of `never drilled`. A failure is recorded
# too, with what failed as its note.
#
# Then the second half: the per-organisation restore §16.5 also commits to.
# In the same restored copy, erp.isolate_tenant() purges every organisation
# but one — the copy has to name itself and declare itself a restore target
# first, and a database called `postgres` (which is what live is called) is
# refused — and the console and the reconciliation run again over the lone
# organisation. That is recorded as per_tenant_restore, scoped to the
# organisation. The drill fails unless both commitments read proved on live.
#
# Per client, since 8 October. One Supabase project per client (the owner's
# decision of 7 October) is one database per client to restore, and each
# holds its own continuity commitments, its own restore register and its own
# erp.continuity_report(): a drill of the control plane proves nothing about
# any of them. So a drill has a target. Empty is the control plane, as it
# always was. A client's code drills that client: its connection string is
# read from the control plane's vault as deploy.yml's dry run reads it
# (supabase/ci/fleet_register.sh row and vault-get, masked the moment it is
# read, refused unless it names the client's project and no other), the dump
# is taken from it, the drill is recorded in it, where its commitments are,
# and its second half restores the client's one organisation, whose code is
# the deployment's. A note on the client's row in the control plane's
# register says the drill ran and how it went.
#
# Runs on the first day of every third month — the control plane first, then
# every built or live client, one at a time, since each drill dumps a live
# database and the fleet's databases are small instances — and on demand,
# for one target.

on:
  schedule:
    - cron: '0 6 1 */3 *'
  workflow_dispatch:
    inputs:
      target:
        description: "A client's code, to drill that client's database. Empty: the control plane, as always."
        type: string
        default: ''
      tenant_code:
        description: "The organisation to restore alone in the second half. Empty: on the control plane the oldest active one; on a client its own, whose code is the client's."
        type: string
        default: ''

jobs:
  targets:
    # Which databases this run drills, as a list the drill job runs one at a
    # time. Nothing secret: a code, and the organisation to restore alone.
    name: which databases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      drills: ${{ steps.read.outputs.drills }}
    env:
      CP_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
      EVENT: ${{ github.event_name }}
      TARGET: ${{ inputs.target }}
      TENANT_CODE: ${{ inputs.tenant_code }}
    steps:
      - name: Install the psql client
        if: github.event_name == 'schedule'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Read the register
        id: read
        run: |
          set -euo pipefail
          if [[ -z "${CP_URL}" ]]; then
            echo "::error::CLOVEERP_LIVE_DATABASE_URL is not set; there is nothing to restore from, and no register to find the clients in. Nothing was drilled."
            exit 1
          fi
          if [[ "${EVENT}" == workflow_dispatch ]]; then
            target="${TARGET// /}"
            tenant="${TENANT_CODE// /}"
            if [[ -n "$target" ]] && ! [[ "$target" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
              echo "::error::'${target}' is not a client's code. Name a built or live client, or leave target empty for the control plane. Nothing was drilled."
              exit 1
            fi
            # Written into SQL further on, so only the characters a code is made of.
            if [[ -n "$tenant" ]] && ! [[ "$tenant" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
              echo "::error::'${tenant}' is not an organisation's code. Nothing was drilled."
              exit 1
            fi
            drills=$(jq -cn --arg t "$target" --arg c "$tenant" \
                       '[{target: $t, tenant_code: (if $c != "" then $c else $t end)}]')
          else
            # The quarter's drill: the control plane, then every built or live
            # client, each restoring its own organisation alone.
            clients='[]'
            if [[ "$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tAc "select to_regclass('erp_meta.deployment') is not null")" == "t" ]]; then
              clients=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tAc "
                select coalesce(jsonb_agg(d.code order by d.code), '[]'::jsonb)
                  from erp_meta.deployment d
                 where d.status in ('built', 'live')
                   and d.project_ref is not null;")
            fi
            drills=$(jq -c '[{target: "", tenant_code: ""}] + map({target: ., tenant_code: .})' <<< "$clients")
          fi
          echo "drills=${drills}" >> "$GITHUB_OUTPUT"
          {
            echo "## Restore drills"
            jq -r '.[] | "- " + (if .target == "" then "the control plane" else .target end)' <<< "$drills"
          } >> "$GITHUB_STEP_SUMMARY"

  drill:
    needs: targets
    name: drill ${{ matrix.target || 'the control plane' }}
    runs-on: ubuntu-latest
    # A dump, a restore and the whole console twice. Long for any database
    # the fleet holds, and short enough that a drill stuck on a lock does not
    # hold the next one back for the default six hours.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One at a time: each drill dumps a live database.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.drills) }}
    # Per target, so a drill of one client never waits on, or displaces, a
    # drill of another.
    concurrency:
      group: restore-drill-${{ matrix.target || 'control-plane' }}
      cancel-in-progress: false
    env:
      # The control plane: the register and the vault. DB_URL, the database
      # drilled, is written by "The database to drill" below.
      CP_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
      TARGET: ${{ matrix.target }}
      TENANT_CODE: ${{ matrix.tenant_code }}
      PRODUCTION_REF: ${{ vars.CLOVEERP_PROJECT_REF || 'xpzffnnhnhcqyjqcueja' }}
      DEMO_REF: ${{ vars.CLOVEERP_DEMO_PROJECT_REF }}
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PSQL: psql -v ON_ERROR_STOP=1 --quiet --no-psqlrc
    steps:
      - uses: actions/checkout@v4

      - name: The secret exists
        run: |
          if [[ -z "${CP_URL}" ]]; then
            echo "::error::CLOVEERP_LIVE_DATABASE_URL is not set; there is nothing to restore from."
            exit 1
          fi

      - name: Install the client tools of the live major version
        # pg_dump must be at least the server's version. The apt client is
        # 16; the live project is 17.6.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # Ubuntu's pg_wrapper answers pg_dump with the runner's own 16
          # cluster's tools even once 17 is installed (template.yml's first
          # run, 9 Oct: "server version: 17.6; pg_dump version: 16.15"), so
          # the 17 tools go first on the path for every later step.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -q ' 17\.' \
            || { echo "::error::pg_dump 17 is not where it was installed, so nothing was dumped."; exit 1; }

      - name: The database to drill
        # The control plane's own connection, or a client's from the
        # control plane's vault: read, masked before anything else is
        # printed, and refused unless it names the client's project and no
        # other deployment's. Every step after this one reads DB_URL.
        run: |
          set -euo pipefail
          if [[ -z "${TARGET}" ]]; then
            echo "DB_URL=${CP_URL}" >> "$GITHUB_ENV"
            echo "DRILL_SOURCE=live" >> "$GITHUB_ENV"
            echo "drilling the control plane"
            exit 0
          fi
          reg=supabase/ci/fleet_register.sh
          row=$(CLOVEERP_LIVE_DATABASE_URL="$CP_URL" $reg row "${TARGET}")
          if [[ -z "$row" ]]; then
            echo "::error::${TARGET} is not in the control plane's register, so there is no database of that name to drill. Nothing was dumped."
            exit 1
          fi
          status=$(sed -n 's/^status=//p' <<< "$row")
          ref=$(sed -n 's/^ref=//p' <<< "$row")
          case "$status" in
            built|live|suspended|retiring) : ;;
            *)
              echo "::error::${TARGET} is ${status}: only a client whose database exists (built, live, suspended or retiring) is drilled. Nothing was dumped."
              exit 1 ;;
          esac
          if ! [[ "$ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::the register gives ${TARGET} no project ref ('${ref}'). Nothing was dumped."
            exit 1
          fi
          vault="cloveerp:deployment:${ref}:db_url"
          url=$(CLOVEERP_LIVE_DATABASE_URL="$CP_URL" $reg vault-get "$vault")
          [[ -z "$url" ]] || echo "::add-mask::${url}"
          if [[ -z "$url" ]]; then
            echo "::error::the control plane's vault has no ${vault}, so ${TARGET} cannot be reached. Its build from empty writes that entry. Nothing was dumped."
            exit 1
          fi
          if [[ "$url" != *"${ref}"* ]]; then
            echo "::error::${vault} does not name ${TARGET}'s project (${ref}). Nothing was dumped."
            exit 1
          fi
          # On standard input, not -c: psql substitutes :'code' only there.
          others=$(psql "$CP_URL" -v ON_ERROR_STOP=1 -X -q -tA -v code="${TARGET}" <<'SQL'
          select coalesce(string_agg(d.project_ref, ','), '')
            from erp_meta.deployment d
           where d.code <> :'code' and d.project_ref is not null;
          SQL
          )
          IFS=',' read -r -a refs <<< "${others},${PRODUCTION_REF},${DEMO_REF}"
          for other in ${refs[@]+"${refs[@]}"}; do
            other="${other// /}"
            if [[ -n "$other" && "$other" != "$ref" && "$url" == *"$other"* ]]; then
              echo "::error::${vault} names another deployment's project (${other}), not ${TARGET}'s (${ref}). Nothing was dumped."
              exit 1
            fi
          done
          echo "DB_URL=${url}" >> "$GITHUB_ENV"
          echo "DRILL_SOURCE=${TARGET} (project ${ref})" >> "$GITHUB_ENV"
          echo "drilling ${TARGET}: project ${ref}, ${status}"

      - name: Take the backup
        # The product's own schemas and the migration history. auth and storage
        # belong to the host and are restored by the host; the drill is about
        # whether the business can be recovered from what the product owns.
        #
        # Privileges travel with the dump. Without them the restored copy has
        # the host's default grants — every door executable by anon, every
        # routine with no ACL — and the console refuses it for exactly that,
        # which would be the drill finding a fault in itself. The roles the
        # ACLs name exist on the copy: the bootstrap creates three, and
        # clove_enquiry is created below before the restore.
        run: |
          set -euo pipefail
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          pg_dump "$DB_URL" --format=custom --no-owner \
            --schema=erp --schema=erp_ref --schema=erp_meta --schema=erp_ai \
            --schema=erp_test --schema=erp_ingress --schema=public \
            --schema=supabase_migrations \
            --file=live.dump
          ls -l live.dump
          echo "backup of ${DRILL_SOURCE}: $(stat -c %s live.dump) bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Start an isolated PostgreSQL
        run: |
          set -euo pipefail
          docker run -d --name clove-erp-restore \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            public.ecr.aws/supabase/postgres:17.6.1.167
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "PostgreSQL did not become ready" >&2; exit 1

      - name: Restore into it
        # The host contract first (roles, auth.uid(), the extensions schema),
        # then the extensions the product creates in its own migrations, then
        # the dump. supabase_migrations is created by the dump itself.
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -c 'create database clove_restore'
          $PSQL -d clove_restore -f supabase/ci/00_host_bootstrap.sql
          $PSQL -d clove_restore -c 'create extension if not exists pgcrypto with schema extensions;
                                     create extension if not exists pg_jsonschema with schema extensions;
                                     create extension if not exists btree_gist with schema extensions;'
          $PSQL -d clove_restore -c 'create role clove_enquiry nologin nobypassrls noinherit' || true
          # The dump carries CREATE SCHEMA public, which the image already has.
          # Everything else in it is restored.
          pg_restore -l live.dump | grep -v 'SCHEMA - public' > live.list
          pg_restore --dbname=clove_restore --no-owner --exit-on-error --single-transaction -L live.list live.dump
          # The host's default privileges hand anon EXECUTE to every function
          # as it is created, and a dump's ACL commands are written relative
          # to PostgreSQL's own defaults, not the host's — so a restored copy
          # carries an anon grant on every door that the product had revoked.
          # The product's grants are regenerated from its own registers, which
          # is what the console then checks.
          psql -v ON_ERROR_STOP=1 -d clove_restore -qc "
            revoke all on all functions in schema public, erp, erp_ref, erp_meta, erp_ai, erp_test, erp_ingress from anon;
            select erp.apply_execute_grants();"
          # A restored database has no statistics; the planner needs them before
          # anything reads the catalogue at volume.
          psql -v ON_ERROR_STOP=1 -d clove_restore -qc 'analyze'
          psql -v ON_ERROR_STOP=1 -d clove_restore -tAc "select 'restored: ' || count(*) || ' organisation(s), ' || (select count(*) from erp.document) || ' document(s)' from erp.tenant" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the invariant assertions against the restored data
        # What ran, how many passed and how many failed are captured for the
        # record below, whichever way it goes.
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d clove_restore -tAc "
            select string_agg(quote_literal(c ->> 'code'), ',' order by c ->> 'code')
                   || '|' || count(*) filter (where (c ->> 'ok')::boolean)
                   || '|' || count(*) filter (where not (c ->> 'ok')::boolean)
              from jsonb_array_elements(erp.platform_assurance()) c;" > assurance.txt
          IFS='|' read -r RAN PASSED FAILED < assurance.txt
          {
            echo "DRILL_RAN=$RAN"
            echo "DRILL_PASSED=$PASSED"
            echo "DRILL_FAILED=$FAILED"
          } >> "$GITHUB_ENV"
          bad=$(psql -v ON_ERROR_STOP=1 -d clove_restore -tAc "
            select coalesce(string_agg(c ->> 'code' || ': ' || left(c ->> 'detail', 120), E'\n'), '')
              from jsonb_array_elements(erp.platform_assurance()) c
             where not (c ->> 'ok')::boolean;")
          if [[ -n "$bad" ]]; then
            echo "DRILL_NOTE<<EOF" >> "$GITHUB_ENV"
            echo "$bad" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
            echo "::error::the restored database does not pass the console:"
            echo "$bad"
            exit 1
          fi
          if ! out=$(psql -v ON_ERROR_STOP=1 -d clove_restore -tAc "select erp.assert_whole_database_reconciles();" 2>&1); then
            echo "DRILL_NOTE<<EOF" >> "$GITHUB_ENV"
            echo "$out" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
            echo "::error::the restored database does not reconcile:"
            echo "$out"
            exit 1
          fi
          echo "$out"
          {
            echo "## Restore drill of ${DRILL_SOURCE}"
            echo "- platform_assurance: $PASSED check(s) green on the restored database"
            echo "- $out"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the drill in the database it restored
        # Whichever way it went. A passed drill names every assertion it ran; a
        # failed one carries what failed as its note. Recorded over the owner
        # connection of the database drilled — the control plane, or the
        # client, whose commitments are its own — which is what
        # erp.record_restore_drill() trusts.
        if: always() && env.DRILL_RAN != ''
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" || -z "${DRILL_NOTE:-}" ]]; then
            outcome=passed; note="run ${GITHUB_RUN_ID}"
          else
            outcome=failed; note="run ${GITHUB_RUN_ID}: ${DRILL_NOTE}"
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select erp.record_restore_drill(
              'restore_drill', '${STARTED_AT}'::timestamptz, now(),
              'pg_dump of ${DRILL_SOURCE} on $(date -u +%F)',
              'github runner, supabase/postgres:17.6.1.167, database clove_restore',
              array[${DRILL_RAN},'erp.assert_whole_database_reconciles']::text[],
              ${DRILL_PASSED} + 1, ${DRILL_FAILED}, '${outcome}', null, \$note\$${note}\$note\$, 'restore_drill.yml');"
          echo "- recorded in erp_meta.restore_drill as ${outcome}" >> "$GITHUB_STEP_SUMMARY"

      - name: One organisation, restored alone
        # §16.5's per-organisation restore, in the same copy: the copy names
        # itself, declares itself a restore target for one transaction, and
        # keeps one organisation. Then the same two checks over what is left,
        # and a second record.
        #
        # A client holds one organisation, whose code is the deployment's. A
        # client built and not yet onboarded holds none: there is nothing to
        # restore alone, and this says so rather than failing the quarter.
        run: |
          set -euo pipefail
          CODE="${TENANT_CODE}"
          if [[ -n "${TARGET}" && "$(psql -v ON_ERROR_STOP=1 -d clove_restore -tAc "select count(*) from erp.tenant")" == 0 ]]; then
            echo "::notice::${TARGET} holds no organisation yet, so no organisation was restored alone; per_tenant_restore stays as it was."
            echo "PER_TENANT=skipped" >> "$GITHUB_ENV"
            echo "- one organisation restored alone: skipped, ${TARGET} holds none yet" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$CODE" ]]; then
            CODE=$(psql -v ON_ERROR_STOP=1 -d clove_restore -tAc "select code from erp.tenant where status = 'active' order by created_at limit 1")
          fi
          if [[ -z "$CODE" ]]; then
            echo "::error::the restored copy of ${DRILL_SOURCE} holds no active organisation to restore alone."
            exit 1
          fi
          if [[ "$(psql -v ON_ERROR_STOP=1 -d clove_restore -tAc "select count(*) from erp.tenant where code = '$CODE'")" == 0 ]]; then
            echo "::error::the restored copy of ${DRILL_SOURCE} holds no organisation ${CODE}. Name one with tenant_code."
            exit 1
          fi
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          psql -v ON_ERROR_STOP=1 -d clove_restore -tAc "
            begin;
            select set_config('erp.restore_target', current_database(), true);
            select erp.isolate_tenant('$CODE', current_database());
            commit;" | tail -1
          note="run ${GITHUB_RUN_ID}"; outcome=passed
          bad=$(psql -v ON_ERROR_STOP=1 -d clove_restore -tAc "
            select coalesce(string_agg(c ->> 'code' || ': ' || left(c ->> 'detail', 120), E'\n'), '')
              from jsonb_array_elements(erp.platform_assurance()) c
             where not (c ->> 'ok')::boolean;")
          if [[ -n "$bad" ]]; then outcome=failed; note="run ${GITHUB_RUN_ID}: ${bad}"; fi
          if ! out=$(psql -v ON_ERROR_STOP=1 -d clove_restore -tAc "select erp.assert_whole_database_reconciles();" 2>&1); then
            outcome=failed; note="run ${GITHUB_RUN_ID}: ${out}"
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select erp.record_restore_drill(
              'per_tenant_restore', '${started}'::timestamptz, now(),
              'the full restore above', 'the same copy, every other organisation purged',
              array[${DRILL_RAN},'erp.assert_whole_database_reconciles']::text[],
              case when '${outcome}' = 'passed' then ${DRILL_PASSED} + 1 else ${DRILL_PASSED} end,
              case when '${outcome}' = 'passed' then 0 else 1 end,
              '${outcome}', '$CODE', \$note\$${note}\$note\$, 'restore_drill.yml');"
          echo "- one organisation ($CODE) restored alone: ${outcome}; $out" >> "$GITHUB_STEP_SUMMARY"
          [[ "$outcome" == "passed" ]]

      - name: Both commitments read proved
        # In the database drilled: a client's commitments are its own.
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select '- ' || commitment_code || ': ' || state from erp.continuity_report()" | tee -a "$GITHUB_STEP_SUMMARY"
          wanted="'restore_drill', 'per_tenant_restore'"
          [[ "${PER_TENANT:-}" != skipped ]] || wanted="'restore_drill'"
          not_proved=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select string_agg(commitment_code, ', ') from erp.continuity_report()
             where commitment_code in (${wanted}) and state <> 'proved';")
          if [[ -n "$not_proved" ]]; then
            echo "::error::not proved on ${DRILL_SOURCE} after this drill: $not_proved"
            exit 1
          fi

      - name: Say so on the client's row
        # The control plane's register, so the Fleet view shows when each
        # client was last drilled and how it went: a note, which never moves
        # the client's status. Never the reason a drill goes red.
        if: always() && env.TARGET != ''
        env:
          CLOVEERP_LIVE_DATABASE_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
          OUTCOME: ${{ job.status }}
        run: |
          case "${OUTCOME}" in
            success) words="restore drill passed: a dump restored into an isolated PostgreSQL, the console and the reconciliation green, recorded in its own database" ;;
            *) words="restore drill ${OUTCOME}: run ${GITHUB_RUN_ID} says which step" ;;
          esac
          supabase/ci/fleet_register.sh event "${TARGET}" note note "${words}" ||
            echo "::warning::the control plane's register could not be told about ${TARGET}'s drill; the drill itself is recorded in ${TARGET}'s database."

name: fleet poll

# How each client is, written where the Fleet view shows it.
#
# One Supabase project per client (the owner's decision of 7 October), so a
# client's health is in a database the control plane cannot see. This poll
# reads each client whose database is up (built, live, suspended or retiring)
# in turn (supabase/ci/fleet_poll.sh): its newest proved release, its size,
# its last drain pass, its open support windows, whether its staff are the
# control plane's, and, from the Management API, its backups; and once a day, the full poll, the same
# assurance every release proves. It writes them on the client's row in the
# control plane's register (erp_meta.record_deployment_health); a client
# whose row has not been written for 26 hours reads "silent" there.
#
# Hourly, light, at seven minutes past, except at three in the morning (UTC),
# when the full poll runs instead: nobody is at work, and the assurance is
# the heaviest thing the poll asks of a 1 GB instance. By hand, either, for
# every client or one.
#
# One client never stops the poll: what could not be read is written in
# that client's errors and the next is read all the same. The run goes red
# only when the control plane itself cannot be read or written. Every
# connection string comes from the control plane's vault, masked before
# anything else is printed.

on:
  schedule:
    - cron: '7 0-2,4-23 * * *'
    - cron: '7 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "light (every hour) or full (with the assurance, as at 03:07 UTC)."
        type: choice
        options: [light, full]
        default: light
      code:
        description: "One client's code, as the register holds it; empty for every client whose database is up (built, live, suspended or retiring)."
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: fleet-poll
  cancel-in-progress: false

jobs:
  poll:
    name: ${{ (github.event.schedule == '7 3 * * *' || inputs.mode == 'full') && 'the full poll' || 'the hourly poll' }}
    runs-on: ubuntu-latest
    # The full poll runs the assurance on each client, one at a time, each
    # under five minutes; the hourly poll is a handful of statements each.
    timeout-minutes: ${{ (github.event.schedule == '7 3 * * *' || inputs.mode == 'full') && 120 || 30 }}
    env:
      CLOVEERP_LIVE_DATABASE_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_REF: ${{ vars.CLOVEERP_PROJECT_REF || 'xpzffnnhnhcqyjqcueja' }}
      DEMO_REF: ${{ vars.CLOVEERP_DEMO_PROJECT_REF }}
      MODE: ${{ (github.event.schedule == '7 3 * * *' || inputs.mode == 'full') && 'full' || 'light' }}
      # In the environment, never in the script's text: an input is whatever
      # was typed.
      CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.code || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Read every client, and write what was read
        run: |
          set -euo pipefail
          if [[ -z "${CLOVEERP_LIVE_DATABASE_URL}" ]]; then
            echo "::error::CLOVEERP_LIVE_DATABASE_URL is not set, so the register cannot be read or written. Nothing was polled."
            exit 1
          fi
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not available to this run, so no client's backups are read; each client's errors say so."
          fi
          if [[ -n "${CODE}" ]]; then
            supabase/ci/fleet_poll.sh "${MODE}" "${CODE}"
          else
            supabase/ci/fleet_poll.sh "${MODE}"
          fi

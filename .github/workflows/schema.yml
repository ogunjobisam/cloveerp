name: schema

# The product is a PostgreSQL schema, so the build is: stand it up from nothing
# and make it prove itself. Every migration ends by calling assertions designed
# to fail a build; without this workflow there was no build for them to fail.
#
# Two things this catches that applying migrations to a long-lived database
# structurally cannot:
#
#   - Whether the migration sequence still applies to an EMPTY cluster. A
#     database that has accumulated fixes out of band can be correct while the
#     repository that is supposed to reproduce it is not.
#   - Whether a test has quietly stopped existing. The suites assert their own
#     case counts, because a suite that loses a case reports success.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-assert:
    runs-on: ubuntu-latest

    # Deliberately NOT a `services:` container.
    #
    # The runner dumps a service container's entire stdout when it tears the job
    # down. This image logs every statement it executes, so that dump was ~380KB
    # of DDL — it swamped the retrievable log and left none of the step output
    # readable, which is worthless when the build passes and actively harmful
    # when it fails, because the failing assertion is buried in it.
    #
    # Two attempts to quieten the server were made first and both failed
    # silently: ALTER SYSTEM (the setting is pinned ahead of it in this image)
    # and a PGOPTIONS session GUC. Both left the log exactly as noisy while
    # reporting success, which is the failure mode this whole workflow exists to
    # catch — so neither belongs in it.
    #
    # A container started here is not managed by the runner and is therefore
    # never dumped. That addresses the mechanism rather than the symptom.

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: clove_erp
      # Any notice is noise; an error must stop the run at the statement that
      # caused it rather than carrying on and failing somewhere less useful.
      PSQL: psql -v ON_ERROR_STOP=1 --quiet --no-psqlrc

    steps:
      - uses: actions/checkout@v4
        with:
          # The immutability check compares this branch against its merge base,
          # which a depth-1 checkout does not have.
          fetch-depth: 0

      - name: An ungoverned entry point cannot survive its own transaction
        # §16.2. The build already runs erp.assert_public_api_safe() over the
        # whole schema, which catches an ungoverned door eventually. This closes
        # "eventually": a migration that creates a public function and does not
        # assert lands green on any environment that applies it, and the door
        # exists there until some later build happens to check.
        run: supabase/ci/boundary_in_migration.sh

      - name: A migration is written once
        # The one class of mistake this workflow structurally cannot catch by
        # building. Everything below stands the schema up from NOTHING, so a
        # migration edited after it was pushed is simply part of the file that
        # gets replayed — green here, and invisible on every environment that
        # has already applied it. A Supabase preview branch found one four
        # commits after it was made, which is three commits too late.
        run: supabase/ci/migrations_immutable.sh

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Start PostgreSQL
        # The Supabase image, because pg_jsonschema is a Rust extension that is
        # not installable from apt. Pinned, and pinned to the major version the
        # live project runs (17.6): an implicit upgrade of the database the
        # product is verified against is not something to discover from a red
        # build.
        run: |
          set -euo pipefail
          docker run -d --name clove-erp-pg \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            supabase/postgres:17.6.1.167

          # Readiness is this step's job now that the runner is not doing it.
          # Fail loudly on timeout rather than letting the next step present a
          # connection refusal as if the schema were at fault.
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready within 60s" >&2
          docker logs clove-erp-pg 2>&1 | tail -40 >&2
          exit 1

      - name: Create the database
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c 'create database clove_erp'

      - name: Bootstrap the host
        # Everything Clove ERP expects its host to provide, and nothing else. That
        # this file is short is the point: it is the whole Supabase surface.
        run: $PSQL -f supabase/ci/00_host_bootstrap.sql

      - name: Apply every migration, in order, to an empty database
        # --single-transaction so a migration is atomic. Without it psql
        # autocommits each statement, and a migration that fails halfway leaves
        # the tables it managed to create behind — so the next attempt fails on
        # "already exists" rather than on the real error, and the schema is in a
        # state no migration describes. Found the hard way applying B9 to a
        # scratch cluster.
        #
        # Safe here because no migration uses CREATE INDEX CONCURRENTLY or
        # anything else that refuses to run inside a transaction block.
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            echo "── $(basename "$f")"
            $PSQL --single-transaction -f "$f"
          done

      - name: Structural assertions
        # These read the catalogue: they answer "could this schema be wrong?"
        # rather than "is this data wrong?", so they need no fixtures.
        run: |
          set -euo pipefail
          for a in \
            "erp.assert_isolation()" \
            "erp.assert_audit_coverage()" \
            "erp.assert_attribution_coverage()" \
            "erp.assert_session_context_hygiene()" \
            "erp.assert_gateway_integrity()" \
            "erp.assert_scheduler_integrity()" \
            "erp.assert_governed_views_are_safe()" \
            "erp.assert_intelligence_boundary()" \
            "erp.assert_public_api_safe()" \
            "erp.assert_authorising_doors_are_volatile()" \
            "erp.assert_no_caller_reachable_internals()" \
            "erp.assert_authorise_codes_exist()" \
            "erp.assert_no_single_administrator_live_tenant()" \
            "erp.assert_no_dead_configuration()" \
            "erp.assert_master_data_sane()" \
            "erp.assert_inventory_sane()" \
            "erp.assert_procurement_controls_sane()" \
            "erp.assert_planning_sane()" \
            "erp.assert_production_sane()" \
            "erp.assert_sales_controls_sane()" \
            "erp.assert_quality_logistics_sane()" \
            "erp.assert_finance_depth_sane()" \
            "erp.assert_part5_coverage()" \
            "erp.assert_resource_coverage('en')" \
            "erp.assert_transaction_control_routines()" \
            "erp.assert_document_create_permissions()" \
            "erp.assert_configuration_promotable()" \
            "erp.assert_determination_coverage()" \
            "erp.assert_diagnostics_registered()" \
            "erp.assert_capabilities_sound()" \
            "erp.assert_starter_vocabularies_sound()" \
            "erp.assert_vocabulary_aligned()" \
            "erp.assert_packs_installable()" \
            "erp.assert_job_handlers_resolvable()" \
            "erp.assert_validation_environment_available()" \
            "erp.assert_acceptance_clauses_sound()" \
            "erp.assert_output_templates_sound()" \
            "erp.assert_product_decisions_enforced()" \
            "erp.assert_entitlements_enforceable()" \
            "erp.assert_reports_reproducible()" \
            "erp.assert_output_integrity()" \
            "erp.assert_device_operations_sound()" \
            "erp.assert_release_integrity()" \
            "erp.assert_support_discipline()" \
            "erp.assert_pack_report_versions_sound()" \
            "erp.assert_device_task_handlers_sound()" \
            "erp.assert_migration_sound()" \
            "erp.assert_accessibility_register_sound()" \
            "erp.assert_personal_data_register_sound()" \
            "erp.assert_guidance_sound()" \
            "erp.assert_first_run_guidance_actionable()" \
            "erp.assert_meters_recorded()" \
            "erp.assert_reporting_services()" \
            "erp.assert_output_channels_sound()" \
            "erp.assert_commercial_sound()" \
            "erp.assert_commercial_quotes_sound()" \
            "erp.assert_contract_provisions_entitlement()" \
            "erp.assert_customer_view_sound()" \
            "erp.assert_refusals_name_next_action()"
          do
            printf '── %-45s' "$a"
            $PSQL -tAc "select $a;" | sed 's/^$/ok/'
          done

      - name: Adversarial suites
        # Each creates its own tenants, attacks them, and cleans up after
        # itself. Each also asserts its own case count, so a test that
        # disappears fails the build instead of passing quietly — which was
        # true of the isolation suite alone until 0044; the stock and gateway
        # suites reported n/n without ever saying what n should be.
        run: |
          set -euo pipefail
          for s in \
            "erp_test.assert_isolation_suite()" \
            "erp_test.assert_stock_invariants()" \
            "erp_test.assert_gateway_suite()" \
            "erp_test.assert_provisioning_suite()" \
            "erp_test.assert_procurement_suite()" \
            "erp_test.assert_sales_suite()" \
            "erp_test.assert_finance_suite()" \
            "erp_test.assert_master_data_suite()" \
            "erp_test.assert_inventory_suite()" \
            "erp_test.assert_procurement_controls_suite()" \
            "erp_test.assert_planning_suite()" \
            "erp_test.assert_production_suite()" \
            "erp_test.assert_sales_depth_suite()" \
            "erp_test.assert_quality_logistics_suite()" \
            "erp_test.assert_finance_depth_suite()" \
            "erp_test.assert_bootstrap_window_suite()" \
            "erp_test.assert_master_data_doors_suite()" \
            "erp_test.assert_document_authorisation_suite()" \
            "erp_test.assert_reference_reads_suite()" \
            "erp_test.assert_transition_menu_suite()" \
            "erp_test.assert_tenant_deletion_suite()" \
            "erp_test.assert_addendum_b_promotion_suite()" \
            "erp_test.assert_determination_coverage_suite()" \
            "erp_test.assert_policy_register_suite()" \
            "erp_test.assert_onboarding_interview_suite()" \
            "erp_test.assert_superadmin_suite()" \
            "erp_test.assert_starter_pack_acceptance()" \
            "erp_test.assert_false_success_suite()" \
            "erp_test.assert_validation_environment_suite()" \
            "erp_test.assert_document_spine_suite()" \
            "erp_test.assert_chart_alternative_suite()" \
            "erp_test.assert_output_template_suite()" \
            "erp_test.assert_commercial_suite()" \
            "erp_test.assert_reporting_suite()" \
            "erp_test.assert_output_suite()" \
            "erp_test.assert_device_suite()" \
            "erp_test.assert_release_suite()" \
            "erp_test.assert_support_suite()" \
            "erp_test.assert_promotion_completeness_suite()" \
            "erp_test.assert_device_boundary_suite()" \
            "erp_test.assert_incident_operations_suite()" \
            "erp_test.assert_device_drain_suite()" \
            "erp_test.assert_migration_cutover_suite()" \
            "erp_test.assert_accessibility_suite()" \
            "erp_test.assert_erasure_suite()" \
            "erp_test.assert_guidance_suite()" \
            "erp_test.assert_metering_suite()" \
            "erp_test.assert_profile_suite()" \
            "erp_test.assert_device_client_suite()" \
            "erp_test.assert_service_notice_suite()" \
            "erp_test.assert_reporting_services_suite()" \
            "erp_test.assert_output_channels_suite()" \
            "erp_test.assert_commercial_price_book_suite()" \
            "erp_test.assert_commercial_quote_suite()" \
            "erp_test.assert_commercial_contract_suite()" \
            "erp_test.assert_commercial_renewal_suite()" \
            "erp_test.assert_refusal_register_suite()" \
            "erp_test.assert_first_run_guidance_suite()" \
            "erp_test.assert_authorising_doors_suite()" \
            "erp_test.assert_caller_reachable_internal_suite()" \
            "erp_test.assert_authorise_code_suite()" \
            "erp_test.assert_prosrc_code_suite()" \
            "erp_test.assert_email_delivery_suite()" \
            "erp_test.assert_provisioning_window_suite()" \
            "erp_test.assert_support_entry_suite()" \
            "erp_test.assert_support_visibility_suite()" \
            "erp_test.assert_door_runs_suite()"
          do
            $PSQL -tAc "select $s;"
          done

      - name: Context does not survive a commit
        # The one property that cannot be tested inside a transaction, and
        # therefore cannot live in the suites above: a tenant context set by one
        # transaction must be gone in the next, or a pooled connection carries
        # it to whoever is served next.
        run: $PSQL -c 'call erp_test.assert_context_not_leaked();'

      - name: Every screen string has a row it can be renamed by
        # The terminology layer's premise is that renaming is a glossary change
        # with no code impact. That is only true of strings erp_ref.resource
        # holds — and when this step was written, 128 of the app's 201 ui()
        # literals had no row at any locale. Two thirds of the screen chrome
        # could not be renamed by a tenant, and was invisible to
        # erp.terminology_alignment_report(), which reads that table and
        # therefore showed zero drift over strings it could not see.
        #
        # A migration seeds what exists on the day it is written. Only this
        # notices the two hundred and second.
        run: supabase/ci/screen_strings.sh

      - name: The generators are idempotent
        # Row security, append-only guards, attribution and audit coverage are
        # all GENERATED from the table registry, and every migration ends by
        # running them again. If a second run produced a different schema, then
        # what a table's protection is would depend on how many migrations had
        # happened to run since it was created.
        #
        # This re-runs the generators, not the migrations: the migrations use
        # bare CREATE TABLE and are not designed to be applied twice.
        run: |
          set -euo pipefail
          shape() {
            $PSQL -tAc "select (select count(*) from pg_policy)
                            || '/' || (select count(*) from pg_trigger where not tgisinternal)"
          }
          before=$(shape)
          $PSQL -q >/dev/null <<'SQL'
          set client_min_messages = warning;
          select erp.apply_row_security();
          select erp.apply_append_only_guards();
          select erp.apply_attribution_triggers();
          select erp.apply_audit_coverage();
          SQL
          after=$(shape)
          echo "policies/triggers before: $before   after: $after"
          test "$before" = "$after"

  # ---------------------------------------------------------------------------
  # The part of the product that is not SQL
  #
  # Everything above builds the schema. Nothing built the two TypeScript
  # entrypoints that talk to it, and it showed: the Edge Function did not
  # compile at all. Its shared core used extensionless relative imports, which
  # Deno refuses, so module resolution failed at the first hop past index.ts —
  # twenty errors from a `deno check`, on a file whose header documents a deploy
  # command. Nothing here ran it, nothing deployed it, and the branching
  # integration skipped it because it was not declared in config.toml. The only
  # notice anyone got was a warning on a passing check.
  #
  # A separate job because it needs no database, and because "the schema is
  # fine, the worker does not compile" should be two answers rather than one.
  # ---------------------------------------------------------------------------
  typescript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Deno and Bun
        # Deno from npm rather than a marketplace action: it is one line, it
        # pins nothing this repository does not already trust, and it is the
        # same route used to verify the fix locally.
        run: |
          set -euo pipefail
          npm install -g deno@2
          npm install -g bun
          deno --version
          bun --version

      - name: The dispatch worker typechecks
        # It is imported by the Edge Function below, so a break here breaks
        # both. Cheap, and previously unbuilt by anything.
        run: |
          set -euo pipefail
          cd worker
          bun install --frozen-lockfile
          bun run typecheck

      - name: The application typechecks, lints and builds
        # This job covered the worker and the Edge Function and left the
        # 2,600-line application shell to nobody, under the strictest tsconfig
        # in the repository — exactOptionalPropertyTypes, noUncheckedIndexedAccess,
        # noPropertyAccessFromIndexSignature, all enforced by no one. A broken
        # route or a type error in the auth gate shipped green.
        #
        # `bun test src` is one file today. It earns its place: writing it found
        # two real bugs in the money conversion within a minute, one of which
        # would have written a price of nothing into the ledger.
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run test
          bun run build

      - name: The Edge Function builds
        # deno check resolves the whole import graph and typechecks it, which
        # is what the Edge Runtime will do to it. This is the check that was
        # missing: it fails on exactly the defect that shipped.
        run: |
          set -euo pipefail
          deno check --import-map supabase/functions/import_map.json \
            supabase/functions/dispatch/index.ts

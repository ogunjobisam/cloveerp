name: schema

# The product is a PostgreSQL schema, so the build is: stand it up from nothing
# and make it prove itself. Every migration ends by calling assertions designed
# to fail a build; without this workflow there was no build for them to fail.
#
# Two things this catches that applying migrations to a long-lived database
# structurally cannot:
#
#   - Whether the migration sequence still applies to an EMPTY cluster. A
#     database that has accumulated fixes out of band can be correct while the
#     repository that is supposed to reproduce it is not.
#   - Whether a test has quietly stopped existing. The suites assert their own
#     case counts, because a suite that loses a case reports success.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run's answer is worthless, so it should not still be running.
#
# There was no concurrency block here, and on 8-9 September ten of twenty-one
# runs were already obsolete while still burning minutes — several went stale
# two or three minutes in and then ran for another half hour. A push costs
# about fifty-six minutes of runner time across these jobs, so that was roughly
# five hours spent on commits that no longer existed, and it is what took the
# account to its Actions ceiling twice, at which point GitHub refuses to start
# any job at all: this build, the deploy, everything.
#
# Cancelling on pull requests only. A push to main is a release: two of them
# queue rather than one replacing the other, because the second cancelling the
# first would leave whatever the first was proving unproven.
concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-assert:
    runs-on: ubuntu-latest

    # Deliberately NOT a `services:` container.
    #
    # The runner dumps a service container's entire stdout when it tears the job
    # down. This image logs every statement it executes, so that dump was ~380KB
    # of DDL — it swamped the retrievable log and left none of the step output
    # readable, which is worthless when the build passes and actively harmful
    # when it fails, because the failing assertion is buried in it.
    #
    # Two attempts to quieten the server were made first and both failed
    # silently: ALTER SYSTEM (the setting is pinned ahead of it in this image)
    # and a PGOPTIONS session GUC. Both left the log exactly as noisy while
    # reporting success, which is the failure mode this whole workflow exists to
    # catch — so neither belongs in it.
    #
    # A container started here is not managed by the runner and is therefore
    # never dumped. That addresses the mechanism rather than the symptom.

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: clove_erp
      # Any notice is noise; an error must stop the run at the statement that
      # caused it rather than carrying on and failing somewhere less useful.
      PSQL: psql -v ON_ERROR_STOP=1 --quiet --no-psqlrc

    steps:
      - uses: actions/checkout@v4
        with:
          # The immutability check compares this branch against its merge base,
          # which a depth-1 checkout does not have.
          fetch-depth: 0

      - name: An ungoverned entry point cannot survive its own transaction
        # §16.2. The build already runs erp.assert_public_api_safe() over the
        # whole schema, which catches an ungoverned door eventually. This closes
        # "eventually": a migration that creates a public function and does not
        # assert lands green on any environment that applies it, and the door
        # exists there until some later build happens to check.
        run: supabase/ci/boundary_in_migration.sh

      - name: A migration is written once
        # The one class of mistake this workflow structurally cannot catch by
        # building. Everything below stands the schema up from NOTHING, so a
        # migration edited after it was pushed is simply part of the file that
        # gets replayed — green here, and invisible on every environment that
        # has already applied it. A Supabase preview branch found one four
        # commits after it was made, which is three commits too late.
        run: supabase/ci/migrations_immutable.sh

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Start PostgreSQL
        # The Supabase image, because pg_jsonschema is a Rust extension that is
        # not installable from apt. Pinned, and pinned to the major version the
        # live project runs (17.6): an implicit upgrade of the database the
        # product is verified against is not something to discover from a red
        # build.
        run: |
          set -euo pipefail
          docker run -d --name clove-erp-pg \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            supabase/postgres:17.6.1.167

          # Readiness is this step's job now that the runner is not doing it.
          # Fail loudly on timeout rather than letting the next step present a
          # connection refusal as if the schema were at fault.
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready within 60s" >&2
          docker logs clove-erp-pg 2>&1 | tail -40 >&2
          exit 1

      - name: Create the database
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c 'create database clove_erp'

      - name: Bootstrap the host
        # Everything Clove ERP expects its host to provide, and nothing else. That
        # this file is short is the point: it is the whole Supabase surface.
        run: $PSQL -f supabase/ci/00_host_bootstrap.sql

      # The database this build asserts against, restored when these exact
      # migrations have built one before.
      #
      # Replaying two hundred and seventy-eight files one at a time, each
      # re-running the generators, takes eighteen minutes, and it ran on every
      # push — including eleven in a row that changed nothing under supabase/.
      # It cannot simply be skipped when no migration changed: four of the
      # checks below compare src against this database, so they need one whether
      # or not the schema moved. What can be skipped is building it twice for
      # the same migrations.
      #
      # The cache replaces the construction, never the verification. Every
      # assertion in erp.ci_check_catalogue() still runs against whatever comes
      # out, cache or not, so a restore that lost something is caught by the
      # hundreds of checks that exist to catch exactly that.
      #
      # Keyed on the migrations and the bootstrap together, and deliberately
      # with no restore-keys: a near-miss cache is a wrong database, and there
      # is no version of that worth having. Change one migration and the key
      # changes and the replay runs in full. The image tag is in the key too,
      # because the extensions come from the image.
      - name: A database, if these migrations have built one before
        id: schema_cache
        uses: actions/cache@v4
        with:
          # Three parts, because a database is not the whole of what these
          # migrations build. Roles are cluster-level, so pg_dump does not
          # carry them; the third is what the roles are supposed to look like
          # once restored, which is not the same claim as their existing.
          path: |
            ${{ runner.temp }}/clove_erp.dump
            ${{ runner.temp }}/clove_erp.roles.sql
            ${{ runner.temp }}/clove_erp.roles.tsv
          # A new generation each time the shape changes, never a tolerated
          # old one: an entry that cannot restore would be replayed on every
          # run and never replaced, because its key is already taken. v1 held
          # a database and no roles. v2 held roles whose attributes did not
          # survive being applied.
          key: clove-erp-schema-v3-pg17.6.1.167-${{ hashFiles('supabase/migrations/**', 'supabase/ci/00_host_bootstrap.sql') }}

      - name: Apply every migration, in order, to an empty database
        # --single-transaction so a migration is atomic. Without it psql
        # autocommits each statement, and a migration that fails halfway leaves
        # the tables it managed to create behind — so the next attempt fails on
        # "already exists" rather than on the real error, and the schema is in a
        # state no migration describes. Found the hard way applying B9 to a
        # scratch cluster.
        #
        # Safe here because no migration uses CREATE INDEX CONCURRENTLY or
        # anything else that refuses to run inside a transaction block.
        run: |
          set -uo pipefail
          dump="$RUNNER_TEMP/clove_erp.dump"
          roles="$RUNNER_TEMP/clove_erp.roles.sql"
          roles_expected="$RUNNER_TEMP/clove_erp.roles.tsv"

          # What every role in this cluster is, in seven columns. Written when
          # the migrations build it and compared after a restore, because a
          # role that exists is not the same claim as a role that is what it
          # was — and the difference is the whole of what went wrong below.
          role_shape() {
            psql -tAF$'\t' -d postgres -c \
              "select rolname, rolsuper, rolinherit, rolcreaterole, rolcreatedb,
                      rolcanlogin, rolbypassrls
                 from pg_catalog.pg_roles order by rolname"
          }

          # Say which path this is taking, before taking it.
          #
          # The first warm run replayed and the log could not say why: a miss
          # went to the replay in silence, and eighteen minutes of migration
          # NOTICEs buried the only other evidence. A step whose behaviour
          # cannot be read afterwards is a step that cannot be trusted, so it
          # announces itself.
          echo "cache-hit: ${{ steps.schema_cache.outputs.cache-hit || 'false' }}"
          echo "dump present: $([[ -s "$dump" ]] && echo "yes, $(wc -c < "$dump") bytes" || echo no)"
          echo "roles present: $([[ -s "$roles" ]] && echo "yes, $(wc -c < "$roles") bytes" || echo no)"
          echo "role shape present: $([[ -s "$roles_expected" ]] && echo yes || echo no)"

          replay() {
            set -euo pipefail
            for f in supabase/migrations/*.sql; do
              echo "── $(basename "$f")"
              $PSQL --single-transaction -f "$f"
            done
            # Dumped and restored inside the container, not on the runner.
            #
            # The runner has Ubuntu's postgresql-client, which is 16.15, and the
            # server is the Supabase image at 17.6. psql spans that difference
            # without complaint — which is why every build so far has worked —
            # but pg_dump and pg_restore refuse a server newer than themselves,
            # and the first run of this cache found out the hard way:
            #
            #   pg_dump: error: aborting because of server version mismatch
            #   detail: server version: 17.6; pg_dump version: 16.15
            #
            # The container's own tools match its server by construction, so
            # they are the ones that do this. Nothing else in the job changes.
            #
            # Dumped before the seed, so what is cached is the schema this
            # repository describes rather than one with a demonstration
            # organisation already in it. Written aside and moved, so an
            # interrupted dump cannot be restored on the next run.
            docker exec -e PGPASSWORD=postgres clove-erp-pg \
              pg_dump --format=custom --username=postgres --dbname="$PGDATABASE" \
              > "$dump.new"

            # And the roles, which pg_dump structurally cannot carry: they
            # belong to the cluster, not the database. The migrations create
            # their own — clove_enquiry among them — so a restore into a fresh
            # container met grants naming a role nothing had created:
            #
            #   pg_restore: error: could not execute query:
            #   ERROR:  role "clove_enquiry" does not exist
            #
            # which is what sent the first three warm runs back to a full
            # replay. --no-role-passwords so nothing resembling a credential
            # is written into a cache.
            docker exec -e PGPASSWORD=postgres clove-erp-pg \
              pg_dumpall --roles-only --no-role-passwords --username=postgres \
              > "$roles.new"

            role_shape > "$roles_expected.new"

            mv "$dump.new" "$dump"
            mv "$roles.new" "$roles"
            mv "$roles_expected.new" "$roles_expected"
            echo "built from the migrations, and cached for the next run"
          }

          # A cache that will not restore is a cache that is ignored. Anything
          # other than a clean restore drops the database and replays: the one
          # outcome that must not exist is a green build on a schema nobody can
          # account for.
          # An empty database for the dump to land in, and empty in the sense
          # pg_restore means.
          #
          # Two things were wrong with creating it the obvious way. "Bootstrap
          # the host" runs two steps earlier and the dump carries everything it
          # created, so restoring over it meets objects that already exist —
          # and under --exit-on-error that is an abort, not a warning. And a
          # database created the default way is copied from template1, which in
          # this image is not bare; template0 is what pg_restore documents and
          # the only starting point whose contents are known.
          #
          # WITH (FORCE) because one background connection is enough to refuse
          # a drop, and a refused drop here is silent: this step runs without
          # set -e, so the failure would carry on into a restore over a
          # populated database and look like a bad cache.
          fresh_database() {
            psql -v ON_ERROR_STOP=1 -d postgres \
              -c 'drop database if exists clove_erp with (force)' \
              -c 'create database clove_erp template template0'
          }

          # Three attributes pg_dumpall names that this cluster cannot set.
          #
          # It writes, for every role:
          #
          #   ALTER ROLE clove_enquiry WITH NOSUPERUSER NOINHERIT ... NOBYPASSRLS;
          #
          # and PostgreSQL requires a superuser to name SUPERUSER, REPLICATION
          # or BYPASSRLS at all — even to say NO, even when nothing changes.
          # This cluster's postgres has CREATEROLE and BYPASSRLS and not
          # SUPERUSER, deliberately, because the hosted one does not either. So
          # the whole ALTER was refused, the role kept CREATE ROLE's defaults,
          # and clove_enquiry came back INHERIT when the migration made it
          # NOINHERIT. erp_test.assert_ingress_suite is what noticed.
          #
          # Dropping those three tokens leaves an ALTER this cluster can run.
          # It changes no outcome for any role built here: NOSUPERUSER,
          # NOREPLICATION and NOBYPASSRLS are what CREATE ROLE gives anyway.
          # A role that genuinely needed one of them would come back wrong —
          # which is why what lands is compared below rather than assumed.
          settable() {
            sed -E '/^ALTER ROLE /s/ (NO)?(SUPERUSER|REPLICATION|BYPASSRLS)\b//g' "$roles"
          }

          if [[ -s "$dump" && -s "$roles" && -s "$roles_expected" ]]; then
            restore_log="$RUNNER_TEMP/pg_restore.log"

            # The roles first, without ON_ERROR_STOP: most of what pg_dumpall
            # writes is already in this image and "role already exists" is the
            # correct answer for those. Tolerating that is only safe because
            # the shape comparison below is what actually decides — the first
            # version of this said pg_restore would decide, and pg_restore
            # only ever checks that a role exists.
            if fresh_database > "$restore_log" 2>&1 &&
               settable | psql -d postgres >> "$restore_log" 2>&1 &&
               docker exec -i -e PGPASSWORD=postgres clove-erp-pg \
                 pg_restore --exit-on-error --username=postgres --dbname="$PGDATABASE" \
                 >> "$restore_log" 2>&1 < "$dump"; then

              if role_shape | diff -u "$roles_expected" - >> "$restore_log" 2>&1; then
                echo "restored the schema these migrations built earlier"
                exit 0
              fi
              echo "::warning::the restored cluster's roles are not the ones these migrations build"
            fi

            echo "::warning::the cached schema did not restore; building from the migrations instead"
            echo "── why the restore failed ──"
            head -40 "$restore_log"

            fresh_database
            $PSQL -f supabase/ci/00_host_bootstrap.sql
          fi

          replay

          # Said twice, deliberately.
          #
          # A replay writes something like a million characters of migration
          # NOTICEs, and the log this build can retrieve afterwards is the tail
          # of that — so a diagnosis printed before the replay is a diagnosis
          # nobody can read. The first warm run failed here and the reason was
          # already off the end of the log by the time anyone looked. It is
          # repeated after the noise so it survives.
          if [[ -s "${restore_log:-}" ]]; then
            echo "── the restore that failed, before this replay ──"
            head -40 "$restore_log"
          fi

      - name: Seed a demonstration organisation for the build to reconcile
        # Every suite cleans up after itself, so at the end of the build the
        # database holds no organisation at all — and a reconciliation over
        # nothing is a green light with nothing behind it. This seeds one the
        # way the product does, through erp.ensure_demo_configuration() and
        # erp.seed_demo_history(), so the whole-database step below has a
        # ledger, a stock ledger, a subledger and a genealogy to disagree with.
        run: $PSQL -f supabase/ci/seed_demo.sql

      - name: Every check in the catalogue
        # No list. erp.ci_check_catalogue() reads pg_proc and returns every
        # erp.assert_* and erp_test.assert_* the build can call, in order:
        # structural assertions, adversarial suites, the one procedure, and
        # erp.assert_whole_database_reconciles() last — stock, subledger,
        # inventory, genealogy and manifest for every organisation, every
        # posting rule in force, every bound entity. The runner hands the
        # names it ran back to erp.assert_ci_ran(), which refuses if the
        # catalogue holds one it did not run.
        #
        # This replaces two hand-typed lists that between them left twelve
        # assertions unrun, including all four reconciliations. A check that
        # exists and is not run is a check that is not there.
        run: supabase/ci/run_checks.sh

      - name: A check that is not run fails the build
        # The negative proof, in a transaction that is rolled back: create an
        # assertion, hand the runner's list back without it, and the build
        # must refuse. If this step ever passes without refusing, the guard
        # above is decoration.
        run: |
          set -euo pipefail
          $PSQL <<'SQL'
          begin;
          create function erp.assert_zz_unrun() returns text language sql as $f$ select 'never run' $f$;
          do $$
          declare v_names text[];
          begin
            select array_agg(qualified_name) into v_names
              from erp.ci_check_catalogue() where qualified_name <> 'erp.assert_zz_unrun';
            perform erp.assert_ci_ran(v_names);
            raise exception 'CLOVEERP_CI_UNGUARDED: a check that was not run passed the build';
          exception when others then
            if sqlerrm not like 'CLOVEERP_CHECK_NOT_RUN:%' or sqlerrm not like '%erp.assert_zz_unrun%' then
              raise;
            end if;
            raise notice 'refused as it should: %', left(sqlerrm, 80);
          end $$;
          rollback;
          SQL

      - name: A queue drains in anger
        # Every suite above proves a command can be claimed and settled and an
        # email queued; none proves anything received either. This starts a
        # receiver, queues one command and one email against the demonstration
        # organisation, runs the worker for one pass, and reads back that the
        # command succeeded with one POST carrying its idempotency key, the
        # email is sent with the provider's id, and the pass is recorded. The
        # first run of it found three defects no suite could see: the worker
        # refused to start against jobs with SQL handlers, read a connection
        # key the adapter forbids, and the email queue could not be queued.
        run: |
          set -euo pipefail
          npm install -g bun
          (cd worker && bun install --frozen-lockfile)
          supabase/ci/drain_rehearsal.sh

      - name: Recovery is rehearsed
        # The drain above proves the happy path. This proves three failures:
        # a worker killed before its request left (reclaimed to the queue with
        # a backoff, delivered once), a counterpart that stops answering after
        # the request left (the command becomes ambiguous, its ordering key
        # stays blocked, a person reconciles it through the door with
        # evidence, the successor is then delivered), and a counterpart that
        # answers 503 once (backoff, delivered on the next pass). Nothing is
        # sent twice under one key. D19, checked by the log.
        run: supabase/ci/recovery_rehearsal.sh

      - name: An incident is communicated
        # Specification v1.6 §16.5. An operator declares an incident with
        # components and names the organisation it reached; the platform sweep
        # delivers the declaration and the five-field update to that
        # organisation (in-app and email, the body as posted) and publishes
        # both to a status page through the gateway; the worker carries them
        # to the stub; an update falls due and the timer prompts the named
        # person; a provider's feed goes dark and the job-driven handler
        # declares the incident below the platform, then resolves it on
        # recovery; the review is assembled, the incident resolved, and the
        # organisation's history still shows it. D35 and D36, by the log.
        run: supabase/ci/incident_rehearsal.sh

      - name: Every door has a home
        # The application calls the database by bare string, and nothing
        # compared those strings with the schema: the generated types file is
        # imported by nothing the app uses, and six invalidation keys named
        # doors that do not exist. This extracts every erp_* literal from src
        # and hands the list to erp.assert_app_doors_exist() — and then to
        # erp.assert_doors_have_a_home(), which refuses a door that no screen
        # names and no row in erp_meta.api_only_door accounts for.
        run: supabase/ci/app_doors.sh

      - name: Every permission code the screens name exists
        # The other bare string the application calls the database with. The
        # gate is hasPermission(session, "module.action"), and a code the
        # catalogue does not hold is in no session's list — so the control is
        # refused for everybody, in silence, with no error and no refusal to
        # notice. The approve and reject buttons on /governance asked for
        # administration.approve, which the catalogue has never had, and were
        # disabled for every role including the owner.
        #
        # No permission suite can see that: one that asserts a role cannot
        # press the button agrees with a screen nobody can press it on. This
        # extracts every permission code from src and hands the list to
        # erp.assert_app_permissions_exist(), which refuses one that is not in
        # erp_ref.permission.
        run: supabase/ci/app_permissions.sh

      - name: Every screen string has a row it can be renamed by
        # The terminology layer's premise is that renaming is a glossary change
        # with no code impact. That is only true of strings erp_ref.resource
        # holds — and when this step was written, 128 of the app's 201 ui()
        # literals had no row at any locale. Two thirds of the screen chrome
        # could not be renamed by a tenant, and was invisible to
        # erp.terminology_alignment_report(), which reads that table and
        # therefore showed zero drift over strings it could not see.
        #
        # A migration seeds what exists on the day it is written. Only this
        # notices the two hundred and second.
        run: supabase/ci/screen_strings.sh

      - name: The documents quote the database
        # README.md, docs/ARCHITECTURE.md and the Word document carry figures
        # — migrations, doors, tables, suites, the Part 5 totals — inside
        # markers that docs/build_counts.sh reads back from the built database.
        # A number nothing checks is a number that drifts: the architecture
        # document said "49 migrations" against 259 on disk for a week. The
        # Word document is rebuilt from the same figures and compared
        # paragraph by paragraph with the one committed.
        run: |
          docs/build_counts.sh --check
          pip install --quiet python-docx
          python3 docs/what_has_been_built/build.py --check

      - name: The generators are idempotent
        # Row security, append-only guards, attribution, audit coverage and
        # execute grants are all GENERATED from the registers, and every migration ends by
        # running them again. If a second run produced a different schema, then
        # what a table's protection is would depend on how many migrations had
        # happened to run since it was created.
        #
        # This re-runs the generators, not the migrations: the migrations use
        # bare CREATE TABLE and are not designed to be applied twice.
        run: |
          set -euo pipefail
          shape() {
            $PSQL -tAc "select (select count(*) from pg_policy)
                            || '/' || (select count(*) from pg_trigger where not tgisinternal)
                            || '/' || (select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                                        where n.nspname in ('erp','erp_ref','erp_meta','erp_ai','erp_test','erp_ingress')
                                          and has_function_privilege('authenticated', p.oid, 'execute'))"
          }
          before=$(shape)
          $PSQL -q >/dev/null <<'SQL'
          set client_min_messages = warning;
          select erp.apply_row_security();
          select erp.apply_append_only_guards();
          select erp.apply_attribution_triggers();
          select erp.apply_audit_coverage();
          select erp.apply_execute_grants();
          SQL
          after=$(shape)
          echo "policies/triggers/grants before: $before   after: $after"
          test "$before" = "$after"

  # ---------------------------------------------------------------------------
  # The part of the product that is not SQL
  #
  # Everything above builds the schema. Nothing built the two TypeScript
  # entrypoints that talk to it, and it showed: the Edge Function did not
  # compile at all. Its shared core used extensionless relative imports, which
  # Deno refuses, so module resolution failed at the first hop past index.ts —
  # twenty errors from a `deno check`, on a file whose header documents a deploy
  # command. Nothing here ran it, nothing deployed it, and the branching
  # integration skipped it because it was not declared in config.toml. The only
  # notice anyone got was a warning on a passing check.
  #
  # A separate job because "the schema is fine, the worker does not compile"
  # should be two answers rather than one. It no longer needs no database: the
  # smoke suite at the end starts a Supabase stack of its own, because the one
  # thing a browser can prove and an assertion cannot is that the application
  # renders, and the application cannot render a session the database has not
  # resolved.
  # ---------------------------------------------------------------------------
  typescript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Deno and Bun
        # Deno from npm rather than a marketplace action: it is one line, it
        # pins nothing this repository does not already trust, and it is the
        # same route used to verify the fix locally.
        run: |
          set -euo pipefail
          npm install -g deno@2
          npm install -g bun
          deno --version
          bun --version

      - name: The dispatch worker typechecks
        # It is imported by the Edge Function below, so a break here breaks
        # both. Cheap, and previously unbuilt by anything.
        run: |
          set -euo pipefail
          cd worker
          bun install --frozen-lockfile
          bun run typecheck

      - name: The application typechecks, lints and builds
        # This job covered the worker and the Edge Function and left the
        # 2,600-line application shell to nobody, under the strictest tsconfig
        # in the repository — exactOptionalPropertyTypes, noUncheckedIndexedAccess,
        # noPropertyAccessFromIndexSignature, all enforced by no one. A broken
        # route or a type error in the auth gate shipped green.
        #
        # `bun test src` is one file today. It earns its place: writing it found
        # two real bugs in the money conversion within a minute, one of which
        # would have written a price of nothing into the ledger.
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run test
          bun run build

      - name: The build it produced can reach a project
        # This job builds with no VITE_* set, which is exactly the state the
        # published application shipped in for a day: green here, and a first
        # screen telling the visitor to set two environment variables. A build
        # is only a build if the thing it produces can talk to something, so
        # the artefact is read rather than trusted.
        run: |
          set -euo pipefail
          ref="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' src/lib/erp.ts | head -n 1 | sed -E 's#https://([a-z0-9]+)\..*#\1#')"
          test -n "$ref" || { echo "src/lib/erp.ts names no Supabase project"; exit 1; }
          if grep -rql "$ref" .output/public/assets; then
            echo "the built bundle names project $ref"
          else
            echo "the built bundle names no Supabase project: it would render 'Not connected to a project'"
            exit 1
          fi

      - name: The Edge Functions build
        # deno check resolves the whole import graph and typechecks it, which
        # is what the Edge Runtime will do to it. This is the check that was
        # missing: it fails on exactly the defect that shipped.
        #
        # Every function under supabase/functions, not a named one. The list
        # was a single path when there was a single function, and the next one
        # added would have been unbuilt by exactly the step written to stop
        # that — which is the same "the register only knows what it was seeded
        # with" fault the schema side keeps finding.
        run: |
          set -euo pipefail
          deno check --import-map supabase/functions/import_map.json \
            supabase/functions/*/index.ts

      # -----------------------------------------------------------------------
      # The application, in a browser, against a real stack
      #
      # Six tests, and deliberately not a role matrix. Permissions are proved
      # by erp_test.assert_grant_suite and its neighbours, against the database
      # that does the refusing; a browser repeating that would be slower,
      # flakier and still not the enforcement. What only a browser sees is
      # whether the bundle evaluates, whether the auth boundary renders the
      # right one of its four states, and whether a module page draws.
      #
      # Against a stack this job starts, not against live. The application
      # inlines the live project as its fallback (src/lib/erp.ts, on purpose,
      # so that every build starts connected), which means one unset variable
      # is the difference between a smoke test and signing into production.
      # playwright.config.ts refuses to run without an explicit target and
      # refuses the live ref by name; this is the belt to that pair of braces.
      #
      # NOT ON PULL REQUESTS, and that is a cost decision rather than a
      # confidence one. `supabase start` replays every migration in
      # supabase/migrations against a real Supabase host, and on the day this
      # was written that step alone ran past twenty minutes — on top of a build
      # already near twenty. Three pull request pushes in twenty minutes put
      # three of those in flight at once and took the repository's Actions
      # budget to its ceiling, at which point GitHub refuses to start any job
      # at all: the schema build, the deploy, everything. A check that stops
      # the whole build from running is worse than a check that runs later.
      #
      # So it runs on push to main — the branch that deploys, where it is worth
      # twenty minutes — and on demand. A pull request keeps the fast
      # typescript job it had. Everything above still runs on every pull
      # request: typecheck, lint, unit tests, build, the bundle's project, and
      # the Edge Functions.
      # -----------------------------------------------------------------------
      - uses: supabase/setup-cli@v1
        if: github.event_name != 'pull_request'
        with:
          version: 2.116.0

      - name: Start a Supabase stack and give it two accounts
        if: github.event_name != 'pull_request'
        # `supabase start` applies every migration in supabase/migrations to a
        # real Supabase host — GoTrue, PostgREST and Postgres, not the bare
        # cluster the schema job builds. That difference is the point: the
        # application reaches the database through PostgREST under a JWT
        # GoTrue issued, and neither of those exists in a bare cluster.
        #
        # No service exclusions. Naming them would shave a minute off the boot
        # and costs a broken step the first time the CLI renames one.
        #
        # The two accounts are created here rather than by a test, because
        # creating a user needs the service-role key and no browser should be
        # handed it. Two, not one: the gate's no-tenant state and its ready
        # state cannot both be true of one principal, and ordering the tests so
        # that one becomes the other is a dependency a parallel run may break.
        run: |
          set -euo pipefail
          supabase start
          # Into the runner's temp rather than the checkout: it carries the
          # stack's service-role key, and the working tree is not the place.
          supabase status -o env > "$RUNNER_TEMP/stack.env"
          set -a; . "$RUNNER_TEMP/stack.env"; set +a
          test -n "${API_URL:-}" || { echo "the stack reported no API URL"; exit 1; }
          test -n "${ANON_KEY:-}" || { echo "the stack reported no publishable key"; exit 1; }
          test -n "${SERVICE_ROLE_KEY:-}" || { echo "the stack reported no service-role key"; exit 1; }
          {
            echo "E2E_API_URL=$API_URL"
            echo "E2E_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

          create() {
            code=$(curl -sS -o /tmp/user.json -w '%{http_code}' -X POST "$API_URL/auth/v1/admin/users" \
              -H "apikey: $SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$1\",\"password\":\"$2\",\"email_confirm\":true}")
            # 422 is "already registered", which a re-run on a warm stack hits
            # and which is not a failure. Anything else is.
            case "$code" in
              200|201|422) echo "$1: $code" ;;
              *) echo "creating $1 failed with $code"; cat /tmp/user.json; exit 1 ;;
            esac
          }
          create "e2e-no-tenant@clove.invalid" "e2e-no-tenant-password-1"
          create "e2e-demo@clove.invalid" "e2e-demo-password-1"

      - name: The application boots, signs in and draws a module page
        if: github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ env.E2E_API_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_ANON_KEY }}
        run: |
          set -euo pipefail
          bunx playwright install --with-deps chromium
          bunx playwright test --project=integration

      - name: What the browser saw when it failed
        # A failed browser test with no trace is a re-run request. The trace is
        # only written on a retry, so this uploads whatever exists and does not
        # fail the job for finding nothing.
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Both directions of a release
  #
  # The schema and the application are deployed separately: the schema by
  # deploy.yml on merge, the application by a publish somebody does by hand.
  # So for a while after either, the other is behind — and a rollback of the
  # application is a publish of the previous build against the current schema.
  # This job builds the schema as main has it and as this pull request leaves
  # it, extracts every door name from the application on each side, and says
  # what each combination would do:
  #
  #   main's application against this PR's schema — a door main still calls
  #   that this PR removes breaks the running app the moment the schema
  #   deploys, and breaks a rollback for good. That fails the build.
  #   this PR's application against main's schema — the doors this PR adds
  #   are reported, so whoever publishes knows the schema must deploy first.
  #
  # Pull requests only: on main there is no other side to compare with.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Every screen, in a browser, with no stack behind it
  #
  # Its own job rather than a step inside `typescript`, because that job
  # finishes in about a minute and this one takes nine. Bolted on, it would put
  # nine minutes on the critical path of every pull request; beside it, the
  # wait is whatever the slowest job already was.
  #
  # This one DOES run on pull requests, and that is the difference between it
  # and the six-test suite above. That one starts a Supabase stack, which
  # replays every migration and took the Actions budget to its ceiling — the
  # note above it explains why it waits for main. This one starts nothing. The
  # application's own two HTTP paths, /auth/v1 and /rest/v1/rpc, are answered
  # from inside the page, so there is no Docker, no database and no sign-in,
  # and the cost is a browser and a dev server.
  #
  # What it proves is the half no schema assertion can reach: that all
  # fifty-two routes render, that the gate shows the right one of its four
  # states, and that nothing throws. It does not prove the database returns
  # these shapes — erp.assert_* and the erp_test suites do that, against the
  # database that answers.
  browser:
    runs-on: ubuntu-latest
    # Longer than the suite needs and far shorter than the six-hour default: a
    # hung dev server should fail, not idle.
    timeout-minutes: 30

    env:
      # Set, and deliberately not live. src/lib/erp.ts inlines the live project
      # as its fallback so that every build starts connected, which makes one
      # unset variable the difference between a mocked suite and a browser
      # pointed at production. playwright.config.ts refuses an unset target and
      # refuses the live ref by name; this names a host that does not exist,
      # and every request to it is answered inside the page regardless.
      VITE_SUPABASE_URL: https://e2e.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: e2e-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        run: |
          set -euo pipefail
          npm install -g bun
          bun --version

      - name: Install the application and a browser
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Every route renders, and the desk behaves
        run: |
          set -euo pipefail
          bunx playwright test --project=ui

      - name: What the browser saw when it failed
        # The trace is written on a retry, which CI is configured for, so a
        # failure here arrives with the run attached rather than as a request
        # to reproduce it.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Does this pull request touch anything the schema comparison could see?
  #
  # Twenty seconds, to decide whether to spend thirty minutes.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      schema: ${{ steps.decide.outputs.schema }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        # Anything unexpected answers yes. A check skipped when it should have
        # run is a hole in the build; a check run when it need not have is a
        # bill, and the bill is the cheaper mistake.
        run: |
          set -uo pipefail
          say() { echo "schema=$1" >> "$GITHUB_OUTPUT"; echo "schema=$1"; exit 0; }

          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD) || say true
          changed=$(git diff --name-only "$base" HEAD) || say true
          [[ -n "$changed" ]] || say true

          if grep -qE '^supabase/' <<< "$changed"; then say true; fi
          say false

  compat:
    needs: changes
    # Only when this pull request changes something under supabase/.
    #
    # The job builds the schema twice — the merge base and this head — and
    # fails when main's application calls a door this pull request removes.
    # Both the doors it adds and the doors it removes come from the migrations,
    # so a pull request that changes no migration has an empty set of each, and
    # the comparison can only conclude that nothing was removed. Thirty minutes
    # to prove A equals A.
    #
    # supabase/ rather than supabase/migrations/, because the two builds each
    # use their own side's supabase/ci/00_host_bootstrap.sql and a change there
    # could in principle move a door too.
    if: github.event_name == 'pull_request' && needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PSQL: psql -v ON_ERROR_STOP=1 --quiet --no-psqlrc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          docker run -d --name clove-erp-compat \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            supabase/postgres:17.6.1.167
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "PostgreSQL did not become ready within 60s" >&2; exit 1

      - name: The other side of the release
        # The merge base with the target branch: what main's schema and
        # application look like without this pull request.
        run: |
          set -euo pipefail
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "base=$base" >> "$GITHUB_ENV"
          git worktree add "$RUNNER_TEMP/base" "$base"
          echo "comparing against $base"

      - name: Build both schemas
        run: |
          set -euo pipefail
          build() {
            local db="$1" root="$2"
            psql -v ON_ERROR_STOP=1 -d postgres -c "create database $db"
            $PSQL -d "$db" -f "$root/supabase/ci/00_host_bootstrap.sql"
            for f in "$root"/supabase/migrations/*.sql; do
              $PSQL -d "$db" --single-transaction -f "$f" >/dev/null
            done
          }
          build clove_head "$GITHUB_WORKSPACE"
          build clove_base "$RUNNER_TEMP/base"

      - name: What each side names, and what each side has
        run: |
          set -euo pipefail
          doors() { psql -v ON_ERROR_STOP=1 -d "$1" -tAc "select door from erp.door_manifest()" 2>/dev/null \
                    || psql -v ON_ERROR_STOP=1 -d "$1" -tAc "select proname from pg_proc where pronamespace = 'public'::regnamespace and proname like 'erp\_%' order by 1"; }
          names() { grep -rhoE '"erp_[a-z0-9_]+"' "$1" --include='*.ts' --include='*.tsx' \
                      --exclude='*.test.ts' --exclude='*.test.tsx' --exclude-dir=integrations | tr -d '"' | sort -u; }
          doors clove_head | sort -u > doors_head.txt
          doors clove_base | sort -u > doors_base.txt
          names "$GITHUB_WORKSPACE/src" > names_head.txt
          names "$RUNNER_TEMP/base/src" > names_base.txt

          removed=$(comm -23 doors_base.txt doors_head.txt)
          added=$(comm -13 doors_base.txt doors_head.txt)
          breaks_rollback=$(comm -12 names_base.txt <(echo "$removed"))
          needs_schema_first=$(comm -12 names_head.txt <(echo "$added"))

          {
            echo "## Release compatibility"
            echo "- schema on main: $(wc -l < doors_base.txt) doors; on this PR: $(wc -l < doors_head.txt)"
            echo "- doors this PR adds: $(echo "$added" | grep -c . || true)"
            echo "- doors this PR removes: $(echo "$removed" | grep -c . || true)"
            if [[ -n "$needs_schema_first" ]]; then
              echo "- **the application on this PR needs doors main's schema lacks — deploy the schema before publishing the app:**"
              echo "$needs_schema_first" | sed 's/^/  - /'
            else
              echo "- the application on this PR calls nothing main's schema lacks"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$breaks_rollback" ]]; then
            echo "::error::the application on main calls door(s) this pull request removes; the running app breaks when the schema deploys, and a rollback of the app would call a door that no longer exists. Keep the door as a shim for one release, or say so in the pull request:"
            echo "$breaks_rollback"
            exit 1
          fi
          echo "main's application keeps every door it calls"

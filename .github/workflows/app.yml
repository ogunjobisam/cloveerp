name: app

# The application to Cloudflare, after main has proved it.
#
# Until 8 October the application reached a browser only through Lovable's
# publish: whatever was in the editor, whether or not the schema build had
# passed on it, and with a custom domain added by hand for every client's
# subdomain. This deploys the same build (nitro's cloudflare-module output,
# .output/) as the Worker wrangler.jsonc describes, once two things are true of
# a commit on main:
#
#   - the schema build passed on it, and
#   - every database the application talks to carries it: the demonstration,
#     the control plane, and every built client. The application a merge
#     ships may call a door the same merge adds, so it goes out after the
#     migrations, never before them.
#
# Since 8 October a merge releases the demonstration at once but the control
# plane and the clients only on a release train (deploy.yml: once a client is
# built, a push releases the demonstration alone). An application shipped on
# the schema build alone would then serve cloveerp.com and every client's
# subdomain an application calling doors their databases do not have yet.
#
# So a run does not ask whether the commit that woke it is ready. It works out
# what to ship from the databases themselves, every time:
#
#   1. each database's newest proved release: the demonstration's and the
#      control plane's from their release records, and every client the
#      directory serves (built, live, suspended, retiring) from the register,
#      whose last release must have succeeded;
#   2. the newest commit all of them carry, which is the oldest of those;
#   3. walking back along main from there, the first commit the schema build
#      passed on (a run cancelled while pending leaves a commit without one);
#   4. never backwards: the commit the Worker last ran (recorded as a GitHub
#      deployment) must be older, or the run ships nothing.
#
# It waits, green with a notice, while any deployment is being built from
# empty: that build took its commit when it started and comes up behind
# anything shipped meanwhile. Every state the databases can be in is read
# afresh, so a late, repeated or out-of-order trigger ships the same thing
# a timely one would, and a partial train ships whatever every database has.
#
# It is woken by every completed schema, deploy or build-from-empty run on
# main, and asked again explicitly at the end of each train and each build:
# a run started with GITHUB_TOKEN (the Fleet view's buttons, through the
# sweep) is not promised a workflow_run event when it completes.
#
# Where it goes is the repository variable CLOVEERP_APP_ROUTES:
#
#   unset   wrangler.jsonc: clove-erp-staging, on workers.dev only. No
#           traffic moves. This is the state to check the Worker in.
#   on      wrangler.production.jsonc: clove-erp, on cloveerp.com, www and
#           *.cloveerp.com. The cutover. Only once cloveerp.com's DNS is on
#           Cloudflare.
#
# The choice is made before the build, not at deploy: nitro reads wrangler.jsonc
# while building and writes the config wrangler deploys from
# (.output/server/wrangler.json), and wrangler refuses one that carries
# environments. That was the first run's failure, 8 October.
#
# A dispatch runs the same check. With redeploy it deploys the commit that
# would ship even when the Worker already runs it: after a variable or a
# secret changes, the cutover included.

on:
  workflow_run:
    workflows: [schema, deploy, deployment from empty]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      redeploy:
        description: Deploy again even if the Worker already runs the commit that would ship (after a variable or secret changes)
        type: boolean
        default: false
      after_run:
        description: The build-from-empty run asking, which is finishing and so is not still being built (filled in by that workflow)
        type: string
        default: ''

# One at a time, and none cancelled: every run reads the databases afresh, so
# a run that waited is as good as the one it waited behind, and a run that
# finds nothing to ship must never stop one that is shipping.
concurrency:
  group: app-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  deploy:
    # Every completed run on main can change what every database carries,
    # the red ones included (a build that stopped is no longer being built).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: ${{ vars.CLOVEERP_APP_ROUTES == 'on' && 'production' || 'staging' }}
      ENVIRONMENT: ${{ vars.CLOVEERP_APP_ROUTES == 'on' && 'application-production' || 'application-staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The whole of main's history, so the readiness step can tell which
          # of two releases is the later one.
          fetch-depth: 0

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: The newest commit every database carries
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
          DEMO_URL: ${{ secrets.CLOVEERP_DEMO_DATABASE_URL }}
          REDEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.redeploy == true }}
          AFTER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.after_run || '' }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          R="repos/${GITHUB_REPOSITORY}"
          wait_for() {
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nothing shipped: $1"
            echo "Nothing shipped: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          main=$(git rev-parse HEAD)
          on_main() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] || return 1
            git cat-file -e "${1}^{commit}" 2>/dev/null || return 1
            git merge-base --is-ancestor "$1" "$main"
          }
          # The latest of some commits (one a line): the one the others lead to.
          newest_of() {
            local best="" c
            while IFS= read -r c; do
              on_main "$c" || continue
              if [[ -z "$best" ]] || git merge-base --is-ancestor "$best" "$c"; then best="$c"; fi
            done
            printf '%s' "$best"
          }
          [[ "$AFTER_RUN" =~ ^[0-9]*$ ]] || { echo "::error::after_run must be a run id"; exit 1; }
          [[ -n "${LIVE_URL}" && -n "${DEMO_URL}" ]] || {
            echo "::error::CLOVEERP_LIVE_DATABASE_URL and CLOVEERP_DEMO_DATABASE_URL are needed to see what the databases carry. Not deploying."
            exit 1
          }

          # A build from empty took its commit when it started.
          building=$(gh api "${R}/actions/workflows/deployment_from_empty.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.status != \"completed\" and (.id | tostring) != \"${AFTER_RUN}\")] | length")
          [[ "$building" == 0 ]] || wait_for "a deployment is being built from empty; the build asks again when it ends"

          # Each database's newest proved release. A release record is never
          # undone, so the latest of the recent ones is what it carries, even
          # when an older commit was released again after it.
          proved="select r.git_sha from erp_meta.release r where r.proved_at is not null and r.git_sha is not null order by r.recorded_at desc limit 30"
          demo=$(psql "$DEMO_URL" -v ON_ERROR_STOP=1 -X -q -tAc "$proved" | newest_of)
          [[ -n "$demo" ]] || wait_for "the demonstration has no proved release of a commit on main"
          control=$(psql "$LIVE_URL" -v ON_ERROR_STOP=1 -X -q -tAc "$proved" | newest_of)
          [[ -n "$control" ]] || wait_for "the control plane has no proved release of a commit on main"
          carried=("$demo" "$control")
          described="the demonstration ${demo:0:12}, the control plane ${control:0:12}"

          # Every client the directory serves, and every one being made. Read
          # as an assignment so a failed connection fails the run rather than
          # passing as a register with nobody in it.
          clients=$(psql "$LIVE_URL" -v ON_ERROR_STOP=1 -X -q -tA -F '|' -c "
            select d.code, d.status, coalesce(d.last_release_sha, ''), coalesce(d.last_release_outcome, '')
              from erp_meta.deployment d
             where d.status in ('creating', 'building', 'built', 'live', 'suspended', 'retiring')
             order by d.code")
          while IFS='|' read -r code status sha outcome; do
            [[ -n "$code" ]] || continue
            case "$status" in
              creating|building) wait_for "client ${code} is being built from empty; its first release decides what it carries" ;;
            esac
            [[ "$outcome" == success ]] || wait_for "client ${code}'s last release (${sha:0:12}) ended ${outcome:-without an outcome}; release it again and this follows"
            on_main "$sha" || wait_for "client ${code}'s last release ${sha:-(none)} is not a commit on main"
            carried+=("$sha")
            described="${described}, ${code} ${sha:0:12}"
          done <<< "$clients"

          # The newest commit all of them carry: their common ancestor.
          floor=$(git merge-base --octopus "${carried[@]}")
          on_main "$floor" || wait_for "the releases (${described}) have no common commit on main"

          # The schema build must have passed on what ships. A run cancelled
          # while pending leaves a commit with none, so walk back to one that has.
          ship=""
          for c in $(git rev-list --first-parent --max-count=50 "$floor"); do
            passed=$(gh api "${R}/actions/workflows/schema.yml/runs?head_sha=${c}&branch=main&status=success&per_page=1" --jq '.total_count')
            if [[ "${passed:-0}" -gt 0 ]]; then ship="$c"; break; fi
          done
          [[ -n "$ship" ]] || wait_for "the schema build passed on none of the fifty commits up to ${floor:0:12}"
          git cat-file -e "${ship}:wrangler.production.jsonc" 2>/dev/null \
            || wait_for "${ship:0:12} predates the application on Cloudflare"

          # Never backwards. What the Worker runs is the newest application
          # deployment recorded with a success; before the first one was
          # recorded, the newest app run whose Deploy step passed ran on a
          # commit at or after the one it shipped.
          shipped=""
          for id in $(gh api "${R}/deployments?environment=${ENVIRONMENT}&per_page=50" --jq 'sort_by(.created_at) | reverse | .[].id'); do
            state=$(gh api "${R}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // ""')
            if [[ "$state" == success ]]; then shipped=$(gh api "${R}/deployments/${id}" --jq '.sha'); break; fi
          done
          if [[ -z "$shipped" ]]; then
            for id in $(gh api "${R}/actions/workflows/app.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].id'); do
              deployed=$(gh api "${R}/actions/runs/${id}/jobs" --jq '[.jobs[].steps[] | select(.name == "Deploy" and .conclusion == "success")] | length')
              if [[ "$deployed" -gt 0 ]]; then shipped=$(gh api "${R}/actions/runs/${id}" --jq '.head_sha'); break; fi
            done
          fi
          if [[ -n "$shipped" ]] && on_main "$shipped"; then
            if [[ "$ship" == "$shipped" && "$REDEPLOY" != true ]]; then
              wait_for "the Worker already runs ${ship:0:12}, the newest commit every database carries (${described})"
            fi
            if [[ "$ship" != "$shipped" ]] && git merge-base --is-ancestor "$ship" "$shipped"; then
              wait_for "the Worker runs ${shipped:0:12}, later than ${ship:0:12}, the newest commit every database carries (${described}); a release train brings them up"
            fi
          fi

          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "ship=${ship}" >> "$GITHUB_OUTPUT"
          echo "shipping ${ship}: every database carries it (${described}); the Worker ran ${shipped:-nothing recorded}"
          echo "Shipping ${ship:0:12}: every database carries it (${described})." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out what ships
        if: steps.ready.outputs.go == 'true'
        env:
          SHIP: ${{ steps.ready.outputs.ship }}
        run: git checkout --detach "$SHIP"

      - name: Install Bun
        if: steps.ready.outputs.go == 'true'
        run: |
          set -euo pipefail
          npm install -g bun
          bun --version

      - name: Build
        if: steps.ready.outputs.go == 'true'
        # The same build the schema job's typescript step proves. The preset is
        # named rather than left to the Lovable config's default, so a change
        # there cannot quietly make this a Node build.
        env:
          NITRO_PRESET: cloudflare-module
        run: |
          set -euo pipefail
          if [[ "$TARGET" == production ]]; then
            cp wrangler.production.jsonc wrangler.jsonc
          fi
          bun install --frozen-lockfile
          bun run build
          test -f .output/server/wrangler.json || { echo "the build made no .output/server/wrangler.json for wrangler to deploy"; exit 1; }
          echo "building for $(jq -r .name .output/server/wrangler.json)"
          test -f .output/server/index.mjs || { echo "the build made no .output/server/index.mjs"; exit 1; }
          test -d .output/public || { echo "the build made no .output/public"; exit 1; }

      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        # wrangler is fetched for this step, not added to package.json: it is
        # the deployment tool, not part of what is deployed.
        env:
          SHIP: ${{ steps.ready.outputs.ship }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::the CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::the CLOUDFLARE_ACCOUNT_ID variable is not set"; exit 1; }
          # The config nitro wrote (.wrangler/deploy/config.json points wrangler
          # at it), already for the target chosen before the build. Wrangler's
          # own error lines are repeated as annotations, so a failure reads on
          # the run's summary rather than only inside the step's log.
          log="$RUNNER_TEMP/wrangler.log"
          if ! bunx wrangler@4 deploy --message "main ${SHIP}" 2>&1 | tee "$log"; then
            sed -E 's/\x1b\[[0-9;]*m//g' "$log" | grep -A8 -E 'ERROR|Authentication|not authorized' \
              | grep -vE '^[[:space:]]*(--)?[[:space:]]*$' | head -10 \
              | while IFS= read -r line; do echo "::error title=wrangler::${line}"; done
            exit 1
          fi
          {
            echo "## Application"
            echo "Deployed ${SHIP} to **${TARGET}**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record what the Worker runs
        if: steps.ready.outputs.go == 'true'
        # The record the next run reads so that it never ships backwards: a
        # GitHub deployment of this commit to this environment, marked
        # successful. A newer one marks the older ones inactive.
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP: ${{ steps.ready.outputs.ship }}
        run: |
          set -euo pipefail
          R="repos/${GITHUB_REPOSITORY}"
          production=false
          [[ "$TARGET" == production ]] && production=true
          id=$(gh api -X POST "${R}/deployments" --jq '.id' --input - <<JSON
          {"ref": "${SHIP}", "environment": "${ENVIRONMENT}", "auto_merge": false, "required_contexts": [],
           "description": "the application, by app.yml run ${GITHUB_RUN_ID}", "production_environment": ${production}}
          JSON
          )
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::the Worker runs ${SHIP}, but recording it as a deployment failed; the next run may deploy it again"; exit 1; }
          gh api -X POST "${R}/deployments/${id}/statuses" -f state=success \
            -f "log_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
          echo "recorded ${SHIP} as deployment ${id} to ${ENVIRONMENT}"

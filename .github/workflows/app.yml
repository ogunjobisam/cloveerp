name: app

# The application to Cloudflare, after main has proved it.
#
# Until 8 October the application reached a browser only through Lovable's
# publish: whatever was in the editor, whether or not the schema build had
# passed on it, and with a custom domain added by hand for every client's
# subdomain. This deploys the same build (nitro's cloudflare-module output,
# .output/) as the Worker wrangler.jsonc describes, once two things are true of
# a commit on main:
#
#   - the schema build passed on it, and
#   - every database the application talks to carries it: the demonstration,
#     the control plane, and every built client. The application a merge
#     ships may call a door the same merge adds, so it goes out after the
#     migrations, never before them.
#
# Since 8 October a merge releases the demonstration at once but the control
# plane and the clients only on a release train (deploy.yml: once a client is
# built, a push releases the demonstration alone). An application shipped on
# the schema build alone would then serve cloveerp.com and every client's
# subdomain an application calling doors their databases do not have yet. So
# this runs when the schema build completes AND when a release completes, and
# ships a commit only once each database's newest proved release is that
# commit or a later one on main. A commit that is not yet everywhere is
# skipped with a notice, not failed: the train that carries it ends with a
# completed release, and that run ships it.
#
# Where it goes is the repository variable CLOVEERP_APP_ROUTES:
#
#   unset   wrangler.jsonc: clove-erp-staging, on workers.dev only. No
#           traffic moves. This is the state to check the Worker in.
#   on      wrangler.production.jsonc: clove-erp, on cloveerp.com, www and
#           *.cloveerp.com. The cutover. Only once cloveerp.com's DNS is on
#           Cloudflare.
#
# The choice is made before the build, not at deploy: nitro reads wrangler.jsonc
# while building and writes the config wrangler deploys from
# (.output/server/wrangler.json), and wrangler refuses one that carries
# environments. That was the first run's failure, 8 October.
#
# A dispatch deploys the head of main the same way, for the first deployment
# and for a redeploy after a variable or secret changes.

on:
  workflow_run:
    workflows: [schema, deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and the newest wins: an application deployment that
# a newer one has overtaken has nothing left to say.
concurrency:
  group: app-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    # workflow_run fires for every completed schema or deploy run on main,
    # including the scheduled schema run and the failures; only a passing push
    # or dispatch is looked at, and the readiness step decides whether it ships.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TARGET: ${{ vars.CLOVEERP_APP_ROUTES == 'on' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          # The whole of main's history, so the readiness step can tell whether
          # a database's release is this commit or a later one.
          fetch-depth: 0

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Every database carries this commit
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
          DEMO_URL: ${{ secrets.CLOVEERP_DEMO_DATABASE_URL }}
        run: |
          set -euo pipefail
          wait_for() {
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::not shipping ${SHA} yet: $1"
            echo "Not shipped: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          # Is the released commit this one, or a later one on main?
          carries() {
            local released="$1"
            [[ -n "$released" ]] || return 1
            git cat-file -e "${released}^{commit}" 2>/dev/null || return 1
            git merge-base --is-ancestor "${SHA}" "${released}"
          }

          # The schema build passed on this commit (whichever run it was).
          schema="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/schema.yml/runs?head_sha=${SHA}&branch=main&per_page=20" \
                      --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          [[ "${schema:-0}" -gt 0 ]] || wait_for "the schema build has not passed on it"

          [[ -n "${LIVE_URL}" && -n "${DEMO_URL}" ]] || {
            echo "::error::CLOVEERP_LIVE_DATABASE_URL and CLOVEERP_DEMO_DATABASE_URL are needed to see what the databases carry. Not deploying."
            exit 1
          }
          newest="select coalesce((select r.git_sha from erp_meta.release r where r.proved_at is not null order by r.recorded_at desc limit 1), '')"

          demo=$(psql "$DEMO_URL" -v ON_ERROR_STOP=1 -X -q -tAc "$newest")
          carries "$demo" || wait_for "the demonstration's newest proved release is ${demo:-none}"

          control=$(psql "$LIVE_URL" -v ON_ERROR_STOP=1 -X -q -tAc "$newest")
          carries "$control" || wait_for "the control plane's newest proved release is ${control:-none}; a release train brings it"

          if [[ "$(psql "$LIVE_URL" -v ON_ERROR_STOP=1 -X -q -tAc "select to_regclass('erp_meta.deployment') is not null")" == t ]]; then
            clients=$(psql "$LIVE_URL" -v ON_ERROR_STOP=1 -X -q -tA -F '|' -c "
              select d.code, coalesce(d.last_release_sha, ''), coalesce(d.last_release_outcome, '')
                from erp_meta.deployment d
               where d.status in ('built', 'live')
               order by d.code")
            while IFS='|' read -r code sha outcome; do
              [[ -n "$code" ]] || continue
              if [[ "$outcome" != success ]] || ! carries "$sha"; then
                wait_for "client ${code}'s last release is ${sha:-none} (${outcome:-none}); a release train brings it"
              fi
            done <<< "$clients"
          fi

          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "every database carries ${SHA}: the demonstration (${demo:0:12}), the control plane (${control:0:12}) and every built client"

      - name: Install Bun
        if: steps.ready.outputs.go == 'true'
        run: |
          set -euo pipefail
          npm install -g bun
          bun --version

      - name: Build
        if: steps.ready.outputs.go == 'true'
        # The same build the schema job's typescript step proves. The preset is
        # named rather than left to the Lovable config's default, so a change
        # there cannot quietly make this a Node build.
        env:
          NITRO_PRESET: cloudflare-module
        run: |
          set -euo pipefail
          if [[ "$TARGET" == production ]]; then
            cp wrangler.production.jsonc wrangler.jsonc
          fi
          bun install --frozen-lockfile
          bun run build
          test -f .output/server/wrangler.json || { echo "the build made no .output/server/wrangler.json for wrangler to deploy"; exit 1; }
          echo "building for $(jq -r .name .output/server/wrangler.json)"
          test -f .output/server/index.mjs || { echo "the build made no .output/server/index.mjs"; exit 1; }
          test -d .output/public || { echo "the build made no .output/public"; exit 1; }

      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        # wrangler is fetched for this step, not added to package.json: it is
        # the deployment tool, not part of what is deployed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::the CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::the CLOUDFLARE_ACCOUNT_ID variable is not set"; exit 1; }
          # The config nitro wrote (.wrangler/deploy/config.json points wrangler
          # at it), already for the target chosen before the build. Wrangler's
          # own error lines are repeated as annotations, so a failure reads on
          # the run's summary rather than only inside the step's log.
          log="$RUNNER_TEMP/wrangler.log"
          if ! bunx wrangler@4 deploy --message "main ${SHA}" 2>&1 | tee "$log"; then
            sed -E 's/\x1b\[[0-9;]*m//g' "$log" | grep -A8 -E 'ERROR|Authentication|not authorized' \
              | grep -vE '^[[:space:]]*(--)?[[:space:]]*$' | head -10 \
              | while IFS= read -r line; do echo "::error title=wrangler::${line}"; done
            exit 1
          fi
          {
            echo "## Application"
            echo "Deployed ${SHA} to **${TARGET}**."
          } >> "$GITHUB_STEP_SUMMARY"

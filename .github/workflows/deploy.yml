name: deploy

# The route to the live database that is not a person at a console.
#
# Until this workflow, every change reached production through the Supabase
# MCP connector, one statement block at a time, because the repository holds
# no database password and the environment the work is done from cannot reach
# the project host. That worked, and it produced supabase/ops/README.md: a
# 154 KB reconciliation script generated because the migrations could not be
# replayed. A drift repaired by generation is a drift that will recur.
#
# From here, main is deployed by replay. The connection string lives in one
# repository secret, CLOVEERP_LIVE_DATABASE_URL, set by the project owner and
# read by nobody else; it must be the session-pooler URL (the direct host is
# IPv6-only and a runner cannot reach it) and percent-encoded, because the CLI
# says so. The Supabase CLI records what it applies in
# supabase_migrations.schema_migrations, which is what the deployment screen
# in the platform console compares against the repository.
#
# Two jobs:
#
#   dry-run  — on every pull request: what WOULD apply, and the remote history.
#              Both jobs refuse without the secret rather than pass having
#              looked at nothing; the secret is what makes either of them real.
#   apply    — on push to main: apply, then prove the result with the same
#              checks the build runs. A deploy that applied and did not check
#              is the silent-job problem moved to production. Then it schedules
#              the dispatch function from inside the database and waits for a
#              drain pass, because a schedule nobody proved fires is the same
#              problem again, one layer out.
#
# One-off: the live project's history table holds the names the connector
# recorded, not the repository's filenames. Run this workflow by hand with
# mark_applied = true once, giving mark_applied_through — the highest version
# already on live. The stamps naming no repository file are reverted, every
# version up to that boundary is recorded as applied, and replay starts from
# the one after it.
#
# The boundary is an input rather than "everything in this checkout" because
# there is no commit that both contains this workflow and carries only the
# migrations live already has: supabase/ops/README.md records that everything
# up to 20260905040000 reached live through the connector, and this workflow
# arrived after that, in the merge of PR #60. Marking the whole checkout
# applied on main would record every later migration as applied without
# applying it — the one way to misuse this, and a silent, permanent divergence
# rather than a failed deploy. So it refuses without the boundary.
#
# --include-all, always. Without it the CLI applies only migrations newer than
# the newest applied, and this repository has already had a fix silently
# undone by a file that sorted earlier than one already applied.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mark_applied:
        description: 'One-off: reconcile the live migration history with this repository, then stop. Requires mark_applied_through.'
        type: boolean
        default: false
      mark_applied_through:
        description: 'The highest migration version already on live, e.g. 20260905040000. Everything up to it is recorded as applied; everything after it is left for replay to apply.'
        type: string
        default: ''
      repair_gateway_bodies:
        description: 'One-off: run supabase/ops/20260908_gateway_function_bodies.sh against live, re-emitting the twelve function bodies the remaining migrations patch, then stop.'
        type: boolean
        default: false

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Its own group, per branch, and not the deploy's.
    #
    # deploy-live was declared on the workflow, so both jobs were in it, and
    # GitHub keeps exactly one run queued per group: a third arrival cancels
    # the one already waiting. On the merge of #73 that is precisely what
    # happened — the push to main queued behind a running replay, a pull
    # request dry run arrived thirty-five seconds later, and the production
    # deploy of the merge was cancelled by a job that only reads. It went
    # grey, not red, and nothing on the merged pull request said the deploy
    # it caused had been thrown away.
    #
    # A read cannot be allowed to displace a write. The dry run now cancels
    # only its own earlier self on the same branch, which is what you want
    # when a pull request is pushed to twice in a minute.
    concurrency:
      group: deploy-dry-run-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: What would apply
        # A dry run that could not see live must not be green.
        #
        # This warned and exited 0, so every pull request carried a green
        # deploy check that had compared nothing with anything. The secret has
        # never been set, and the apply job below has therefore failed on
        # every merge to main since this workflow was written — four in a row,
        # each in fifteen seconds, under a green tick on the pull request that
        # caused it. The warning was the only notice, and a warning on a
        # passing check is the notice nobody reads.
        #
        # A fork's pull request gets no secrets and would fail here. That is
        # the right answer and not a hypothetical to design around: this
        # repository has had no fork pull request, and one arriving is a
        # decision to take then, in the open, rather than a hole to leave now.
        env:
          DB_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${DB_URL}" ]]; then
            echo "::error::CLOVEERP_LIVE_DATABASE_URL is not set, so this dry run compared nothing with live. Add the session-pooler connection string as a repository secret; until it is set, no merge to main can deploy."
            exit 1
          fi
          echo "## Migrations that would apply" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          supabase db push --dry-run --include-all --db-url "$DB_URL" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A replay that blocks on a lock rather than deadlocking gets no 40P01 and
    # no retry — it just waits. On the default six-hour job timeout it would
    # wait holding the deploy-live concurrency group and, worse, holding the
    # scheduler paused: every deploy behind it queued and the platform's clock
    # stopped, for six hours, with nothing red to say so. An hour is longer
    # than any replay this repository has run and short enough to notice.
    # Cancelling still runs the resume step, which is always().
    timeout-minutes: 60
    # One deploy against live at a time, and never two replays at once. A
    # newer deploy may cancel an older one still queued: --include-all means
    # the newer applies everything the older would have, so the migrations
    # are not lost with the run.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    env:
      DB_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
      # Where pg_cron posts to drain the queues: the project's own dispatch
      # function unless a repository variable says otherwise. A URL, not a
      # secret — the secret the post carries never leaves the database.
      DISPATCH_URL: ${{ vars.CLOVEERP_DISPATCH_URL || 'https://xpzffnnhnhcqyjqcueja.supabase.co/functions/v1/dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: The secret exists
        # A deploy that deployed nothing must not be green.
        run: |
          if [[ -z "${DB_URL}" ]]; then
            echo "::error::CLOVEERP_LIVE_DATABASE_URL is not set. Add the session-pooler connection string as a repository secret; nothing was applied."
            exit 1
          fi

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Re-emit the twelve gateway function bodies (one-off)
        if: github.event_name == 'workflow_dispatch' && inputs.repair_gateway_bodies
        # Seventeen of the migrations still to apply rewrite an existing
        # function by text, and refuse when the body is not the one they were
        # written against. Live's is not, because everything up to
        # 20260905040000 arrived through the connector rather than by replaying
        # the files: functionally equivalent, textually different.
        #
        # supabase/ops/20260908_gateway_function_bodies.sh does the work. It
        # runs here rather than on somebody's laptop because it needs a
        # PostgreSQL to build the reference in, and that has to be the image
        # the product is verified against — pg_jsonschema is a Rust extension
        # apt does not carry, and a reference built on a different host is not
        # the reference.
        #
        # Pinned to the same image and major version as schema.yml, for the
        # same reason: what live is compared against must be what CI builds.
        run: |
          set -euo pipefail
          docker run -d --name clove-erp-reference \
            -e POSTGRES_PASSWORD=postgres -p 5432:5432 \
            supabase/postgres:17.6.1.167
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then break; fi
            if [[ "$i" -eq 60 ]]; then
              echo "::error::the reference PostgreSQL did not become ready within 60s"
              docker logs clove-erp-reference 2>&1 | tail -40 >&2
              exit 1
            fi
            sleep 1
          done

          log="$RUNNER_TEMP/gateway.log"
          set +e
          CLOVEERP_LIVE_DATABASE_URL="$DB_URL" \
            ./supabase/ops/20260908_gateway_function_bodies.sh --apply 2>&1 \
            | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          .github/summarise.sh "$log" "## Gateway function bodies"
          exit "$status"

      - name: Record every repository migration as applied (one-off)
        if: github.event_name == 'workflow_dispatch' && inputs.mark_applied
        # Both directions, because the history table and the repository
        # disagree in both and `supabase db push` refuses on either half.
        #
        # The first version of this step marked the repository's versions
        # applied and stopped, which was half the job. The first dry run that
        # ever reached live proved it: the history table held 160 stamps the
        # connector recorded, the repository holds 278 files, and the two sets
        # do not intersect at all — not one stamp names a file, not one file is
        # recorded. Marking the 278 applied would have left the push refusing
        # on the 160, with the error the CLI actually returns:
        # "Remote migration versions not found in local migrations directory".
        #
        # Reverting a stamp deletes its row. It undoes nothing the connector
        # did — the schema those statements built is still there — it declares
        # the repository the record from here on, which is the whole point.
        env:
          THROUGH: ${{ inputs.mark_applied_through }}
        run: |
          set -euo pipefail

          # No boundary, no repair. Recording a migration as applied without
          # applying it is not recoverable by a later deploy: replay skips what
          # the history table already claims, so the change is stranded and
          # live diverges from the repository for good. A refusal here costs a
          # re-dispatch; the default it replaces costs the schema.
          if [[ -z "${THROUGH// /}" ]]; then
            echo "::error::mark_applied needs mark_applied_through: the highest migration version already on live (supabase/ops/README.md records 20260905040000 as the last the connector applied). Without it this would record every later migration as applied without applying it."
            exit 1
          fi
          if ! [[ "$THROUGH" =~ ^[0-9]+$ ]]; then
            echo "::error::mark_applied_through must be a bare version, e.g. 20260905040000; got '$THROUGH'."
            exit 1
          fi

          # Numerically, not as strings: the repository carries both 0001 and
          # 20260905040000 and a lexicographic compare across those lengths is
          # only accidentally right. Every version is well inside a double.
          all=$(ls supabase/migrations/*.sql | xargs -n1 basename | sed -E 's/^([0-9]+)_.*$/\1/' | sort -u)
          versions=$(printf '%s\n' "$all" | awk -v t="$THROUGH" '$1 + 0 <= t + 0')
          pending=$(printf '%s\n' "$all" | awk -v t="$THROUGH" '$1 + 0 > t + 0')

          n_at=$(printf '%s' "$versions" | grep -c . || true)
          n_after=$(printf '%s' "$pending" | grep -c . || true)
          if [[ "$n_at" -eq 0 ]]; then
            echo "::error::no migration in this repository is at or below $THROUGH; the boundary is wrong."
            exit 1
          fi
          echo "boundary $THROUGH: $n_at at or below it, $n_after after it left for replay to apply"

          # An absent history table is a project nothing has pushed to, which
          # is not an error: there is simply nothing stale to clear.
          if [[ "$(psql "$DB_URL" -tAc "select to_regclass('supabase_migrations.schema_migrations') is not null")" == "t" ]]; then
            remote=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc \
              "select version from supabase_migrations.schema_migrations order by version")
          else
            remote=""
          fi

          # Against the whole repository, not the bounded set: a stamp naming a
          # migration above the boundary is recorded and real, not stale.
          stale=$(comm -23 <(printf '%s\n' "$remote" | grep -v '^$' | sort -u) <(printf '%s\n' "$all") | tr '\n' ' ')
          if [[ -n "${stale// /}" ]]; then
            echo "reverting $(echo $stale | wc -w) stamp(s) naming no migration in this repository"
            # shellcheck disable=SC2086
            supabase migration repair --status reverted $stale --db-url "$DB_URL"
          else
            echo "no stale stamps: every recorded version names a migration in this repository"
          fi

          versions=$(printf '%s\n' "$versions" | tr '\n' ' ')
          echo "marking $(echo $versions | wc -w) versions applied"
          # shellcheck disable=SC2086
          supabase migration repair --status applied $versions --db-url "$DB_URL"
          supabase migration list --db-url "$DB_URL" | tail -20
          echo "Recorded. Re-run this workflow without mark_applied to deploy." >> "$GITHUB_STEP_SUMMARY"

      - name: Pause the scheduler for the length of the replay
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies)) }}
        # The retry below survives a deadlock; not having one is better.
        #
        # cron.job fires erp.run_due_jobs_all_tenants() every minute, and a
        # replay runs for tens of minutes doing DDL that takes locks across
        # hundreds of objects. On the first real deploy the two crossed and cost
        # twelve migrations of progress. A queue that waits half an hour is a
        # queue that waits; the worker picks up where it left off, and the
        # ordering gate is what keeps that safe.
        #
        # Best effort, deliberately. If the deploy's role may not write
        # cron.job, that is a warning and not a reason to refuse to deploy —
        # the retry is the guarantee, this is the optimisation.
        run: |
          set -euo pipefail
          if [[ "$(psql "$DB_URL" -tAc "select to_regclass('cron.job') is not null")" != "t" ]]; then
            echo "no cron.job on this host; nothing to pause"
            exit 0
          fi
          paused=$(psql "$DB_URL" -tAc \
            "select coalesce(string_agg(jobid::text, ','), '') from cron.job where active" || true)
          if [[ -z "$paused" ]]; then
            echo "no active scheduled job; nothing to pause"
            exit 0
          fi
          # pg_cron's own API first. On 8 September the direct UPDATE came back
          # "permission denied for table job": the deploy's role can read
          # cron.job but does not own it. cron.alter_job() checks that the role
          # owns the job rather than the catalogue, which is the grant a
          # deploying role is actually likely to have.
          if psql "$DB_URL" -v ON_ERROR_STOP=1 -qtc \
               "select cron.alter_job(jobid, active := false) from cron.job where jobid in ($paused)"; then
            echo "PAUSED_JOBS=$paused" >> "$GITHUB_ENV"
            echo "paused scheduled job(s) via cron.alter_job: $paused"
          elif psql "$DB_URL" -v ON_ERROR_STOP=1 -qc \
               "update cron.job set active = false where jobid in ($paused)"; then
            echo "PAUSED_JOBS=$paused" >> "$GITHUB_ENV"
            echo "paused scheduled job(s) by update: $paused"
          else
            echo "::warning::could not pause cron.job by either route; THE SCHEDULER IS STILL RUNNING and the replay relies on the deadlock retry. Nothing needs undoing afterwards."
          fi

      - name: Apply pending migrations by replay
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies)) }}
        # A deadlock is a coincidence, not a verdict on the deploy.
        #
        # Every migration ends by re-running the generators, and
        # erp.apply_row_security() and erp.apply_execute_grants() take heavy
        # locks across hundreds of objects. Anything else touching the database
        # at that moment can cross with them — on the first real deploy it was a
        # session running erp.apply_execute_grants() itself, twenty-eight
        # minutes and twelve migrations in:
        #
        #   ERROR: deadlock detected (SQLSTATE 40P01)
        #   Process 1095739 waits for AccessShareLock on relation 38200;
        #     blocked by process 1098150.
        #
        # PostgreSQL picks a victim and aborts it. The right answer is to go
        # again: the migrations that already applied are recorded, so a re-run
        # resumes at the one that lost rather than starting over, and the one
        # that lost rolled back whole. Twelve migrations of progress should not
        # be thrown away because a minutely job wanted the same table.
        #
        # Only on 40P01. Every other failure is this deploy's to answer for,
        # and retrying it would turn one honest error into three.
        run: |
          set -euo pipefail
          # The moment before anything changed: the point-in-time-recovery
          # target a rollback of this deploy would restore to. Recorded on the
          # release row below, and taken once rather than per attempt — a
          # retry is the same deploy, so it is the same target.
          echo "DEPLOY_STARTED_AT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc 'select now()')" >> "$GITHUB_ENV"

          attempts=3
          log="$RUNNER_TEMP/push.log"
          all="$RUNNER_TEMP/push-all.log"
          : > "$all"
          applied=false
          for attempt in $(seq 1 "$attempts"); do
            if supabase db push --include-all --db-url "$DB_URL" 2>&1 \
                 | tee "$log"; then
              cat "$log" >> "$all"
              applied=true
              break
            fi
            cat "$log" >> "$all"

            if ! grep -q '40P01' "$log"; then
              .github/summarise.sh "$all" "## Applied"
              echo "::error::the replay failed for a reason that is not a deadlock; not retrying. The migrations applied before it are recorded, so a later run resumes from there."
              exit 1
            fi

            if [[ "$attempt" -lt "$attempts" ]]; then
              # Back off enough to clear a minutely job's window.
              wait=$((attempt * 30))
              echo "::warning::deadlock (40P01) on attempt ${attempt} of ${attempts}; retrying in ${wait}s from the migration that lost."
              printf '\n-- deadlock on attempt %s; resuming --\n' "$attempt" >> "$all"
              sleep "$wait"
            fi
          done

          .github/summarise.sh "$all" "## Applied"
          if [[ "$applied" != true ]]; then
            echo "::error::deadlocked on all ${attempts} attempts. Something is contending for the same objects throughout — check cron.job and pg_stat_activity before running again."
            exit 1
          fi

      - name: Record the release
        # One row per deploy, written before the database is proved so that
        # the proof's own release clause — the ledger has moved past the last
        # recorded release — reads this deploy, not the one before it.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies)) }}
        run: |
          set -euo pipefail
          release=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select erp.record_release('${GITHUB_SHA}', '${DEPLOY_STARTED_AT}'::timestamptz, 'lovable', 'run ${GITHUB_RUN_ID}');")
          echo "RELEASE_ID=$release" >> "$GITHUB_ENV"
          echo "release $release recorded for ${GITHUB_SHA}"

      - name: Start the scheduler again
        # Before the proof, not after it.
        #
        # The first deploy whose pause actually worked failed its own proof
        # for that reason: erp.platform_assurance() raises
        # CLOVEERP_PLATFORM_NOT_SCHEDULED when the register says a job is
        # scheduled and the host's cron does not agree, and a paused scheduler
        # is exactly that disagreement. The deploy was asserting a world it
        # had itself taken apart. So the world goes back together first and
        # the proof reads the database an operator would find.
        #
        # always(), and unconditional: whatever happened above — a failed
        # replay, a cancelled run — the scheduler goes back on. A deploy that
        # leaves the platform's own clock stopped has done more damage than
        # the one it was avoiding.
        #
        # No-op when nothing was paused, so this is safe on every path that
        # never reached the pause: PAUSED_JOBS is simply unset.
        #
        # A failure here fails the job even when the deploy itself succeeded.
        # The scheduler being off is not a footnote to a green deploy.
        if: always()
        run: |
          set -uo pipefail
          if [[ -z "${PAUSED_JOBS:-}" ]]; then
            echo "nothing was paused"
            exit 0
          fi
          # Both routes, whichever paused it: a resume that fails because it
          # picked the wrong one is the failure this step exists to prevent.
          if psql "$DB_URL" -v ON_ERROR_STOP=1 -qtc \
               "select cron.alter_job(jobid, active := true) from cron.job where jobid in (${PAUSED_JOBS})" \
             || psql "$DB_URL" -v ON_ERROR_STOP=1 -qc \
               "update cron.job set active = true where jobid in (${PAUSED_JOBS})"; then
            echo "scheduled job(s) running again: ${PAUSED_JOBS}"
          else
            echo "::error::could not re-enable cron.job (${PAUSED_JOBS}). The platform scheduler is STOPPED on live: run 'update cron.job set active = true where jobid in (${PAUSED_JOBS});' by hand now."
            exit 1
          fi

      - name: Deploy the Edge Functions
        # Only when SUPABASE_ACCESS_TOKEN is set; otherwise a notice and nothing.
        #
        # On 13 September the deploy of 2b181c8 failed at its replay with
        # "duplicate key value violates unique constraint
        # pg_proc_proname_args_nsp_index": live's log shows a second client
        # applying the same migration two seconds apart. That is Supabase's
        # GitHub integration with "Deploy to production" on, which applies
        # migrations from main as well as deploying the functions declared in
        # supabase/config.toml, and it is the second route into production the
        # 8 September deploy lost to. Turning it off would also stop the
        # functions reaching live, because nothing else deployed them.
        #
        # So this deploys them from the same commit, after the database they
        # read has been replayed and before the dispatch schedule starts
        # calling them. With the token set, the integration's production
        # deploy can be switched off and this workflow is the one route again.
        # The CLI reads [functions.*] (verify_jwt, import_map) from config.toml.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies)) }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.CLOVEERP_PROJECT_REF || 'xpzffnnhnhcqyjqcueja' }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set, so this workflow deployed no Edge Functions; Supabase's GitHub integration still deploys them, and applies migrations beside this workflow while it does."
            echo "- Edge Functions: not deployed here (no SUPABASE_ACCESS_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "${PROJECT_REF}" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::CLOVEERP_PROJECT_REF must be a 20-character project ref; got '${PROJECT_REF}'."
            exit 1
          fi
          deployed=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [[ -f "$dir/index.ts" ]] || continue
            # --use-api bundles on Supabase's side, as the integration did: it follows
            # the relative imports into worker/src/core and src/lib, and needs no Docker.
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api
            deployed="$deployed $name"
          done
          echo "Edge Functions deployed:${deployed}"
          echo "- Edge Functions deployed:${deployed}" >> "$GITHUB_STEP_SUMMARY"

      - name: Schedule the dispatch function
        id: schedule_dispatch
        # Email leaves only when something posts to the dispatch function, and
        # nothing did. erp.ensure_platform_schedule() makes that post a pg_cron
        # job, clove-dispatch, but only when it is given the function's URL, and
        # the migration that defines it gives none: live's register has said
        # "no dispatch URL has been given" since the day it was written, and
        # every email queued since was queued for nobody.
        #
        # Three things, all inside the database, none printed:
        #
        #   the secret  the job signs its request with, created in the vault
        #               when absent, from random bytes the database generates
        #               itself. It never exists outside the database: not in the
        #               repository, not in a GitHub secret, not in this log. The
        #               function reads the same vault entry over its own
        #               connection, so there is nothing to copy between them.
        #   the backlog email and webhooks the minute pass queued while nothing
        #               drained, retired right before the job can first send
        #               them: erp.retire_undrained_notifications_everywhere()
        #               turns what is over an hour old into in-app notices, and
        #               does nothing once any drain pass has been recorded. The
        #               migration that retired them ran when it was applied, and
        #               a run that stopped before this step (a failed replay, a
        #               function that would not deploy) leaves days of mail for
        #               the first pass to send. A failure here stops the step
        #               before anything is scheduled. The summary gets each
        #               organisation that had any.
        #   the job     rescheduled only when the register, cron.job and this
        #               URL disagree, or the stored command predates the request
        #               timeout 20260913120000 gives it. Rescheduling renumbers
        #               both jobs, which on every deploy would be churn.
        #
        # After the scheduler is started again, so the new jobs are not left
        # paused under ids the resume step never saw; before the proof, so the
        # proof reads the schedule an operator would find.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies)) }}
        run: |
          set -euo pipefail
          # Interpolated into SQL below, so its shape is checked first.
          if ! [[ "$DISPATCH_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~-]+)+$ ]]; then
            echo "::error::the dispatch URL '${DISPATCH_URL}' is not a plain https URL such as https://<ref>.supabase.co/functions/v1/dispatch; nothing was scheduled."
            exit 1
          fi

          missing=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select concat_ws(', ',
                     case when to_regclass('cron.job') is null then 'pg_cron' end,
                     case when not exists (select 1 from pg_catalog.pg_extension where extname = 'pg_net') then 'pg_net' end,
                     case when to_regclass('vault.secrets') is null then 'supabase_vault' end);")
          if [[ -n "$missing" ]]; then
            echo "::error::live has no ${missing}, so the dispatch function cannot be scheduled from inside the database and no email can leave. Enable it under Database, Extensions and run this workflow again."
            exit 1
          fi

          # What the proof below waits for a drain pass after.
          echo "DISPATCH_SCHEDULED_AT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc 'select now()')" >> "$GITHUB_ENV"

          had=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select exists (select 1 from vault.secrets where name = 'cloveerp_dispatch_secret');")
          if [[ "$had" == "t" ]]; then
            secret="already in the vault"
          else
            # create_secret answers with the entry's id, not its value, and
            # even that goes nowhere.
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
              select vault.create_secret(
                       encode(extensions.gen_random_bytes(32), 'hex'),
                       'cloveerp_dispatch_secret',
                       'x-dispatch-secret for the pg_cron job clove-dispatch and the dispatch function. Created inside the database by deploy.yml and never printed.')
               where not exists (select 1 from vault.secrets where name = 'cloveerp_dispatch_secret');" > /dev/null
            secret="created in the vault"
          fi

          # Right before the schedule, so nothing queued before this moment can
          # reach the first pass. One statement, one transaction: the function
          # sets each organisation's context for that transaction only.
          if ! retired=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -F '|' -c "
                select r.tenant_code, r.retired
                  from erp.retire_undrained_notifications_everywhere() r
                 order by r.tenant_code;"); then
            echo "::error::erp.retire_undrained_notifications_everywhere() failed, so mail queued while nothing drained could not be retired; nothing was scheduled, so none of it can be sent. The error is above."
            exit 1
          fi
          checked=0
          retired_total=0
          retired_lines=""
          while IFS='|' read -r tenant_code count; do
            [[ -n "$tenant_code" ]] || continue
            checked=$((checked + 1))
            if [[ "$count" =~ ^[0-9]+$ ]] && (( count > 0 )); then
              retired_total=$((retired_total + count))
              retired_lines+="  - ${tenant_code}: ${count}"$'\n'
            fi
          done <<< "$retired"
          if [[ "$checked" -eq 0 ]]; then
            backlog="nothing retired: a drain pass has already been recorded"
          else
            backlog="${retired_total} undrained notification(s) retired across ${checked} organisation(s)"
          fi

          agrees=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select exists (
              select 1
                from erp_meta.platform_schedule s
                join cron.job j on j.jobid = s.cron_jobid
               where s.code = 'clove-dispatch'
                 and s.is_scheduled
                 and j.jobname = 'clove-dispatch'
                 and j.active
                 and j.command = s.command
                 and position(quote_literal('${DISPATCH_URL}') in s.command) > 0
                 and position('timeout_milliseconds' in s.command) > 0);")
          if [[ "$agrees" == "t" ]]; then
            result="unchanged: clove-dispatch posts to ${DISPATCH_URL}, and the register, cron.job and the command agree"
          else
            result=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.ensure_platform_schedule('${DISPATCH_URL}')::text;")
          fi
          echo "secret: ${secret}"
          echo "backlog: ${backlog}"
          [[ -z "$retired_lines" ]] || printf '%s' "$retired_lines"
          echo "schedule: ${result}"
          {
            echo "## Dispatch"
            echo "- secret: ${secret}"
            echo "- backlog: ${backlog}"
            [[ -z "$retired_lines" ]] || printf '%s' "$retired_lines"
            echo "- schedule: ${result}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bring the demonstration up to today
        # A demonstration organisation that stopped trading in the spring reads,
        # to a prospect, as a company that went under: every penny it is owed
        # aged past ninety days, nothing in its current bucket, no month ever
        # closed. erp.catch_up_demonstrations() trades it forward to the day of
        # this deploy through erp.seed_demo_history(), bills the goods it
        # received and never billed, and closes every month before this one with
        # nothing waived.
        #
        # Here rather than in a migration, for two reasons. A migration is one
        # transaction, and five months of trading leaves thousands of journal
        # rows with deferred trigger events pending, which the generators at the
        # foot of every migration cannot then ALTER past — that is what took the
        # deploy down on 18 September (20260920300000 has the whole account).
        # And a migration runs once, so a demonstration it brings up to today is
        # a month stale a month later; a step runs every deploy, and after the
        # first one there are only the days since the last deploy to build.
        #
        # Before the proof below, so that what is proved is the database as this
        # deploy leaves it.
        #
        # No statement timeout: the builder paces itself off one, and under the
        # configured two minutes it would build a single day per call. It is
        # bounded by the days between the last deploy and today.
        #
        # This never fails the deploy. It is hygiene on demonstration data, not
        # an invariant of the product, and a red deploy blocks every branch
        # behind it. The routine raises nothing — an organisation that refuses is
        # reported and the next one is tried — and continue-on-error covers the
        # rest. What it will not do is go quiet: every note comes back out here.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies)) }}
        continue-on-error: true
        env:
          PGOPTIONS: -c statement_timeout=0
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/demonstrations.json"
          started=$(date +%s%N)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc \
            "select erp.catch_up_demonstrations();" > "$report"
          seconds=$(awk -v ms="$(( ($(date +%s%N) - started) / 1000000 ))" \
                        'BEGIN { printf "%.1f", ms / 1000 }')

          lines=$(jq -r '.[] |
            "- \(.organisation // "?"): traded \(.traded_from // "-") to \(.traded_to // "-"), "
            + "\(.documents_built // 0) document(s); \(.bills_raised // 0) supplier bill(s); "
            + "\(.periods_closed // 0) month(s) closed, \(.periods_left_open // 0) left open"
          ' "$report")
          notes=$(jq -r '.[] | . as $o | (.notes // [])[] | "- \($o.organisation // "?"): \(.)"' "$report")

          echo "erp.catch_up_demonstrations() took ${seconds} s"
          [[ -z "$lines" ]] && echo "no demonstration organisation on this database" || echo "$lines"
          if [[ -n "$notes" ]]; then
            echo "$notes"
            while IFS= read -r n; do echo "::warning::${n}"; done <<< "$notes"
          fi
          {
            echo "## Demonstration"
            echo "erp.catch_up_demonstrations() took ${seconds} s."
            [[ -z "$lines" ]] && echo "No demonstration organisation on this database." || echo "$lines"
            [[ -z "$notes" ]] || { echo; echo "What it could not do:"; echo "$notes"; }
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the live database
        # The same checks the build runs, minus the suites: suites create and
        # destroy organisations and do not belong on live. erp.platform_assurance()
        # runs every registered assertion; the whole-database reconciliation
        # visits every organisation. Either failing fails the deploy, loudly.
        #
        # And how long it took, check by check. erp.platform_assurance() runs
        # under a 55-second statement_timeout and took 63.3 s here on 14
        # September; the console asks for it through the data API. It is run
        # once, kept, and read twice: for what failed, and for where the time
        # went (erp.run_diagnostic() records elapsed_ms per check since
        # 20260914090000). Over 35 s is a warning, not a failure: a slow proof
        # is still a proof, and the slowest checks it prints are where to look.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies)) }}
        run: |
          set -euo pipefail
          assurance="$RUNNER_TEMP/assurance.json"
          started=$(date +%s%N)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.platform_assurance();" > "$assurance"
          wall_ms=$(( ($(date +%s%N) - started) / 1000000 ))
          seconds=$(awk -v ms="$wall_ms" 'BEGIN { printf "%.1f", ms / 1000 }')
          slowest=$(jq -r '
            map(select(.elapsed_ms != null)) | sort_by(-.elapsed_ms) | .[:10][]
            | "\(.elapsed_ms | tostring | " " * ([0, 9 - length] | max) + .) ms  \(.code)"
          ' "$assurance")
          echo "platform_assurance took ${seconds} s; the slowest checks:"
          echo "$slowest"
          {
            echo "## Assurance"
            echo "erp.platform_assurance() took ${seconds} s. The slowest checks:"
            echo '```'
            echo "$slowest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          bad=$(jq -r '.[] | select(.ok == false) | "\(.code): \((.detail // "")[0:120])"' "$assurance")
          if [[ -n "$bad" ]]; then
            echo "::error::platform_assurance() is not green on live:"
            echo "$bad"
            exit 1
          fi
          if (( wall_ms > 35000 )); then
            echo "::warning::platform_assurance() took ${seconds} s on live, more than the 35 s it should stay under; its statement_timeout is 55 s. The slowest checks are listed above."
          fi
          echo "platform_assurance: every registered check green in ${seconds} s"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.assert_whole_database_reconciles();"
          # The release is proved: the database it produced passed. A release
          # row without proved_at is a deploy that applied and did not check.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.prove_release('${RELEASE_ID}');"
          {
            echo "## Live"
            echo '```'
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select 'organisations: ' || count(*) from erp.tenant;"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select 'migrations recorded: ' || count(*) from supabase_migrations.schema_migrations;"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.assert_whole_database_reconciles();"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select 'release ' || left(git_sha, 12) || ' recorded ' || recorded_at || ', ledger at ' || coalesce(migrations_high, '(none)') || ', proved ' || proved from erp.release_report() limit 1;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove email can leave
        # A schedule is a promise; a drain pass is the evidence.
        #
        # erp.platform_assurance() is green with dispatch unscheduled, and has
        # to be: a database the build stands up has no URL to give it. So the
        # proof that live sends email is here, where only live is touched. The
        # register, cron and the vault must agree, and then a pass must be
        # recorded in erp_meta.drain_pass after the step above began. A pass is
        # recorded only if cron fired, pg_net posted, the gateway let the
        # request through, the function accepted the secret, loaded its
        # configuration and reached the database: the whole path, in one row.
        #
        # always(), so a proof that failed above cannot hide whether email
        # leaves; and only when the schedule step succeeded, because otherwise
        # there is nothing scheduled to prove.
        if: ${{ always() && steps.schedule_dispatch.outcome == 'success' }}
        run: |
          set -euo pipefail
          state=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select coalesce((
              select case
                       when not s.is_scheduled
                         then 'the register says it is not scheduled: ' || s.reason
                       when not exists (select 1 from cron.job j where j.jobid = s.cron_jobid and j.jobname = 'clove-dispatch' and j.active)
                         then 'the register names job ' || coalesce(s.cron_jobid::text, 'none') || ' and cron.job has no active clove-dispatch under it'
                       when not exists (select 1 from vault.secrets v where v.name = 'cloveerp_dispatch_secret')
                         then 'the vault has no cloveerp_dispatch_secret for the job to sign with'
                       else 'ok'
                     end
                from erp_meta.platform_schedule s
               where s.code = 'clove-dispatch'),
              'erp_meta.platform_schedule has no clove-dispatch row');")
          if [[ "$state" != "ok" ]]; then
            echo "::error::clove-dispatch: ${state}"
            exit 1
          fi

          # A tick a minute; four minutes is three chances and a slow one.
          passes=0
          for _ in $(seq 1 24); do
            passes=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from erp_meta.drain_pass where finished_at > '${DISPATCH_SCHEDULED_AT}'::timestamptz;")
            if [[ "$passes" -gt 0 ]]; then break; fi
            sleep 10
          done

          if [[ "$passes" -eq 0 ]]; then
            # Diagnosis only from here: nothing below may hide the failure.
            set +e
            echo "What pg_net got back since ${DISPATCH_SCHEDULED_AT}, newest first:"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
              select r.created || '  status ' || coalesce(r.status_code::text, 'none')
                     || '  timed out ' || coalesce(r.timed_out::text, '-')
                     || '  ' || left(regexp_replace(coalesce(r.error_msg, r.content, ''), '\s+', ' ', 'g'), 200)
                from net._http_response r
               where r.created > '${DISPATCH_SCHEDULED_AT}'::timestamptz
               order by r.created desc
               limit 5;"
            echo "What cron recorded for clove-dispatch since then, newest first:"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
              select d.start_time || '  ' || d.status || '  ' || left(coalesce(d.return_message, ''), 200)
                from cron.job_run_details d
                join cron.job j on j.jobid = d.jobid
               where j.jobname = 'clove-dispatch'
                 and d.start_time > '${DISPATCH_SCHEDULED_AT}'::timestamptz
               order by d.start_time desc
               limit 5;"
            codes=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
              select coalesce(string_agg(distinct coalesce(r.status_code::text, case when r.timed_out then 'timeout' else 'error' end), ' '), '')
                from net._http_response r
               where r.created > '${DISPATCH_SCHEDULED_AT}'::timestamptz;")
            set -e
            diagnosis=""
            for code in $codes; do
              case "$code" in
                401) diagnosis+=" 401: the gateway refused the request before the function ran, so the deployed dispatch function still has verify_jwt = true. supabase/config.toml says false, and the Supabase GitHub integration applies it when it deploys main: check that deploy ran." ;;
                403) diagnosis+=" 403: the function refused the secret: the header matched neither the vault's cloveerp_dispatch_secret nor CLOVEERP_DISPATCH_SECRET. A warm function keeps what it read from the vault for up to five minutes, so if the entry was just created or changed, run this workflow again." ;;
                404) diagnosis+=" 404: nothing is deployed at ${DISPATCH_URL}: the function has not been deployed, or vars.CLOVEERP_DISPATCH_URL names the wrong one." ;;
                500) diagnosis+=" 500: the function ran and could not drain. The body above names the setting (a database URL, CLOVEERP_TENANTS without CLOVEERP_PRINCIPALS) or the error; the function's log has the rest." ;;
                timeout) diagnosis+=" timed out: pg_net stopped waiting before the function answered, and no pass followed, so the function did not finish either: its log says where it stopped." ;;
                *) diagnosis+=" ${code}: see the responses above." ;;
              esac
            done
            if [[ -z "${codes// /}" ]]; then
              diagnosis=" pg_net recorded no response at all: cron has not fired clove-dispatch (the cron rows above say whether it ran and what it returned), or every request is still in flight."
            fi
            echo "::error::clove-dispatch is scheduled and no drain pass was recorded in four minutes, so no email is leaving.${diagnosis}"
            exit 1
          fi

          last=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select 'last pass ' || p.finished_at || ' by ' || p.worker
                   || ': ' || coalesce(p.report ->> 'organisations', '?') || ' organisation(s), email sent '
                   || coalesce(p.report ->> 'emailSent', '0') || ', email failed '
                   || coalesce(p.report ->> 'emailFailed', '0') || ', failed stages '
                   || coalesce(p.report ->> 'failures', '0')
              from erp_meta.drain_pass p
             order by p.finished_at desc
             limit 1;")
          echo "$last"
          echo "- ${last}" >> "$GITHUB_STEP_SUMMARY"
          # A stage that failed in one organisation does not stop the others'
          # email, so it is not this proof's failure; it is still worth a line.
          failed=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select coalesce(max((p.report ->> 'failures')::int), 0)
              from erp_meta.drain_pass p
             where p.finished_at > '${DISPATCH_SCHEDULED_AT}'::timestamptz;")
          if [[ "$failed" -gt 0 ]]; then
            echo "::warning::a drain pass since this deploy had ${failed} failed stage(s). Email is leaving; something in at least one organisation is not. The dispatch function's log names the organisation and the stage."
          fi

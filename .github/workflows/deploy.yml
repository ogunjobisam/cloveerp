name: deploy

# The route to the live database that is not a person at a console.
#
# Until this workflow, every change reached production through the Supabase
# MCP connector, one statement block at a time, because the repository holds
# no database password and the environment the work is done from cannot reach
# the project host. That worked, and it produced supabase/ops/README.md: a
# 154 KB reconciliation script generated because the migrations could not be
# replayed. A drift repaired by generation is a drift that will recur.
#
# From here, main is deployed by replay. The connection string lives in one
# repository secret, CLOVEERP_LIVE_DATABASE_URL, set by the project owner and
# read by nobody else; it must be the session-pooler URL (the direct host is
# IPv6-only and a runner cannot reach it) and percent-encoded, because the CLI
# says so. The Supabase CLI records what it applies in
# supabase_migrations.schema_migrations, which is what the deployment screen
# in the platform console compares against the repository.
#
# Two jobs:
#
#   dry-run  — on every pull request: what WOULD apply, and the remote history.
#              Both jobs refuse without the secret rather than pass having
#              looked at nothing; the secret is what makes either of them real.
#   apply    — on push to main: apply, then prove the result with the same
#              checks the build runs. A deploy that applied and did not check
#              is the silent-job problem moved to production.
#
# One-off: the live project's history table holds the names the connector
# recorded, not the repository's filenames. Run this workflow by hand with
# mark_applied = true once, giving mark_applied_through — the highest version
# already on live. The stamps naming no repository file are reverted, every
# version up to that boundary is recorded as applied, and replay starts from
# the one after it.
#
# The boundary is an input rather than "everything in this checkout" because
# there is no commit that both contains this workflow and carries only the
# migrations live already has: supabase/ops/README.md records that everything
# up to 20260905040000 reached live through the connector, and this workflow
# arrived after that, in the merge of PR #60. Marking the whole checkout
# applied on main would record every later migration as applied without
# applying it — the one way to misuse this, and a silent, permanent divergence
# rather than a failed deploy. So it refuses without the boundary.
#
# --include-all, always. Without it the CLI applies only migrations newer than
# the newest applied, and this repository has already had a fix silently
# undone by a file that sorted earlier than one already applied.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mark_applied:
        description: 'One-off: reconcile the live migration history with this repository, then stop. Requires mark_applied_through.'
        type: boolean
        default: false
      mark_applied_through:
        description: 'The highest migration version already on live, e.g. 20260905040000. Everything up to it is recorded as applied; everything after it is left for replay to apply.'
        type: string
        default: ''
      repair_gateway_bodies:
        description: 'One-off: run supabase/ops/20260908_gateway_function_bodies.sh against live, re-emitting the twelve function bodies the remaining migrations patch, then stop.'
        type: boolean
        default: false

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Its own group, per branch, and not the deploy's.
    #
    # deploy-live was declared on the workflow, so both jobs were in it, and
    # GitHub keeps exactly one run queued per group: a third arrival cancels
    # the one already waiting. On the merge of #73 that is precisely what
    # happened — the push to main queued behind a running replay, a pull
    # request dry run arrived thirty-five seconds later, and the production
    # deploy of the merge was cancelled by a job that only reads. It went
    # grey, not red, and nothing on the merged pull request said the deploy
    # it caused had been thrown away.
    #
    # A read cannot be allowed to displace a write. The dry run now cancels
    # only its own earlier self on the same branch, which is what you want
    # when a pull request is pushed to twice in a minute.
    concurrency:
      group: deploy-dry-run-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: What would apply
        # A dry run that could not see live must not be green.
        #
        # This warned and exited 0, so every pull request carried a green
        # deploy check that had compared nothing with anything. The secret has
        # never been set, and the apply job below has therefore failed on
        # every merge to main since this workflow was written — four in a row,
        # each in fifteen seconds, under a green tick on the pull request that
        # caused it. The warning was the only notice, and a warning on a
        # passing check is the notice nobody reads.
        #
        # A fork's pull request gets no secrets and would fail here. That is
        # the right answer and not a hypothetical to design around: this
        # repository has had no fork pull request, and one arriving is a
        # decision to take then, in the open, rather than a hole to leave now.
        env:
          DB_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${DB_URL}" ]]; then
            echo "::error::CLOVEERP_LIVE_DATABASE_URL is not set, so this dry run compared nothing with live. Add the session-pooler connection string as a repository secret; until it is set, no merge to main can deploy."
            exit 1
          fi
          echo "## Migrations that would apply" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          supabase db push --dry-run --include-all --db-url "$DB_URL" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A replay that blocks on a lock rather than deadlocking gets no 40P01 and
    # no retry — it just waits. On the default six-hour job timeout it would
    # wait holding the deploy-live concurrency group and, worse, holding the
    # scheduler paused: every deploy behind it queued and the platform's clock
    # stopped, for six hours, with nothing red to say so. An hour is longer
    # than any replay this repository has run and short enough to notice.
    # Cancelling still runs the resume step, which is always().
    timeout-minutes: 60
    # One deploy against live at a time, and never two replays at once. A
    # newer deploy may cancel an older one still queued: --include-all means
    # the newer applies everything the older would have, so the migrations
    # are not lost with the run.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    env:
      DB_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: The secret exists
        # A deploy that deployed nothing must not be green.
        run: |
          if [[ -z "${DB_URL}" ]]; then
            echo "::error::CLOVEERP_LIVE_DATABASE_URL is not set. Add the session-pooler connection string as a repository secret; nothing was applied."
            exit 1
          fi

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Re-emit the twelve gateway function bodies (one-off)
        if: github.event_name == 'workflow_dispatch' && inputs.repair_gateway_bodies
        # Seventeen of the migrations still to apply rewrite an existing
        # function by text, and refuse when the body is not the one they were
        # written against. Live's is not, because everything up to
        # 20260905040000 arrived through the connector rather than by replaying
        # the files: functionally equivalent, textually different.
        #
        # supabase/ops/20260908_gateway_function_bodies.sh does the work. It
        # runs here rather than on somebody's laptop because it needs a
        # PostgreSQL to build the reference in, and that has to be the image
        # the product is verified against — pg_jsonschema is a Rust extension
        # apt does not carry, and a reference built on a different host is not
        # the reference.
        #
        # Pinned to the same image and major version as schema.yml, for the
        # same reason: what live is compared against must be what CI builds.
        run: |
          set -euo pipefail
          docker run -d --name clove-erp-reference \
            -e POSTGRES_PASSWORD=postgres -p 5432:5432 \
            supabase/postgres:17.6.1.167
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then break; fi
            if [[ "$i" -eq 60 ]]; then
              echo "::error::the reference PostgreSQL did not become ready within 60s"
              docker logs clove-erp-reference 2>&1 | tail -40 >&2
              exit 1
            fi
            sleep 1
          done

          log="$RUNNER_TEMP/gateway.log"
          set +e
          CLOVEERP_LIVE_DATABASE_URL="$DB_URL" \
            ./supabase/ops/20260908_gateway_function_bodies.sh --apply 2>&1 \
            | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          .github/summarise.sh "$log" "## Gateway function bodies"
          exit "$status"

      - name: Record every repository migration as applied (one-off)
        if: github.event_name == 'workflow_dispatch' && inputs.mark_applied
        # Both directions, because the history table and the repository
        # disagree in both and `supabase db push` refuses on either half.
        #
        # The first version of this step marked the repository's versions
        # applied and stopped, which was half the job. The first dry run that
        # ever reached live proved it: the history table held 160 stamps the
        # connector recorded, the repository holds 278 files, and the two sets
        # do not intersect at all — not one stamp names a file, not one file is
        # recorded. Marking the 278 applied would have left the push refusing
        # on the 160, with the error the CLI actually returns:
        # "Remote migration versions not found in local migrations directory".
        #
        # Reverting a stamp deletes its row. It undoes nothing the connector
        # did — the schema those statements built is still there — it declares
        # the repository the record from here on, which is the whole point.
        env:
          THROUGH: ${{ inputs.mark_applied_through }}
        run: |
          set -euo pipefail

          # No boundary, no repair. Recording a migration as applied without
          # applying it is not recoverable by a later deploy: replay skips what
          # the history table already claims, so the change is stranded and
          # live diverges from the repository for good. A refusal here costs a
          # re-dispatch; the default it replaces costs the schema.
          if [[ -z "${THROUGH// /}" ]]; then
            echo "::error::mark_applied needs mark_applied_through: the highest migration version already on live (supabase/ops/README.md records 20260905040000 as the last the connector applied). Without it this would record every later migration as applied without applying it."
            exit 1
          fi
          if ! [[ "$THROUGH" =~ ^[0-9]+$ ]]; then
            echo "::error::mark_applied_through must be a bare version, e.g. 20260905040000; got '$THROUGH'."
            exit 1
          fi

          # Numerically, not as strings: the repository carries both 0001 and
          # 20260905040000 and a lexicographic compare across those lengths is
          # only accidentally right. Every version is well inside a double.
          all=$(ls supabase/migrations/*.sql | xargs -n1 basename | sed -E 's/^([0-9]+)_.*$/\1/' | sort -u)
          versions=$(printf '%s\n' "$all" | awk -v t="$THROUGH" '$1 + 0 <= t + 0')
          pending=$(printf '%s\n' "$all" | awk -v t="$THROUGH" '$1 + 0 > t + 0')

          n_at=$(printf '%s' "$versions" | grep -c . || true)
          n_after=$(printf '%s' "$pending" | grep -c . || true)
          if [[ "$n_at" -eq 0 ]]; then
            echo "::error::no migration in this repository is at or below $THROUGH; the boundary is wrong."
            exit 1
          fi
          echo "boundary $THROUGH: $n_at at or below it, $n_after after it left for replay to apply"

          # An absent history table is a project nothing has pushed to, which
          # is not an error: there is simply nothing stale to clear.
          if [[ "$(psql "$DB_URL" -tAc "select to_regclass('supabase_migrations.schema_migrations') is not null")" == "t" ]]; then
            remote=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc \
              "select version from supabase_migrations.schema_migrations order by version")
          else
            remote=""
          fi

          # Against the whole repository, not the bounded set: a stamp naming a
          # migration above the boundary is recorded and real, not stale.
          stale=$(comm -23 <(printf '%s\n' "$remote" | grep -v '^$' | sort -u) <(printf '%s\n' "$all") | tr '\n' ' ')
          if [[ -n "${stale// /}" ]]; then
            echo "reverting $(echo $stale | wc -w) stamp(s) naming no migration in this repository"
            # shellcheck disable=SC2086
            supabase migration repair --status reverted $stale --db-url "$DB_URL"
          else
            echo "no stale stamps: every recorded version names a migration in this repository"
          fi

          versions=$(printf '%s\n' "$versions" | tr '\n' ' ')
          echo "marking $(echo $versions | wc -w) versions applied"
          # shellcheck disable=SC2086
          supabase migration repair --status applied $versions --db-url "$DB_URL"
          supabase migration list --db-url "$DB_URL" | tail -20
          echo "Recorded. Re-run this workflow without mark_applied to deploy." >> "$GITHUB_STEP_SUMMARY"

      - name: Pause the scheduler for the length of the replay
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies)) }}
        # The retry below survives a deadlock; not having one is better.
        #
        # cron.job fires erp.run_due_jobs_all_tenants() every minute, and a
        # replay runs for tens of minutes doing DDL that takes locks across
        # hundreds of objects. On the first real deploy the two crossed and cost
        # twelve migrations of progress. A queue that waits half an hour is a
        # queue that waits; the worker picks up where it left off, and the
        # ordering gate is what keeps that safe.
        #
        # Best effort, deliberately. If the deploy's role may not write
        # cron.job, that is a warning and not a reason to refuse to deploy —
        # the retry is the guarantee, this is the optimisation.
        run: |
          set -euo pipefail
          if [[ "$(psql "$DB_URL" -tAc "select to_regclass('cron.job') is not null")" != "t" ]]; then
            echo "no cron.job on this host; nothing to pause"
            exit 0
          fi
          paused=$(psql "$DB_URL" -tAc \
            "select coalesce(string_agg(jobid::text, ','), '') from cron.job where active" || true)
          if [[ -z "$paused" ]]; then
            echo "no active scheduled job; nothing to pause"
            exit 0
          fi
          if psql "$DB_URL" -v ON_ERROR_STOP=1 -qc \
               "update cron.job set active = false where jobid in ($paused)"; then
            echo "PAUSED_JOBS=$paused" >> "$GITHUB_ENV"
            echo "paused scheduled job(s): $paused"
          else
            echo "::warning::could not pause cron.job; the replay will run against a live scheduler and rely on the deadlock retry."
          fi

      - name: Apply pending migrations by replay
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies)) }}
        # A deadlock is a coincidence, not a verdict on the deploy.
        #
        # Every migration ends by re-running the generators, and
        # erp.apply_row_security() and erp.apply_execute_grants() take heavy
        # locks across hundreds of objects. Anything else touching the database
        # at that moment can cross with them — on the first real deploy it was a
        # session running erp.apply_execute_grants() itself, twenty-eight
        # minutes and twelve migrations in:
        #
        #   ERROR: deadlock detected (SQLSTATE 40P01)
        #   Process 1095739 waits for AccessShareLock on relation 38200;
        #     blocked by process 1098150.
        #
        # PostgreSQL picks a victim and aborts it. The right answer is to go
        # again: the migrations that already applied are recorded, so a re-run
        # resumes at the one that lost rather than starting over, and the one
        # that lost rolled back whole. Twelve migrations of progress should not
        # be thrown away because a minutely job wanted the same table.
        #
        # Only on 40P01. Every other failure is this deploy's to answer for,
        # and retrying it would turn one honest error into three.
        run: |
          set -euo pipefail
          # The moment before anything changed: the point-in-time-recovery
          # target a rollback of this deploy would restore to. Recorded on the
          # release row below, and taken once rather than per attempt — a
          # retry is the same deploy, so it is the same target.
          echo "DEPLOY_STARTED_AT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc 'select now()')" >> "$GITHUB_ENV"

          attempts=3
          log="$RUNNER_TEMP/push.log"
          all="$RUNNER_TEMP/push-all.log"
          : > "$all"
          applied=false
          for attempt in $(seq 1 "$attempts"); do
            if supabase db push --include-all --db-url "$DB_URL" 2>&1 \
                 | tee "$log"; then
              cat "$log" >> "$all"
              applied=true
              break
            fi
            cat "$log" >> "$all"

            if ! grep -q '40P01' "$log"; then
              .github/summarise.sh "$all" "## Applied"
              echo "::error::the replay failed for a reason that is not a deadlock; not retrying. The migrations applied before it are recorded, so a later run resumes from there."
              exit 1
            fi

            if [[ "$attempt" -lt "$attempts" ]]; then
              # Back off enough to clear a minutely job's window.
              wait=$((attempt * 30))
              echo "::warning::deadlock (40P01) on attempt ${attempt} of ${attempts}; retrying in ${wait}s from the migration that lost."
              printf '\n-- deadlock on attempt %s; resuming --\n' "$attempt" >> "$all"
              sleep "$wait"
            fi
          done

          .github/summarise.sh "$all" "## Applied"
          if [[ "$applied" != true ]]; then
            echo "::error::deadlocked on all ${attempts} attempts. Something is contending for the same objects throughout — check cron.job and pg_stat_activity before running again."
            exit 1
          fi

      - name: Record the release
        # One row per deploy, written before the database is proved so that
        # the proof's own release clause — the ledger has moved past the last
        # recorded release — reads this deploy, not the one before it.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies)) }}
        run: |
          set -euo pipefail
          release=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select erp.record_release('${GITHUB_SHA}', '${DEPLOY_STARTED_AT}'::timestamptz, 'lovable', 'run ${GITHUB_RUN_ID}');")
          echo "RELEASE_ID=$release" >> "$GITHUB_ENV"
          echo "release $release recorded for ${GITHUB_SHA}"

      - name: Prove the live database
        # The same checks the build runs, minus the suites: suites create and
        # destroy organisations and do not belong on live. erp.platform_assurance()
        # runs every registered assertion; the whole-database reconciliation
        # visits every organisation. Either failing fails the deploy, loudly.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies)) }}
        run: |
          set -euo pipefail
          bad=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select coalesce(string_agg(c ->> 'code' || ': ' || left(c ->> 'detail', 120), E'\n'), '')
              from jsonb_array_elements(erp.platform_assurance()) c
             where not (c ->> 'ok')::boolean;")
          if [[ -n "$bad" ]]; then
            echo "::error::platform_assurance() is not green on live:"
            echo "$bad"
            exit 1
          fi
          echo "platform_assurance: every registered check green"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.assert_whole_database_reconciles();"
          # The release is proved: the database it produced passed. A release
          # row without proved_at is a deploy that applied and did not check.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.prove_release('${RELEASE_ID}');"
          {
            echo "## Live"
            echo '```'
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select 'organisations: ' || count(*) from erp.tenant;"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select 'migrations recorded: ' || count(*) from supabase_migrations.schema_migrations;"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select erp.assert_whole_database_reconciles();"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select 'release ' || left(git_sha, 12) || ' recorded ' || recorded_at || ', ledger at ' || coalesce(migrations_high, '(none)') || ', proved ' || proved from erp.release_report() limit 1;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the scheduler again
        # always(), and unconditional: whatever happened above — a failed
        # replay, an assurance that would not go green, a cancelled run — the
        # scheduler goes back on. A deploy that leaves the platform's own clock
        # stopped has done more damage than the one it was avoiding.
        #
        # No-op when nothing was paused, so this is safe on every path that
        # never reached the pause: PAUSED_JOBS is simply unset.
        #
        # A failure here fails the job even when the deploy itself succeeded.
        # The scheduler being off is not a footnote to a green deploy.
        if: always()
        run: |
          set -uo pipefail
          if [[ -z "${PAUSED_JOBS:-}" ]]; then
            echo "nothing was paused"
            exit 0
          fi
          if psql "$DB_URL" -v ON_ERROR_STOP=1 -qc \
               "update cron.job set active = true where jobid in (${PAUSED_JOBS})"; then
            echo "scheduled job(s) running again: ${PAUSED_JOBS}"
          else
            echo "::error::could not re-enable cron.job (${PAUSED_JOBS}). The platform scheduler is STOPPED on live: run 'update cron.job set active = true where jobid in (${PAUSED_JOBS});' by hand now."
            exit 1
          fi

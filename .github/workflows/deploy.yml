name: deploy

# The route to the live database that is not a person at a console.
#
# Until this workflow, every change reached production through the Supabase
# MCP connector, one statement block at a time, because the repository holds
# no database password and the environment the work is done from cannot reach
# the project host. That worked, and it produced supabase/ops/README.md: a
# 154 KB reconciliation script generated because the migrations could not be
# replayed. A drift repaired by generation is a drift that will recur.
#
# From here, main is deployed by replay. The connection string lives in one
# repository secret, CLOVEERP_LIVE_DATABASE_URL, set by the project owner and
# read by nobody else; it must be the session-pooler URL (the direct host is
# IPv6-only and a runner cannot reach it) and percent-encoded, because the CLI
# says so. The Supabase CLI records what it applies in
# supabase_migrations.schema_migrations, which is what the deployment screen
# in the platform console compares against the repository.
#
# Two deployments, since 6 October. The owner moved the demonstration out of
# production into a Supabase project of its own, Clove ERP Demo, served at
# demo.cloveerp.com by the same application; its connection string is the
# secret CLOVEERP_DEMO_DATABASE_URL, in the same form as the live one, and its
# ref the variable CLOVEERP_DEMO_PROJECT_REF. Every release goes to the
# demonstration FIRST, and production is not touched unless every step of
# that release succeeded: the demonstration is the rehearsal of every release.
#
# Three jobs:
#
#   dry-run       — on every pull request, once per deployment: what WOULD
#                   apply, and the remote history. Each refuses without its
#                   secret rather than pass having looked at nothing; the
#                   secret is what makes it real.
#   demonstration — on push to main: release to the demonstration
#                   (release.yml).
#   apply         — then, only if the demonstration's release succeeded,
#                   release to production (release.yml). A release applies,
#                   then proves the result with the same checks the build
#                   runs: a deploy that applied and did not check is the
#                   silent-job problem moved to production. Then it schedules
#                   the dispatch function from inside the database and waits
#                   for a drain pass, because a schedule nobody proved fires
#                   is the same problem again, one layer out.
#
# The demonstration project started empty, and is built from empty once, by
# demo_from_empty.yml, not by a release: until it has been, its release stops
# at "The demonstration has been built" and production waits.
#
# One-off: the live project's history table holds the names the connector
# recorded, not the repository's filenames. Run this workflow by hand with
# mark_applied = true once, giving mark_applied_through — the highest version
# already on live. The stamps naming no repository file are reverted, every
# version up to that boundary is recorded as applied, and replay starts from
# the one after it.
#
# The boundary is an input rather than "everything in this checkout" because
# there is no commit that both contains this workflow and carries only the
# migrations live already has: supabase/ops/README.md records that everything
# up to 20260905040000 reached live through the connector, and this workflow
# arrived after that, in the merge of PR #60. Marking the whole checkout
# applied on main would record every later migration as applied without
# applying it — the one way to misuse this, and a silent, permanent divergence
# rather than a failed deploy. So it refuses without the boundary.
#
# --include-all, always. Without it the CLI applies only migrations newer than
# the newest applied, and this repository has already had a fix silently
# undone by a file that sorted earlier than one already applied.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mark_applied:
        description: 'One-off: reconcile the live migration history with this repository, then stop. Requires mark_applied_through.'
        type: boolean
        default: false
      mark_applied_through:
        description: 'The highest migration version already on live, e.g. 20260905040000. Everything up to it is recorded as applied; everything after it is left for replay to apply.'
        type: string
        default: ''
      repair_gateway_bodies:
        description: 'One-off: run supabase/ops/20260908_gateway_function_bodies.sh against live, re-emitting the twelve function bodies the remaining migrations patch, then stop.'
        type: boolean
        default: false
      skip_demonstration:
        description: 'Break glass: release production WITHOUT releasing to the demonstration first. Only with confirm_production_ref.'
        type: boolean
        default: false
      confirm_production_ref:
        description: "With skip_demonstration: type production's project ref to confirm it."
        type: string
        default: ''

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    name: dry run (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Once per deployment, each against its own secret. By name, through
    # secrets[...]: an expression like `a && secrets.X || secrets.Y` falls
    # through to the second secret when the first is empty, and the
    # demonstration's dry run would then have read production and said so
    # under the demonstration's name.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: demonstration
            secret: CLOVEERP_DEMO_DATABASE_URL
          - target: production
            secret: CLOVEERP_LIVE_DATABASE_URL
    # Its own group, per branch, and not the deploy's.
    #
    # deploy-live was declared on the workflow, so both jobs were in it, and
    # GitHub keeps exactly one run queued per group: a third arrival cancels
    # the one already waiting. On the merge of #73 that is precisely what
    # happened — the push to main queued behind a running replay, a pull
    # request dry run arrived thirty-five seconds later, and the production
    # deploy of the merge was cancelled by a job that only reads. It went
    # grey, not red, and nothing on the merged pull request said the deploy
    # it caused had been thrown away.
    #
    # A read cannot be allowed to displace a write. The dry run now cancels
    # only its own earlier self on the same branch, which is what you want
    # when a pull request is pushed to twice in a minute.
    concurrency:
      group: deploy-dry-run-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: What would apply
        # A dry run that could not see live must not be green.
        #
        # This warned and exited 0, so every pull request carried a green
        # deploy check that had compared nothing with anything. The secret has
        # never been set, and the apply job below has therefore failed on
        # every merge to main since this workflow was written — four in a row,
        # each in fifteen seconds, under a green tick on the pull request that
        # caused it. The warning was the only notice, and a warning on a
        # passing check is the notice nobody reads.
        #
        # A fork's pull request gets no secrets and would fail here. That is
        # the right answer and not a hypothetical to design around: this
        # repository has had no fork pull request, and one arriving is a
        # decision to take then, in the open, rather than a hole to leave now.
        env:
          DB_URL: ${{ secrets[matrix.secret] }}
          TARGET: ${{ matrix.target }}
          SECRET_NAME: ${{ matrix.secret }}
          PROJECT_REF: ${{ matrix.target == 'demonstration' && vars.CLOVEERP_DEMO_PROJECT_REF || (vars.CLOVEERP_PROJECT_REF || 'xpzffnnhnhcqyjqcueja') }}
          OTHER_REF: ${{ matrix.target == 'demonstration' && (vars.CLOVEERP_PROJECT_REF || 'xpzffnnhnhcqyjqcueja') || vars.CLOVEERP_DEMO_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [[ -z "${DB_URL}" ]]; then
            if [[ "${TARGET}" == demonstration ]]; then
              echo "::error::${SECRET_NAME} is not set, so this dry run compared nothing with the demonstration. Add the demonstration project's session-pooler connection string as a repository secret, in the same form as CLOVEERP_LIVE_DATABASE_URL. Until it is set, a merge to main releases to nothing: the demonstration's release fails at its first step, and production is released only after the demonstration has been."
            else
              echo "::error::${SECRET_NAME} is not set, so this dry run compared nothing with live. Add the session-pooler connection string as a repository secret; until it is set, no merge to main can deploy."
            fi
            exit 1
          fi
          # The same check the release makes, so a connection string in the
          # wrong secret is said here, on the pull request, and not first by a
          # release.
          if [[ -z "${PROJECT_REF}" || "${DB_URL}" != *"${PROJECT_REF}"* || ( -n "${OTHER_REF}" && "${DB_URL}" == *"${OTHER_REF}"* ) ]]; then
            echo "::error::${SECRET_NAME} does not name the ${TARGET} project (${PROJECT_REF:-no ref set}), or names the other one. Check the secret and the variables CLOVEERP_DEMO_PROJECT_REF and CLOVEERP_PROJECT_REF."
            exit 1
          fi
          echo "## Migrations that would apply to the ${TARGET}" >> "$GITHUB_STEP_SUMMARY"
          # An empty demonstration lists every migration, which reads like a
          # finding and is not one: say why, when psql can tell.
          if [[ "${TARGET}" == demonstration ]] && command -v psql > /dev/null; then
            built=$(psql "$DB_URL" -tAc "select to_regnamespace('erp') is not null" 2>/dev/null || echo unknown)
            if [[ "$built" == "f" ]]; then
              echo "::notice::the demonstration project has not been built yet, so every migration is listed. It is built once, from empty, by the demo-from-empty workflow, not by a release; until then its release stops before applying anything, and production waits."
              echo "The demonstration has not been built yet: run demo-from-empty once after merging." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          supabase db push --dry-run --include-all --db-url "$DB_URL" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  demonstration:
    # Every release goes here first (the owner's decision of 6 October). Not on
    # a one-off repair of live's history, which is production's alone, and not
    # when the break-glass below was asked for.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.mark_applied && !inputs.repair_gateway_bodies && !inputs.skip_demonstration)
    name: release to the demonstration
    # One release against the demonstration at a time, for the reasons the
    # production job gives below; its own group, so a release to one
    # deployment never queues behind or displaces a release to the other.
    concurrency:
      group: deploy-demonstration
      cancel-in-progress: false
    uses: ./.github/workflows/release.yml
    with:
      target: demonstration
      project_ref: ${{ vars.CLOVEERP_DEMO_PROJECT_REF }}
      other_project_ref: ${{ vars.CLOVEERP_PROJECT_REF || 'xpzffnnhnhcqyjqcueja' }}
      secret_name: CLOVEERP_DEMO_DATABASE_URL
      dispatch_url: ${{ vars.CLOVEERP_DEMO_DISPATCH_URL || format('https://{0}.supabase.co/functions/v1/dispatch', vars.CLOVEERP_DEMO_PROJECT_REF) }}
      owner_email: ${{ vars.CLOVEERP_PLATFORM_OWNER_EMAIL }}
    secrets:
      database_url: ${{ secrets.CLOVEERP_DEMO_DATABASE_URL }}
      supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  apply:
    # Production, and only after the demonstration's release succeeded: a
    # failed, cancelled or skipped release there leaves production exactly as
    # it was. The exception is a one-off repair of live's history, which never
    # concerned the demonstration and runs here alone.
    #
    # And the break-glass: a dispatch with skip_demonstration releases
    # production alone, but only when production's ref is typed in
    # confirm_production_ref, and the release says so at the top of its
    # summary. For the day the demonstration itself is what is broken and
    # production cannot wait for it.
    needs: demonstration
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && (needs.demonstration.result == 'success'
              || (github.event_name == 'workflow_dispatch' && (inputs.mark_applied || inputs.repair_gateway_bodies))
              || (github.event_name == 'workflow_dispatch' && inputs.skip_demonstration
                  && inputs.confirm_production_ref == (vars.CLOVEERP_PROJECT_REF || 'xpzffnnhnhcqyjqcueja'))) }}
    name: release to production
    # One deploy against live at a time, and never two replays at once. A
    # newer deploy may cancel an older one still queued: --include-all means
    # the newer applies everything the older would have, so the migrations
    # are not lost with the run.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    uses: ./.github/workflows/release.yml
    with:
      target: production
      project_ref: ${{ vars.CLOVEERP_PROJECT_REF || 'xpzffnnhnhcqyjqcueja' }}
      other_project_ref: ${{ vars.CLOVEERP_DEMO_PROJECT_REF }}
      secret_name: CLOVEERP_LIVE_DATABASE_URL
      # The project's own dispatch function unless a repository variable says
      # otherwise.
      dispatch_url: ${{ vars.CLOVEERP_DISPATCH_URL || format('https://{0}.supabase.co/functions/v1/dispatch', vars.CLOVEERP_PROJECT_REF || 'xpzffnnhnhcqyjqcueja') }}
      mark_applied: ${{ github.event_name == 'workflow_dispatch' && inputs.mark_applied == true }}
      mark_applied_through: ${{ github.event_name == 'workflow_dispatch' && inputs.mark_applied_through || '' }}
      repair_gateway_bodies: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_gateway_bodies == true }}
      demonstration_skipped: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_demonstration == true }}
    secrets:
      database_url: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
      supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  break-glass-refused:
    # skip_demonstration without production's ref typed to confirm it: nothing
    # is released anywhere, and this says why rather than leaving two skipped
    # jobs that look like a quiet day.
    if: github.event_name == 'workflow_dispatch' && inputs.skip_demonstration && inputs.confirm_production_ref != (vars.CLOVEERP_PROJECT_REF || 'xpzffnnhnhcqyjqcueja')
    name: break glass refused
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::skip_demonstration releases production without the demonstration, and needs production's project ref typed in confirm_production_ref. It was not, so nothing was released."
          exit 1

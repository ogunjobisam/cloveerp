name: fleet rename

# A client deployment moved to a new address.
#
# A client is served at <address>.cloveerp.com. Its code never changes; its
# address may (20261012020000). The owner asks from the Fleet view, whose door
# checks the new address is free across the fleet and queues a request; the
# sweep (fleet_sweep.yml) starts this with the request's id; and
# supabase/ci/fleet_rename.sh carries it out: the project's auth settings,
# its functions' address, its own database (where it is served, and its one
# organisation's code), then the control plane's register, which keeps the
# old address for ninety days and sends anyone who uses it to the new one.
# Each step is an event on the client's row, every step done is undone when
# a later one fails, and the request is settled with what happened, here when
# the script could not say (rehearsed on every build by
# fleet_rename_rehearsal.sh).
#
# By hand only with a request's id: the console's door is where the new
# address is checked, so a rename nobody asked for there is refused.
#
# Still by hand, after it, as ever: the new address in the domain settings
# where the application is served, if the wildcard does not already cover it.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "The client's code, as the register holds it. It does not change."
        type: string
        required: true
      from:
        description: "The address it is at now, as the request says."
        type: string
        required: true
      to:
        description: "The address it moves to, as the request says."
        type: string
        required: true
      request:
        description: "The console's request (its id), which this run carries out and settles."
        type: string
        required: true

permissions:
  # Read: whether a release train is running (below).
  actions: read
  contents: read

# One rename of a client at a time. Per client, not across the fleet: the
# console allows one open rename per client, so this group never holds a
# second run that GitHub could cancel while it waits (a run cancelled before
# it starts would leave its request claimed); two clients' renames touch
# nothing in common.
concurrency:
  group: fleet-rename-${{ inputs.code }}
  cancel-in-progress: false

jobs:
  rename:
    name: move ${{ inputs.code }} from ${{ inputs.from }} to ${{ inputs.to }}
    runs-on: ubuntu-latest
    # The rename itself takes a minute; the rest is the wait for a release
    # train to finish (below).
    timeout-minutes: 150
    env:
      CODE: ${{ inputs.code }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      REQUEST: ${{ inputs.request }}
      CLOVEERP_LIVE_DATABASE_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APEX: ${{ vars.CLOVEERP_APEX || 'cloveerp.com' }}
      MAIL_FROM: ${{ vars.CLOVEERP_MAIL_FROM || 'noreply@cloveerp.com' }}
      PRODUCTION_REF: ${{ vars.CLOVEERP_PROJECT_REF || 'xpzffnnhnhcqyjqcueja' }}
      DEMO_REF: ${{ vars.CLOVEERP_DEMO_PROJECT_REF }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Masked
        run: |
          for value in "${CLOVEERP_LIVE_DATABASE_URL}" "${SUPABASE_ACCESS_TOKEN}" "${RESEND_API_KEY}"; do
            if [[ -n "$value" ]]; then
              echo "::add-mask::${value}"
            fi
          done

      - uses: actions/checkout@v4

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Only from main
        # The script that changes a client's address is the one main has
        # reviewed, not a branch's.
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::run this from main, where supabase/ci/fleet_rename.sh has been reviewed and merged; this run is on ${GITHUB_REF}, and nothing was changed."
            exit 1
          fi

      - name: No release train is running
        # A release says where the client is served (release.yml, "Say which
        # deployment this is"), and one running now read the old address
        # when it began. It reads the register again at that step, so a train
        # that starts after this rename follows it; one already under way is
        # waited out, up to two hours, rather than raced.
        run: |
          set -euo pipefail
          R="repos/${GH_REPO}"
          deadline=$(( $(date +%s) + 120 * 60 ))
          while :; do
            if ! going=$(gh api "${R}/actions/workflows/deploy.yml/runs?per_page=50" \
                           --jq '[.workflow_runs[] | select(.status != "completed" and .event != "pull_request") | .id | tostring] | join(" ")'); then
              going="(GitHub could not be asked)"
            fi
            if [[ -z "$going" ]]; then
              echo "no release train is running"
              break
            fi
            if [[ "$(date +%s)" -ge "$deadline" ]]; then
              echo "::error::a release train is still running after two hours (run ${going}), so ${CODE} was not renamed and nothing was changed. Ask for the rename again once it has finished."
              exit 1
            fi
            echo "a release train is running (run ${going}); asking again in a minute"
            sleep 60
          done

      - name: Rename, step by step
        run: supabase/ci/fleet_rename.sh "${CODE}" "${FROM}" "${TO}" "${REQUEST}"

      - name: A run that stopped settles its request
        # The script settles the request whenever it can say what happened.
        # A run that stopped before it, or around it (a step that failed
        # here, a timeout, a cancel), leaves the request claimed, and the
        # console then refuses another rename of this client; so it is
        # settled here, saying what to do. Only the run on main settles: a
        # branch's run was refused before touching anything. And only this
        # client's rename request: an id typed by hand that names anything
        # else is left alone. A register that already has the client at its
        # new address finished the rename (erp_meta.finish_deployment_rename
        # recorded it), and the request is settled as done.
        if: ${{ (failure() || cancelled()) && github.ref == 'refs/heads/main' }}
        run: |
          set -uo pipefail
          if [[ -z "${CLOVEERP_LIVE_DATABASE_URL}" ]] || ! [[ "${REQUEST}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::warning::the request could not be looked at (no control plane connection, or '${REQUEST}' is not a request's id)."
            exit 0
          fi
          if ! command -v psql > /dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          # On standard input, not -c: psql substitutes :'id' only there.
          # Through to_jsonb, as everywhere: the address column is the
          # control plane's since 20261012020000.
          row=$(psql "$CLOVEERP_LIVE_DATABASE_URL" -v ON_ERROR_STOP=1 -X -q -tA -v id="${REQUEST}" -v code="${CODE}" <<'SQL'
          select coalesce((select r.status from erp_meta.fleet_request r
                            where r.id = :'id'::uuid and r.kind = 'rename' and r.payload ->> 'code' = :'code'), '')
                 || '|' || coalesce((select coalesce(to_jsonb(d) ->> 'address', d.code)
                                       from erp_meta.deployment d where d.code = :'code'), '');
          SQL
          ) || { echo "::warning::the request ${REQUEST} could not be read; it may stay claimed."; exit 0; }
          IFS='|' read -r status address <<< "$row"
          if [[ "$status" != claimed ]]; then
            echo "the request is ${status:-not a rename of ${CODE}}: nothing to settle"
            exit 0
          fi
          if [[ "$address" == "${TO}" ]]; then
            outcome="success: ${CODE} moved from ${FROM} to ${TO}, as the register says; run ${GITHUB_RUN_ID} stopped after the rename finished and before it could settle this request"
            phase_status=done
            said="the rename had finished (the register has ${CODE} at ${TO}); its request is settled as done"
          else
            outcome="failure: run ${GITHUB_RUN_ID} stopped before it could say how the rename of ${CODE} from ${FROM} to ${TO} went; its steps are on the client's row. Ask for the same rename again: every step can be repeated."
            phase_status=failed
            said="the rename stopped before it finished; the request is settled as failed, and asking again carries on from where it is"
          fi
          if ! psql "$CLOVEERP_LIVE_DATABASE_URL" -v ON_ERROR_STOP=1 -X -q -tA -v id="${REQUEST}" -v outcome="${outcome}" > /dev/null <<'SQL'
          select erp_meta.settle_fleet_request(:'id'::uuid, :'outcome');
          SQL
          then
            echo "::warning::the request ${REQUEST} could not be settled; it stays claimed."
          fi
          if [[ "$phase_status" == failed ]]; then
            CLOVEERP_LIVE_DATABASE_URL="$CLOVEERP_LIVE_DATABASE_URL" supabase/ci/fleet_register.sh event "${CODE}" rename failed \
              "the rename from ${FROM} to ${TO} stopped (run ${GITHUB_RUN_ID}); ask for it again, which carries on from where it is" \
              > /dev/null 2>&1 || true
            echo "::error::${said}."
          else
            echo "::warning::${said}."
          fi

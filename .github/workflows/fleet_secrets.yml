name: fleet secrets

# A client deployment's secrets, changed the one way they are changed.
#
# One Supabase project per client (the owner's decision of 7 October), each
# with a database password only the control plane's vault knows, Edge
# Function secrets of its own and auth settings of its own. The plan's day to
# day says how each changes: "Rotate a secret" and "Rename an address" both
# end here, never in a dashboard and never with a value pasted anywhere.
#
#   rotate_db_password    a new database password, generated in the run,
#                         given to the project through the Management API, its
#                         session-pooler connection stored in the control
#                         plane's vault where every release reads it, read
#                         back, and proved by connecting. Also the mend for a
#                         client whose vault entry is missing or stale.
#   set_function_secrets  RESEND_API_KEY (after a new key is made at Resend,
#                         before the old one is revoked), CLOVEERP_APP_URL
#                         (the client's origin, after a rename) and
#                         CLOVEERP_INVITE_FROM.
#   patch_auth            the auth settings a build applies, again: sign-up
#                         closed, addresses confirmed, the site URL and
#                         redirects of the client's address (after a rename),
#                         custom SMTP through Resend with the current key.
#
# code is one client, which must be built or live in the register, or all of
# them; they are done one at a time, with a pause between, and the first that
# fails stops the run with the rest untouched and named. Each client's row in
# the register says what was done and why (supabase/ci/fleet_secrets.sh,
# rehearsed by fleet_secrets_rehearsal.sh on every build). Nothing secret is
# printed: every value is masked before anything could carry it.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to change."
        type: choice
        required: true
        options:
          - rotate_db_password
          - set_function_secrets
          - patch_auth
      code:
        description: "A client's code (built or live in the register), or all."
        type: string
        required: true
      reason:
        description: "Why, in words. It goes on each client's row in the register."
        type: string
        required: true

permissions:
  # Read: whether a release or a build is running (below).
  actions: read
  contents: read

# One at a time: two runs changing the same client's password would each
# store a connection the other had already made stale.
concurrency:
  group: fleet-secrets
  cancel-in-progress: false

jobs:
  secrets:
    name: ${{ inputs.action }} for ${{ inputs.code }}
    runs-on: ubuntu-latest
    # Each client takes a few minutes at most (a rotation waits up to two for
    # the pooler to learn its password) and twenty seconds' pause; three hours
    # is a fleet of forty, and a hung call is still noticed.
    timeout-minutes: 180
    env:
      ACTION: ${{ inputs.action }}
      CODE: ${{ inputs.code }}
      REASON: ${{ inputs.reason }}
      CLOVEERP_LIVE_DATABASE_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APEX: ${{ vars.CLOVEERP_APEX || 'cloveerp.com' }}
      MAIL_FROM: ${{ vars.CLOVEERP_MAIL_FROM || 'noreply@cloveerp.com' }}
      INVITE_FROM: ${{ vars.CLOVEERP_INVITE_FROM || format('Clove ERP <{0}>', vars.CLOVEERP_MAIL_FROM || 'noreply@cloveerp.com') }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Masked, and only from main
        run: |
          set -euo pipefail
          for value in "${CLOVEERP_LIVE_DATABASE_URL}" "${SUPABASE_ACCESS_TOKEN}" "${RESEND_API_KEY}"; do
            if [[ -n "$value" ]]; then
              echo "::add-mask::${value}"
            fi
          done
          # The script that changes every client's secrets is the one main
          # has reviewed, not a branch's.
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::run this from main, where supabase/ci/fleet_secrets.sh has been reviewed and merged; this run is on ${GITHUB_REF}, and nothing was changed."
            exit 1
          fi
          for name in CLOVEERP_LIVE_DATABASE_URL SUPABASE_ACCESS_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not set, so no client's secrets can be changed; nothing was changed."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Nothing is being released, built or drilled
        # A release, a build or a restore drill connects again at every step,
        # with the connection it read from the vault when it began: a password
        # changed under it fails it halfway, with a replay perhaps half
        # applied. So a rotation waits until no deploy.yml run started by a
        # push or by hand (a train), no deployment_from_empty.yml run and no
        # restore_drill.yml run is going. Pull requests' dry runs only read,
        # and are left to fail and be re-run. A train started while this runs
        # can still meet a client mid-change: start the train afterwards.
        if: inputs.action == 'rotate_db_password'
        run: |
          set -euo pipefail
          R="repos/${GH_REPO}"
          for wf in deploy.yml deployment_from_empty.yml restore_drill.yml; do
            if ! going=$(gh api "${R}/actions/workflows/${wf}/runs?per_page=50" \
                           --jq '[.workflow_runs[] | select(.status != "completed" and .event != "pull_request") | .id | tostring] | join(" ")'); then
              echo "::error::GitHub could not be asked whether ${wf} is running, so no password was changed: a release, build or drill running now would lose its connection halfway. Run this again."
              exit 1
            fi
            if [[ -n "$going" ]]; then
              echo "::error::${wf} is running (run ${going}), so no password was changed: it would lose its connection halfway. Run this again once it has finished."
              exit 1
            fi
          done
          echo "no release, build or restore drill is running"

      - name: Change them, one client at a time
        run: |
          set -euo pipefail
          supabase/ci/fleet_secrets.sh "${ACTION}" "${CODE}" "${REASON}"

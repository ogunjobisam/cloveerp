name: fleet secrets
# What the run changes, in its title, where the waits of an export, a backup
# and a rename read it (supabase/ci/fleet_busy.sh): only a run that changes
# database passwords is waited for by what a new password would break, and
# GitHub cannot say that a run skips its rotation step until the run reaches
# it, after its own wait of up to an hour. Changed, change fleet_busy.sh too
# (fleet_busy_rehearsal.sh checks it). Not a script: the inputs are safe here.
run-name: "fleet secrets: ${{ inputs.action }} for ${{ inputs.code }}"

# A client deployment's secrets, changed the one way they are changed.
#
# One Supabase project per client (the owner's decision of 7 October), each
# with a database password only the control plane's vault knows, Edge
# Function secrets of its own and auth settings of its own. The plan's day to
# day says how each changes: "Rotate a secret" and "Rename an address" both
# end here, never in a dashboard and never with a value pasted anywhere.
#
#   rotate_db_password    a new database password, generated in the run,
#                         given to the project through the Management API, its
#                         session-pooler connection stored in the control
#                         plane's vault where every release reads it, read
#                         back, and proved by connecting. Also the mend for a
#                         client whose vault entry is missing or stale.
#   set_function_secrets  RESEND_API_KEY (after a new key is made at Resend,
#                         before the old one is revoked), CLOVEERP_APP_URL
#                         (the client's origin, after a rename) and
#                         CLOVEERP_INVITE_FROM.
#   patch_auth            the auth settings a build applies, again: sign-up
#                         closed, addresses confirmed, the site URL of the
#                         client's address, redirects to it and to every
#                         address it was moved from (held for it for good),
#                         custom SMTP through Resend with the current key.
#
# code is one client, which must be built, live, suspended or retiring in the
# register, or all of them; they are done one at a time, with a pause
# between, each from what the register says just before its turn, and the
# first that fails stops the run with the rest untouched and named. Each
# client's row in the register says what was done and why
# (supabase/ci/fleet_secrets.sh, rehearsed by fleet_secrets_rehearsal.sh on
# every build). Nothing secret is printed: every value is masked before
# anything could carry it.
#
# A rename (fleet_rename.yml) sets the same auth settings and functions'
# address, so the two wait for each other, the earlier first
# (supabase/ci/fleet_busy.sh); and a new database password and a rename, an
# export or a backup, each of which holds a connection it read from the vault
# when it began, wait for each other the same way: a rotation waits for one
# under way or begun before it, and one begun after it waits, just before it
# touches a database, for the rotation's own step ("Change the database
# passwords, one client at a time") to be over. A backup asks from inside its
# own copying, so it waits only for a rotation in that step, and a rotation
# waits for a backup copying whenever it began. Only a run whose title names
# rotate_db_password is waited for as a rotation (run-name, above).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to change."
        type: choice
        required: true
        options:
          - rotate_db_password
          - set_function_secrets
          - patch_auth
      code:
        description: "A client's code (built, live, suspended or retiring in the register), or all."
        type: string
        required: true
      reason:
        description: "Why, in words. It goes on each client's row in the register."
        type: string
        required: true

permissions:
  # Read: whether a release, a build, a rename, an export or a backup is
  # running (below).
  actions: read
  contents: read

# One at a time: two runs changing the same client's password would each
# store a connection the other had already made stale.
concurrency:
  group: fleet-secrets
  cancel-in-progress: false

jobs:
  secrets:
    name: ${{ inputs.action }} for ${{ inputs.code }}
    runs-on: ubuntu-latest
    # Each client takes a few minutes at most (a rotation waits up to two for
    # the pooler to learn its password) and twenty seconds' pause; three hours
    # is a fleet of forty, and a hung call is still noticed.
    timeout-minutes: 180
    env:
      ACTION: ${{ inputs.action }}
      CODE: ${{ inputs.code }}
      REASON: ${{ inputs.reason }}
      CLOVEERP_LIVE_DATABASE_URL: ${{ secrets.CLOVEERP_LIVE_DATABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APEX: ${{ vars.CLOVEERP_APEX || 'cloveerp.com' }}
      MAIL_FROM: ${{ vars.CLOVEERP_MAIL_FROM || 'noreply@cloveerp.com' }}
      INVITE_FROM: ${{ vars.CLOVEERP_INVITE_FROM || format('Clove ERP <{0}>', vars.CLOVEERP_MAIL_FROM || 'noreply@cloveerp.com') }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Masked, and only from main
        run: |
          set -euo pipefail
          for value in "${CLOVEERP_LIVE_DATABASE_URL}" "${SUPABASE_ACCESS_TOKEN}" "${RESEND_API_KEY}"; do
            if [[ -n "$value" ]]; then
              echo "::add-mask::${value}"
            fi
          done
          # The script that changes every client's secrets is the one main
          # has reviewed, not a branch's.
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::run this from main, where supabase/ci/fleet_secrets.sh has been reviewed and merged; this run is on ${GITHUB_REF}, and nothing was changed."
            exit 1
          fi
          for name in CLOVEERP_LIVE_DATABASE_URL SUPABASE_ACCESS_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not set, so no client's secrets can be changed; nothing was changed."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Nothing is being released, built or drilled
        # A release, a build or a restore drill connects again at every step,
        # with the connection it read from the vault when it began: a password
        # changed under it fails it halfway, with a replay perhaps half
        # applied. So a rotation waits until no deploy.yml run started by a
        # push or by hand (a train), no deployment_from_empty.yml run and no
        # restore_drill.yml run is going. Pull requests' dry runs only read,
        # and are left to fail and be re-run. A train started while this runs
        # can still meet a client mid-change: start the train afterwards.
        if: inputs.action == 'rotate_db_password'
        run: |
          set -euo pipefail
          R="repos/${GH_REPO}"
          for wf in deploy.yml deployment_from_empty.yml restore_drill.yml; do
            if ! going=$(gh api "${R}/actions/workflows/${wf}/runs?per_page=50" \
                           --jq '[.workflow_runs[] | select(.status != "completed" and .event != "pull_request") | .id | tostring] | join(" ")'); then
              echo "::error::GitHub could not be asked whether ${wf} is running, so no password was changed: a release, build or drill running now would lose its connection halfway. Run this again."
              exit 1
            fi
            if [[ -n "$going" ]]; then
              echo "::error::${wf} is running (run ${going}), so no password was changed: it would lose its connection halfway. Run this again once it has finished."
              exit 1
            fi
          done
          echo "no release, build or restore drill is running"

      - name: No rename, and for a password no export or backup, is under way
        # A rename sets the auth settings and the functions' address this
        # changes, so one under way, or one that began before this run and
        # has still to make its changes, is waited out, up to an hour; one
        # that began after this run waits for it instead (fleet_busy.sh, so
        # the two never wait for each other). A new database password also
        # breaks an export's or a backup's connection, read from the vault
        # when it began, so a rotation waits for those too; an export that
        # began after this run waits for its passwords instead
        # (fleet_export.yml), and a backup copying is waited for whenever it
        # began, since it asks from inside that step and waits only for a
        # rotation in its own (fleet_backup.sh, fleet_busy.sh runs-in).
        run: |
          set -uo pipefail
          specs=("fleet_rename.yml=Rename, step by step")
          if [[ "${ACTION}" == rotate_db_password ]]; then
            specs+=("fleet_export.yml=Export" "fleet_backup.yml=Copy every database")
          fi
          if ! supabase/ci/fleet_busy.sh wait 60 runs "${specs[@]}"; then
            echo "::error::still under way after an hour (above), so nothing was changed. Run this again once it has finished."
            exit 1
          fi
          echo "nothing is under way that this would meet"

      - name: Change the database passwords, one client at a time
        # A rotation alone, in a step of its own, so that what waits for a
        # new password waits for this and not for every change of secrets:
        # fleet_export.yml and fleet_backup.sh wait while it runs, and
        # fleet_rename.yml while it or the step below runs, by these names
        # (supabase/ci/fleet_busy.sh runs). Before the step below, so a run
        # that changes something else passes it at once; until it reaches
        # it, its title says it is not a rotation (run-name, above). Renamed,
        # rename it there too (fleet_busy_rehearsal.sh checks every name
        # asked about).
        if: inputs.action == 'rotate_db_password'
        run: |
          set -euo pipefail
          supabase/ci/fleet_secrets.sh "${ACTION}" "${CODE}" "${REASON}"

      - name: Change them, one client at a time
        # fleet_rename.yml waits while this step runs, by this name
        # (supabase/ci/fleet_busy.sh runs). Renamed, rename it there too.
        if: inputs.action != 'rotate_db_password'
        run: |
          set -euo pipefail
          supabase/ci/fleet_secrets.sh "${ACTION}" "${CODE}" "${REASON}"

project_id = "xpzffnnhnhcqyjqcueja"

# Private exact-byte archive for issued documents and short-lived previews.
# Browser roles have no object policy; server-side code mints five-minute URLs.
[storage.buckets.document-output]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/pdf"]

# The dispatch worker's cron entrypoint.
#
# It exists in the repository either way; what this block changes is that it is
# now *declared*. An undeclared function is skipped by the branching
# integration, whose warning — "Only Functions declared in config.toml will be
# automatically deployed to branches" — was the only thing that ever said so.
# Until this block, the one component of the product that is not SQL was
# deployed solely by a person running the command in its own header comment.
#
# Only two settings, and both earn their place. entrypoint and enabled are
# omitted deliberately: their defaults are already ./functions/dispatch/index.ts
# and true, and a line that restates a default is a line that can drift from one.
#
#   import_map  is load-bearing. worker/src/core/db.ts imports the bare
#               specifier "postgres", which Deno cannot resolve on its own.
#               Without this the function does not build at all.
#   verify_jwt  matches the deploy flag documented in the function's header.
#               The shared secret it checks is a second gate, not the only one:
#               the work is already gated by B1, but the request rate is not.
[functions.dispatch]
verify_jwt = true
import_map = "./functions/import_map.json"

# The contact form's ingress.
#
# verify_jwt is false, and it is the only function here for which that is true.
# The caller is a visitor to cloveerp.com with no session, which is the whole
# point: erp.assert_public_api_safe() refuses a public.erp_* door executable by
# anon, so the alternative to this function is not a safer door — it is no
# contact form. What the visitor reaches is this file, which holds the
# connection; the refusals, the length bounds and the rate limit are all on the
# far side of it, in erp.record_enquiry().
#
# import_map for the same reason dispatch needs it: worker/src/core/db.ts
# imports the bare specifier "postgres", which Deno cannot resolve on its own.
[functions.enquiry]
verify_jwt = false
import_map = "./functions/import_map.json"

# Passwords.
#
# The two settings the CLI carries. Leaked-password protection (checking a new
# password against the HaveIBeenPwned corpus) is a project setting the CLI does
# not express; it is switched on in the dashboard under Authentication →
# Providers → Email, and the date it was switched on is recorded in
# supabase/ops/README.md. A setting that lives only in a dashboard is a
# setting nobody can review in a diff, which is why the ones that can live here
# do.
[auth]
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"
